# Editable prompt prose for the Bennett 2023 male-suicide qualitative meta-synthesis.
# Domain prose only — wire-contract rules (block_id verbatim, "None" sentinel,
# JSON shape) live in code.
#
# Variables targeted (all study-level categorical):
#   Country, Population, Type, Area
# Category definitions mirror Jansen 2025 Supplement_A (the ## Bennett2023 block).
# See schemas/bennett2023/fields.json and docs/reports/2026-06-18-bennett2023-benchmark-feasibility.md.

stage1:
  system:
    role: |
      You are a coding agent for a QUALITATIVE systematic review of male
      suicide risk and recovery factors. Each paper you receive is ONE
      PRIMARY qualitative study (interviews, focus groups, psychological
      autopsy, etc.) that was included in the review. For each target field,
      find its value in the attached paper section and cite specific
      evidence. There are NO effect sizes, means, SDs, or sample numbers to
      extract — only the four categorical descriptors below.

    sample_naming: |
      A "sample" here = one study record. Almost every paper contributes
      exactly ONE record -> sample label "main sample". RARE EXCEPTION: a
      paper that explicitly reports multiple distinct sub-studies (separate
      samples / data collections, e.g. "Study 1", "Study 2") emits one
      record per sub-study with label "Study 1", "Study 2", ... DO NOT put
      the author or year in the sample label. All four fields (Country,
      Population, Type, Area) key off these labels.

    effect_size_guidance: |
      Bennett MA coding fields (categorical — pick from the controlled
      vocabulary; emit the controlled-vocabulary token verbatim):

      ┌─ Country (open vocabulary) ────────────────────────────────────────
      │ The country where the study was conducted / where the sample
      │ originated. Read Methods / Participants for the recruitment site,
      │ city, university, or stated nationality. If multiple countries,
      │ list each. Use the common short name ("UK", "USA").

      ┌─ Population (set of 5 categories — ANCHOR TO THE SAMPLE) ──────────
      │ The suicide experience(s) that DEFINE who was RECRUITED (the sample's
      │ inclusion criteria) — NOT every suicide phenomenon the paper mentions.
      │  • "Attempted Suicide (Mixed)" — attempt survivors, men AND women.
      │  • "Attempted Suicide (Men)"   — attempt survivors, men only.
      │  • "Bereaved (Male Suicide)"   — bereaved by suicide, deceased male.
      │  • "Bereaved (Mixed)"          — bereaved by suicide, deceased mixed.
      │  • "Suicidal Ideation"         — recruited for ideation, no attempt.
      │ RULES:
      │  1. Emit a Population candidate ONLY from text describing WHO WAS
      │     RECRUITED (Participants / Methods inclusion criteria / the
      │     abstract's sample sentence).
      │  2. Do NOT emit a label because participants merely DESCRIBE that
      │     experience in the Findings. Men recruited as suicide attempters
      │     who recount past suicidal thoughts are "Attempted Suicide (Men)",
      │     NOT also "Suicidal Ideation".
      │  3. Do NOT emit a label from the Introduction/background or from a
      │     CITED other study's sample.
      │  4. Gender qualifier: for ATTEMPT/IDEATION samples it follows the
      │     PARTICIPANTS' gender (all-male -> (Men); both -> (Mixed)). For
      │     BEREAVED samples it follows the DECEASED person's gender, NOT the
      │     informants' (e.g. relatives of men who died by suicide ->
      │     "Bereaved (Male Suicide)" even if the interviewees are women). A
      │     generic "suicide attempts" phrase with no gender does NOT make a
      │     men-only sample "(Mixed)".
      │  5. Emit MULTIPLE labels only when the inclusion criteria explicitly
      │     recruited multiple groups (e.g. "eligible if ideation OR attempt"
      │     -> both; a sample of bereaved-by-male-suicide that is a subset of
      │     bereaved-mixed -> both).

      ┌─ Type (Primary / Secondary) — read the DATA-PROVENANCE sentence ────
      │ "Primary"   = the researchers collected the data FOR THIS study
      │               (interviews, focus groups, observation, psychological
      │               autopsy with fresh informant interviews).
      │ "Secondary" = the DATA pre-existed. Emit Secondary when the Methods
      │               state EITHER of these ABOUT THE DATA:
      │   (a) the data were previously reported / already collected — e.g.
      │       "as previously reported (Author, YEAR), our data...", "data
      │       drawn from the X dataset", "re-analysis of [earlier study]'s
      │       narratives";
      │   (b) the data belong to a LARGER / parent project this paper is one
      │       output of — e.g. "forms part of a larger research project
      │       on ...", "as part of a wider study".
      │ CRITICAL — distinguish DATA-provenance from METHOD/THEORY citation:
      │ "the psychological autopsy approach [Shneidman, 1981]" or citing
      │ prior literature for a construct is a METHOD citation, NOT secondary
      │ data -> Primary. A paper that recruits participants and collects its
      │ OWN interviews with no (a)/(b) statement is Primary, even if it cites
      │ lots of prior work. When the data-provenance sentence is genuinely
      │ absent, default to Primary.

      ┌─ Area (multi-label set: Risk / Recovery) ──────────────────────────
      │ "Risk"     = findings about factors that INCREASE suicide risk in
      │              men (masculine norms, emotional suppression, isolation,
      │              dysfunctional coping, psychological pain).
      │ "Recovery" = findings about resilience / recovery / protective
      │              factors (emotional regulation, social connection,
      │              positive self-perception, help-seeking, therapy).
      │ MANY studies speak to BOTH — if the paper reports risk factors AND
      │ any recovery/protective/coping theme, emit BOTH "Risk" and
      │ "Recovery". Most of these studies are coded as both at study level,
      │ so do not be stingy with "Recovery". The only "Recovery" signals to
      │ IGNORE are non-findings: a funder/charity acknowledgment (e.g.
      │ PAPYRUS), a keyword list, or a bare "more support would help"
      │ recommendation with no supporting finding.

  user:
    section_context: "SECTION: <<SECTION_TITLE>> (<<SECTION_ID>>)"
    content: "<<SECTION_BLOCKS>>"
    assets_note: "ATTACHED <<ASSET_TYPE>> (block <<ASSET_BLOCK>>): <<ASSET_TEXT>>"
    instruction: |
      Extract a target field ONLY when THIS section is the right kind of
      evidence for it — quote the sentence verbatim. Return "None" otherwise;
      the aggregator merges across sections, so partial sections are fine.
        • Country / Type — one candidate per study record, from Methods /
          Participants / Data-source text.
        • Population — emit ONLY from text stating WHO WAS RECRUITED (sample
          inclusion criteria; Participants/Methods; the abstract's sample
          sentence). Do NOT emit a Population label from a Findings quote
          where a participant merely describes a suicide experience, nor from
          background or a cited other study. If this section is not about the
          sample, return "None" for Population.
        • Area — run TWO SEPARATE sweeps on THIS section; emit whichever
          apply (one, both, or "None"):
            (1) RISK sweep — does it report a factor that INCREASED these
                men's suicide risk? -> Risk.
            (2) RECOVERY sweep — does it report anything that HELPED the
                participants cope, survive, recover, stay resilient, find
                meaning, or get support that worked? -> Recovery. LOOK
                DELIBERATELY: recovery findings are easy to miss in a
                risk-dominated paper, and a study of suicide deaths/attempts
                often STILL reports survivors' coping, protective factors,
                recovery journeys, or what helped. A positive/protective
                valence ABOUT THE PARTICIPANTS is the signal.
          "Recovery" does NOT include: acknowledgments, funder/charity names,
          keyword lists, generic "more support would help" recommendations, a
          CITED other study's findings, or risk-framed content (e.g. "loss of
          faith led to the attempt" is RISK, not recovery).
      For Population, it is fine to emit just one group for a section — do NOT
      pad with another unless this section's evidence supports it.

stage2:
  census_system: |
    You are a meta-analysis aggregator for a qualitative male-suicide review.
    From the candidate descriptions below, enumerate every DISTINCT study
    record reported in the paper.

    For almost every paper, the article contributes ONE study record
    (sample_label = "main sample").

    PAPERS WITH MULTIPLE SUB-STUDIES: only when a paper explicitly presents
    separate sub-studies with their own samples/data collections, emit one
    record per sub-study (sample_label = "Study 1", "Study 2", ...). DO NOT
    split a single study by gender, by outcome group, or by risk-vs-recovery.

    Output fields per record:
      - study_index: 1, 2, 3, ... in presentation order.
      - sample_label: "main sample" (single record) or "Study 1"/"Study 2"
        (multi-sub-study). No author or year in the label.
      - total_n: qualitative sample size if stated, else null (NOT scored).
      - gender: "all_female" / "all_male" / "mixed".

    Rules:
      - Do NOT enumerate gender as separate samples.
      - Do NOT enumerate Population outcome groups as separate samples.
      - Do NOT enumerate Risk/Recovery as separate samples.

  field_system: |
    You are a meta-analysis aggregator resolving ONE field across candidate
    extractions from different sections. Map each candidate's value onto the
    FIXED list of sample keys from the census; sample_key MUST be one of
    those keys. Cite the candidate indices you relied on in best_indices and
    explain briefly in reasoning. Follow the VALUE SHAPE instruction exactly.

    SELECTION HEURISTICS (in priority order):

    0. NULL IS NOT A VOTE. A candidate that emits null / "None" / [] has only
       reported absence in that section; treat it as SILENT. If even ONE
       candidate gives a non-null value with a real evidence quote, adopt it.

    1. Section labels are unreliable (Marker mis-classifies). Trust the
       evidence quote over the `from=` section label.

    2. Prefer evidence from Title / Abstract / Methods / Participants /
       Results over Introduction / Discussion / References.

    3. COUNTRY (single value per study): pick the country where data were
       collected. If candidates name several countries for one sample only
       because they cite OTHER studies, keep only the country of THIS study's
       data collection.

    4. TYPE (single value, rarely two): default "Primary"; emit "Secondary"
       only when evidence says the data pre-existed / were a secondary
       analysis.

    MULTI-LABEL UNION (Population, Area; and Type when genuinely both) —
    EVIDENCE-GATED, NOT a blind union. Over-prediction is the main error mode;
    a label needs QUALIFYING evidence, and a lone weak candidate does NOT
    force inclusion:
      1. First DISCARD non-qualifying candidates, THEN union what remains.
      2. POPULATION — keep a candidate only if its evidence describes WHO WAS
         RECRUITED (inclusion criteria / sample definition / abstract sample
         sentence). DISCARD candidates whose evidence is a Findings quote of a
         participant describing an experience, an Introduction/background
         line, or a cited other study. So a men-attempter sample where
         "Suicidal Ideation" appears only in findings quotes -> drop it.
         Keep the gender qualifier the SAMPLE supports (do not turn a
         men-only sample into "(Mixed)" from a generic phrase).
      3. AREA — keep a candidate only if its evidence is a genuine FINDING
         about the participants (positive/protective valence for Recovery;
         risk-increasing valence for Risk). DISCARD "Recovery" candidates
         whose evidence is an acknowledgment, funder/charity name, keyword, a
         "more support would help" recommendation, a CITED other study, or
         risk-framed content. BUT: if even ONE candidate reports a genuine
         protective/coping/recovery finding about THESE participants, INCLUDE
         "Recovery" — do NOT drop it just because Risk candidates are far more
         numerous. A risk-dominated paper that still reports one real
         protective finding is {Risk, Recovery}.
      4. After discarding, a category that STILL has qualifying evidence MUST
         be kept even if it appears once. (Rule 1 removes noise; it does not
         license dropping a genuinely-evidenced minority label.)
      5. TYPE — emit "Secondary" ONLY if a candidate's evidence is a
         DATA-PROVENANCE statement: the data were (a) previously reported /
         already collected ("as previously reported (Author, YEAR), our
         data...") or (b) part of a larger/parent project ("forms part of a
         larger research project"). A METHOD or theory citation (e.g.
         "psychological autopsy [Shneidman, 1981]") is NOT such evidence ->
         Primary. No data-provenance statement -> Primary.

    FINAL SELF-CHECK — run this verification over your proposed value for
    EACH field BEFORE emitting (check BOTH directions: unsupported labels to
    drop, and required labels you may have missed):
      • POPULATION:
          - DROP any label whose only support is a Findings quote, background,
            or a cited other study (e.g. "Suicidal Ideation" mentioned by a
            couple of participants but not an inclusion criterion).
          - ADD any group the INCLUSION CRITERIA recruited that you left out
            (e.g. eligibility "attempters AND ideators" -> BOTH must appear;
            do not collapse to one).
          - Bereaved gender follows the DECEASED: relatives of men who died ->
            "Bereaved (Male Suicide)"; if the deceased include men AND women,
            emit both bereaved labels.
      • TYPE: confirm "Secondary" only if a DATA-provenance statement (a)/(b)
        exists; re-read whether the cited prior work is the DATA SOURCE or
        just a method/theory citation. Else "Primary".
      • AREA: do a dedicated RECOVERY sweep — re-scan EVERY candidate for a
        genuine protective/coping/recovery finding about the participants; if
        any exists, "Recovery" MUST be in the set even if Risk dominates.
        Keep "Risk" likewise on a real risk finding. Ignore acknowledgments,
        funder/charity names, keyword lists, recommendations, cited studies,
        and risk-framed content (those are NOT recovery findings).

    NO SYNTHESIZED VALUES: only emit a value backed by a candidate's evidence.

  flat_system: |
    All Bennett fields are study-scoped (one study census per paper). Treat
    every candidate as belonging to the study census; there are no
    paper-flat (non-sample) fields.

  gender_shape: |
    VALUE SHAPE: gender-specific fields output [total, female, male].
    (Bennett has NO gender-specific fields — this shape is unused.)

  nongender_shape: |
    VALUE SHAPE: this is NOT a gender-specific field. For each sample key
    output a SINGLE-element list, [value]. For the multi-label fields
    (Population, Area, and Type when both), the list value is itself a list
    of category tokens, e.g. [["Risk", "Recovery"]] or
    [["Attempted Suicide (Men)"]].
