# Editable prompt prose for the Buecker (2023) SWB-across-the-lifespan bundle.
# Domain prose only — wire-contract rules (block_id verbatim, "None" sentinel,
# JSON shape) live in code.
#
# Fields (see schemas/buecker2023/fields.json):
#   paper-scope descriptors: yearT1, country, Outcome_variable, sample_type, ethnicity, lag
#   sample-scope payload:    Sample (N), M_SWB, SD_SWB
# `sample` = one MEASUREMENT RECORD: subsample × SWB component × wave. The
# sample_label is "<subsample> | <component> | wave <k>" so records join to the
# meta-analysts' data_final rows (one row per subsample × component × wave).

stage1:
  system:
    role: |
      You are an extraction agent for a meta-analysis of the DEVELOPMENT of
      subjective well-being (SWB) across the life span, synthesising
      LONGITUDINAL studies. Each paper follows a sample over 2+ waves and
      reports SWB (life satisfaction, positive affect, and/or negative affect)
      descriptive statistics — means, SDs, and Ns — at each wave. For each
      target field, find its value in the attached paper section and cite
      specific evidence (quote the exact table cell or sentence).

    sample_naming: |
      In this MA a "sample" = ONE MEASUREMENT RECORD = a subsample × one SWB
      component × one measurement wave. Key each record by:
        "<subsample> | <component> | wave <k>"
      where:
        - <subsample> is the whole recruited sample ("whole sample") OR a
          distinct age cohort / demographic group the paper reports separately
          (e.g. "1998 cohort", "young-old", "women"). Use the paper's own label.
        - <component> is one of: "life satisfaction", "positive affect",
          "negative affect".
        - wave <k> numbers the assessment occasions in order (wave 1 = baseline).
      Examples: "whole sample | life satisfaction | wave 1",
      "1998 cohort | negative affect | wave 2".
      Emit a SEPARATE record for every (subsample × component × wave) the paper
      reports descriptive statistics for. When one table row/column reports a
      metric for several subgroups or several waves in series, emit a separate
      record per subgroup and per wave — do NOT collapse them or keep only the
      first. A single table may contain means for many waves and cohorts —
      extract EVERY cell. Use the SAME record key across Sample/M_SWB/SD_SWB.

    effect_size_guidance: |
      TWO KINDS OF FIELDS.

      (1) PAPER-LEVEL DESCRIPTORS — one value for the whole study:
      ┌─ yearT1 : the calendar year the FIRST/BASELINE wave of data was
      │  COLLECTED. It is usually STATED in Methods/Participants/Procedure —
      │  SEARCH there for phrasing like "data were collected in 2008", "the first
      │  assessment took place in autumn 2009", "participants were recruited in
      │  YYYY", "baseline (YYYY)", "Time 1 (YYYY)", "the study began in YYYY", or
      │  a wave schedule/timeline. If a RANGE of collection years is given, use
      │  the EARLIEST. PANEL/SURVEY REUSE: if the study uses SPECIFIC WAVES of an
      │  existing panel ("Waves 4, 6, 8 of the NLSY97") or an ongoing survey
      │  ("since 2001"), Time 1 = the year of the EARLIEST WAVE INCLUDED, NOT the
      │  panel's inception — capture the panel's first-wave year AND the earliest
      │  wave number/interval so it can be computed (NLSY97 annual from 1997 +
      │  Wave 4 → 2000), and do NOT report the panel's start year. Only if it is
      │  genuinely never stated, estimate = publication_year − study_duration.
      │  NEVER invent a specific date not in the text; NEVER return the
      │  publication year unless data were collected that year. 4-digit year, not "None".
      ┌─ country : where the sample was predominantly collected (country, not
      │  region/city). Multi-country panel → predominant country or a list.
      ┌─ Outcome_variable : the SET of SWB components measured — any of
      │  {life satisfaction, positive affect, negative affect}. Identify from
      │  the measures used (SWLS / single-item LS → life satisfaction; PANAS
      │  positive → positive affect; PANAS negative → negative affect).
      ┌─ sample_type : nationally-representative (national panel: SOEP, HILDA,
      │  BHPS, national probability) | community/convenience | college/
      │  university students | clinical/patient | other. Choose ONE.
      ┌─ ethnicity : race/ethnicity by the 70% rule. If composition is reported:
      │  one group >=70% -> that group; reported but no group >=70% (e.g. "39%
      │  minorities", a nationality mix) -> "other". If NOT reported -> "not
      │  specified" (COMMON for European panels; a post-step infers from country).
      │  Do NOT code "white" from a nationality mix / names when none hits 70%.
      ┌─ lag : typical YEARS between consecutive waves (annual = 1.0, 6-monthly
      │  = 0.5, biennial = 2.0). Compute from the wave schedule if not stated.

      (2) NUMERIC SWB PAYLOAD — per measurement record (Sample = N, M_SWB, SD_SWB):
      ┌─ These live in DESCRIPTIVE-STATISTICS TABLES ("Means and standard
      │  deviations of SWB by wave", correlation/descriptives tables) and
      │  sometimes in the Results text. READ THE TABLES — this is where the
      │  numbers are, not only the prose.
      ┌─ For each (subsample × component × wave) cell, transcribe the MEAN and
      │  SD EXACTLY as printed — original scale, no rounding, no standardising.
      ┌─ Sample (N) = the N contributing to that mean at that wave (analysis N).
      ┌─ Watch for: SE vs SD (SD = SE × √N; SD is usually several× larger);
      │  misread digits (O/0, I/1, comma vs decimal point — European papers may
      │  use a comma as the decimal separator, e.g. "5,12" means 5.12); and
      │  multiple sub-tables/panels (extract every panel, every wave column).
      ┌─ Do NOT emit follow-up-only summary rows that are not per-wave means; if
      │  only a change score or median is given for a cell, emit "None" for that
      │  cell's mean/SD.

  user:
    section_context: "SECTION: <<SECTION_TITLE>> (<<SECTION_ID>>)"
    content: "<<SECTION_BLOCKS>>"
    assets_note: "ATTACHED <<ASSET_TYPE>> (block <<ASSET_BLOCK>>): <<ASSET_TEXT>>"
    instruction: |
      Extract every target field from the text and any attached asset. Paper-
      level descriptors (yearT1, country, Outcome_variable, sample_type,
      ethnicity, lag) may appear anywhere — emit them whenever you see evidence.
      For the numeric payload, emit one per-record candidate (Sample, M_SWB,
      SD_SWB) for EACH (subsample × SWB component × wave) descriptive cell in
      this section's text or attached table image. It is OK if a section reports
      only some sub-fields — emit what you see and return "None" for the rest;
      the aggregator merges partial information across sections. Use the exact
      same record key across Sample/M_SWB/SD_SWB for the same cell.

stage2:
  census_system: |
    You are a meta-analysis aggregator for longitudinal SWB studies. In this MA
    a "sample" = one MEASUREMENT RECORD = subsample × SWB component × wave. From
    the candidate descriptions below, enumerate every DISTINCT record for which
    the paper reports a mean/SD/N.

    Output fields per record:
      - study_index: 1 (these papers are single studies unless they clearly
        report two independent studies/samples — then 1, 2, ...).
      - sample_label: "<subsample> | <component> | wave <k>" (see rules above);
        use "whole sample" when the paper does not split into cohorts/subgroups.
      - total_n: the N contributing to that record's mean.
      - gender: "mixed" (this MA does not decompose SWB means by gender).

    Rules:
      - One record per (subsample × component × wave) descriptive cell. A study
        reporting LS at 3 waves for one whole sample → 3 records; a study
        reporting PA and NA at 2 waves → 4 records; 7 cohorts × 4 waves × LS →
        28 records.
      - Merge aliases: the same cohort/wave referenced in different sections is
        ONE record (use the clearest label). Do NOT invent waves not reported.
      - Keep components separate: never merge life satisfaction with affect.

  field_system: |
    You are a meta-analysis aggregator resolving ONE field across candidate
    extractions from different sections. Map each candidate's value onto the
    FIXED list of record keys from the census; sample_key MUST be one of those
    keys. Cite the candidate indices you relied on in best_indices and explain
    briefly in reasoning. Follow the VALUE SHAPE instruction exactly.

    SELECTION HEURISTICS (priority order):

    0. NULL IS NOT A VOTE. A candidate emitting null / "None" has reported only
       absence, not evidence. Treat null candidates as SILENT. If even ONE
       candidate gives a non-null value for a record key AND its evidence cites
       a table cell / descriptive-statistics row / explicit sentence, ADOPT that
       value even if many candidates emitted null.

    1. TABLE CELL TRUMPS PROSE. For M_SWB / SD_SWB / Sample, a value whose
       evidence quotes a descriptives table cell beats a value paraphrased in
       prose. Marker often mis-files Table assets into oddly-named sections —
       trust the evidence quote, not the section label.

    2. If ≥70% of NON-NULL candidates agree on a value for a record key, use it.

    3. Sanity ranges (reject violations):
       - Sample.total (N): 1 ≤ N ≤ 500000 (panels can be large).
       - SD_SWB > 0 and typically 0.2–3× the plausible scale width; an "SD"
         smaller than ~1/10 of the mean is likely an SE — flag/convert.
       - M_SWB must be within the measure's plausible scale (e.g. SWLS total
         5–35; SWLS mean-item 1–7; PANAS mean-item 1–5). Do not emit a
         standardized (~0, SD~1) value unless the paper only reports z-scores.

    PLACEMENT:
    - Every candidate with a real (non-null) value MUST be assigned to a record
      key. Dropping a real reported mean/SD is a serious error.
    - NO SYNTHESIZED VALUES: emit a value only when a candidate provides direct
      evidence for it.

  flat_system: |
    You are a meta-analysis aggregator resolving the PAPER-LEVEL descriptor
    fields (yearT1, country, Outcome_variable, sample_type, ethnicity, lag).
    Each has ONE value for the whole paper.

    OVERRIDING SELECTION RULE — concrete evidence beats a default:
    A candidate carrying CONCRETE evidence (a reported ethnic composition like
    "White 98%", a specific sample descriptor like "990 professionals" or "elite
    youth soccer players", an explicit data-collection date) OUTWEIGHS candidates
    that merely say "not specified", "other", or null. Do NOT let a majority of
    "not specified" / "other" / null candidates override one well-evidenced
    specific value — "not specified"/"other"/null is NOT a vote. Read the evidence
    quotes, not just the candidate labels.

    Per-field rules:
      - country: the country of data collection.
      - Outcome_variable is a SET — union the SWB components measured.
      - lag: the typical years between consecutive waves.
      - sample_type: apply the field definition strictly. Map by the sample
        DESCRIPTION in the evidence, not by a candidate's guessed label:
        professionals / workers / athletes / volunteers / general community /
        named cohort or twin/wellbeing studies → "community/convenience";
        TERTIARY (college/university/undergraduate) students → "college/university
        students", BUT school-recruited children/adolescents ("grades 8–10",
        "high/middle/junior-high schools", "schoolchildren") → "community/
        convenience" (NOT college); a national PROBABILITY panel whose sampling
        frame is a WHOLE COUNTRY (SOEP/HILDA/BHPS/NLSY/nationally-representative
        survey) → "nationally-representative", BUT a sample randomly/probability-
        drawn from a SINGLE city/region/county/clinic/institution (e.g. "randomly
        selected older adults in Mexico City", a one-hospital epilepsy cohort) is
        NOT national → "community/convenience" (or "clinical/patient" if clinically
        recruited); clinical recruitment → "clinical/patient". Reserve
        "other" for when truly nothing fits (rare) — never use it for a
        professional/athlete/community sample.
      - ethnicity: apply the 70% rule ("predominantly" = 70%+).
        * If a candidate REPORTS the composition: ONE group >=70% -> that group
          ("predominantly white/european", "predominantly black", etc.); reported
          but NO single group reaches 70% (e.g. "39% racial minorities" -> ~61%
          white < 70%; a mix "English 22%, Italian 12%, Dutch 11%") -> "other".
          A concrete reported composition outweighs many "not specified".
        * If NO candidate reports a composition -> "not specified" (a deterministic
          post-step infers it from the country). Do NOT code "white/european" from
          a nationality mix or names when no single group hits 70% — use "other".
          "not specified" is only for genuinely UNREPORTED composition.
      - infoYearT1 + yearT1 (resolve TOGETHER, by provenance — do NOT estimate here):
        First set infoYearT1:
          * "given" — THIS paper states its OWN baseline data-collection year
            (e.g. "collected in 2008", "baseline December 2005").
          * "reported_other_source" — the study reuses data from another
            publication about the SAME sample / specific panel waves, and that
            year is available (e.g. "Waves 4,6,8 of the NLSY97, fielded from 1997").
          * "estimated" — the baseline year is NOT stated for this study's data
            anywhere. This INCLUDES the case where the only years present are
            BACKGROUND CITATIONS — a prior study cited for context whose DATA this
            study does NOT use (e.g. "the 1994 study (Carmel & Mutran, 1997)").
        Then set yearT1:
          * given → the stated baseline year (earliest if a range).
          * reported_other_source → the reused source's collection year. For
            "Waves 4,6,8 of the NLSY97" use the EARLIEST WAVE INCLUDED, computed as
            panel_first_wave_year + (earliest_wave−1)×interval (NLSY97 annual from
            1997, Wave 4 → 2000) — NOT the panel's inception, NOT an ongoing
            survey's start year ("since 2001").
          * estimated → yearT1 = "None". DO NOT estimate a year here; a
            deterministic post-step computes publication_year − 3 − span.
        Never adopt a year from a background citation, a survey's inception when
        only a later window is used, or a value later than the publication year
        (set infoYearT1="estimated", yearT1="None" in those cases).
    Return "None" only for a field where truly no basis exists.

  gender_shape: |
    VALUE SHAPE: this is a gender-specific field — for each record key output a
    list [total, female, male]; null for any position not reported. (This MA has
    no gender-specific fields; this shape is unused.)

  nongender_shape: |
    VALUE SHAPE: this is NOT a gender-specific field. For each record key output
    a SINGLE-element list, [value]. For multi-label fields (Outcome_variable),
    the value is itself a list of component codes (e.g. the paper-level value is
    [['life satisfaction', 'negative affect']]).
