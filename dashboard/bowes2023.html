<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Dashboard — reference vs extracted</title>
<style>
:root {
  --bg:#f8f9fa; --text:#212529; --border:#dee2e6;
  --header-bg:#343a40; --header-text:#f8f9fa;
  --cell-border:rgba(150,150,150,0.4);
  --full:rgba(72,199,116,0.28); --partial:rgba(255,221,87,0.34);
  --none:rgba(255,99,99,0.24); --neutral:rgba(200,200,200,0.12);
  --full-s:#48c774; --partial-s:#ffdd57; --none-s:#ff6363; --neutral-s:#ccc;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:13px; background:var(--bg); color:var(--text); line-height:1.4; }
.topbar { background:#fff; border-bottom:2px solid var(--border); padding:12px 18px; }
.topbar h1 { font-size:1.2rem; font-weight:700; }
.topbar .sub { color:#6b7280; font-size:12px; margin-top:2px; }

/* assets */
.assets { margin:12px 0; border:1px solid var(--border); border-radius:8px; background:#fcfcfd; }
.assets > summary { cursor:pointer; padding:10px 14px; font-weight:600; color:#1d4ed8; list-style:none; }
.assets > summary::before { content:'▸ '; }
.assets[open] > summary::before { content:'▾ '; }
.assets-body { padding:6px 14px 14px; }
.asset-group { margin-top:10px; }
.asset-group > .gh { font-weight:700; font-size:12px; color:#374151; text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
.asset details { border:1px solid var(--border); border-radius:6px; margin:5px 0; background:#fff; }
.asset details > summary { cursor:pointer; padding:6px 10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#0f172a; }
.asset pre { margin:0; padding:10px 12px; border-top:1px solid var(--border); background:#0f172a; color:#e2e8f0; font-size:11.5px; line-height:1.5; overflow:auto; max-height:420px; }

/* standard toggle + metric panels */
.stdtoggle { margin:12px 0 6px; display:flex; gap:18px; align-items:center; font-size:13px; }
.stdtoggle label { cursor:pointer; }
.stdtoggle .hint { color:#6b7280; font-size:12px; }
.panels { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .panels { grid-template-columns:1fr; } }
.panel { border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff; }
.panel.active { border-color:#1d4ed8; box-shadow:0 0 0 2px rgba(29,78,216,.12); }
.panel h3 { font-size:13px; margin-bottom:8px; }
.panel h3 .tag { font-weight:500; color:#6b7280; }
.bigrow { display:flex; gap:16px; margin:6px 0 8px; }
.big b { font-size:1.45rem; font-weight:700; display:block; line-height:1; }
.big span { font-size:11px; color:#6b7280; }
.counts { font-size:11.5px; color:#6b7280; margin-bottom:8px; }
table.fm { width:100%; border-collapse:collapse; font-size:11.5px; }
table.fm th, table.fm td { padding:3px 6px; border-bottom:1px solid var(--border); text-align:right; }
table.fm th:first-child, table.fm td:first-child { text-align:left; }
table.fm th { color:#6b7280; font-weight:600; }

/* controls */
.controls { position:sticky; top:0; z-index:1000; background:#fff; border-bottom:2px solid var(--border); padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.controls label { font-weight:600; font-size:12px; }
.controls input[type=text], .controls select { padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; }
.controls input[type=text] { width:200px; }
.controls .sep { border-left:1px solid var(--border); height:26px; }
.controls .badge { background:#e9ecef; padding:2px 8px; border-radius:10px; font-size:11px; color:#495057; }
.legend { display:flex; gap:12px; align-items:center; font-size:11px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-swatch { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,0.15); }

/* table */
.table-wrap { overflow:auto; max-height:calc(100vh - 60px); }
table.grid { border-collapse:separate; border-spacing:0; min-width:100%; }
.grid thead th { position:sticky; top:0; z-index:100; background:var(--header-bg); color:var(--header-text); padding:8px 10px; font-size:11px; font-weight:600; text-align:left; white-space:nowrap; border-right:1px solid rgba(255,255,255,0.1); min-width:150px; }
.grid thead th.evald::after { content:" \2605"; color:#ffd43b; }
.grid thead th:first-child { left:0; z-index:200; min-width:170px; max-width:220px; }
.grid tbody td { vertical-align:top; padding:4px 6px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); min-width:150px; }
.grid tbody td:first-child { position:sticky; left:0; z-index:50; background:#fff; font-weight:600; font-size:12px; min-width:170px; max-width:220px; word-break:break-word; border-right:2px solid var(--border); }
.cell { border:1px solid var(--cell-border); border-radius:4px; padding:4px 6px; cursor:pointer; min-height:24px; transition:box-shadow .15s; }
.cell:hover { box-shadow:0 0 0 2px rgba(66,133,244,0.3); }
.cell.pinned { box-shadow:0 0 0 2px rgba(66,133,244,0.6); }
.cell.full { background:var(--full); } .cell.partial { background:var(--partial); }
.cell.none { background:var(--none); } .cell.neutral { background:var(--neutral); }
.sub { margin-bottom:3px; } .sub:last-child { margin-bottom:0; }
.sub-h { font-weight:600; font-size:11px; color:#495057; }
.empty-val { color:#aaa; font-style:italic; }
.tooltip { position:fixed; z-index:5000; background:#fff; border:1px solid #aaa; border-radius:6px; padding:10px 12px; max-width:520px; min-width:220px; box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:12px; line-height:1.5; display:none; }
.tooltip.pinned { pointer-events:auto; }
.tt-row { margin-bottom:5px; } .tt-label { font-weight:700; color:#333; }
.tt-klass { display:inline-block; padding:1px 8px; border-radius:999px; font-weight:700; font-size:11px; background:#eef; }
.tt-std { font-size:11px; color:#374151; }
.tt-gold { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-src { color:#6b7280; font-size:11px; }
.tt-ev { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-ev .q { color:#333; } .tt-ev .meta { color:#6b7280; font-size:11px; }
</style>
</head>
<body>
<div class="topbar">
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>

  <details class="assets" id="assetsPanel">
    <summary>Customizations — prompts · schema · field definitions · rules (click to expand)</summary>
    <div class="assets-body" id="assetsBody"></div>
  </details>

  <div class="stdtoggle">
    <strong>Standard:</strong>
    <label><input type="radio" name="std" value="strict" checked> Strict (exact match)</label>
    <label><input type="radio" name="std" value="widened"> Widened (reference within extraction)</label>
    <span class="hint">— toggles cell coloring; both panels below always shown</span>
  </div>
  <div class="panels">
    <div class="panel" id="panelStrict"></div>
    <div class="panel" id="panelWidened"></div>
  </div>
</div>

<div class="controls">
  <label>View:</label>
  <select id="viewMode"><option value="all">All papers</option><option value="single">Single paper</option></select>
  <select id="paperSelect" style="display:none"></select>
  <div class="sep"></div>
  <label>Search:</label><input type="text" id="searchBox" placeholder="Filter papers...">
  <div class="sep"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--full)"></div>exact (correct)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--partial)"></div>contains (→correct if widened)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--none)"></div>wrong / missing</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--neutral)"></div>no gold</div>
  </div>
  <div class="sep"></div>
  <span class="badge" id="paperCount"></span>
</div>

<div class="table-wrap"><table class="grid"><thead><tr id="headerRow"></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="tooltip" id="tooltip"></div>

"md": 11, "precision": 0.4606741573033708, "recall": 0.7884615384615384, "f1": 0.5815602836879433, "accuracy": 0.41}}}, "overall": {"counts": {"exact": 430, "contains": 206, "wrong": 213, "missing": 46}, "strict": {"ced": 430, "ied": 419, "md": 46, "precision": 0.5064782096584217, "recall": 0.9033613445378151, "f1": 0.649056603773585, "accuracy": 0.48044692737430167}, "widened": {"ced": 636, "ied": 213, "md": 46, "precision": 0.7491166077738516, "recall": 0.9325513196480938, "f1": 0.8308295231874592, "accuracy": 0.7106145251396648}}}, "assets": [{"group": "Extractor (prompt + wire schema are in this script)", "title": "scripts/extract_bowes.py", "text": "\"\"\"Unified Bowes extractor: read each paper ONCE and emit ALL 9 Jansen variables\ntogether — study-level (YearOfPub, CTType, COVID), per-sample (N, female%,\nrecruitment), and per-effect-size (outcome, es, N). Outcome (study-level) is the\nunion of the effect-size outcomes, so it is derived, not asked twice.\n\nSingle-pass by design: every variable lives in the same correlation matrix /\ndemographics table, so one read keeps them mutually consistent (sample N matches\nits effect sizes; the construct set matches the matrix) and halves the API cost\nvs reading the paper twice.\n\nOUR METHOD vs Jansen: input is Marker markdown + per-table TEXT GRIDS + the table\nIMAGES (multimodal), with explicit \"read the conspiracy row/column\" guidance,\nscale->token mapping, per-sample attribution, and evidence capture. Jansen used\nPyPDF2 plaintext (es accuracy ~0.16-0.26); reading the table image+grid should\nbeat it. Jansen's verbatim effect-size prompt is kept at\nschemas/bowes2023/jansen_effectsize_prompt.txt for an optional ablation.\n\nOutput: data/runs/jansen_bowes2023/<paper>/extraction.json\n  {\"conspiracy_measure\", \"study\":{...}, \"samples\":[...], \"effect_sizes\":[...], \"_meta\":{...}}\n\nUsage:\n  source /projects/envs/miniconda3/etc/profile.d/conda.sh && conda activate research\n  PYTHONPATH=src python scripts/extract_bowes.py\n  PYTHONPATH=src python scripts/extract_bowes.py --only Betsch2018\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\nfrom mag.preprocessing.manifest_normalizer import normalize_manifests\nfrom mag.preprocessing.section_builder import build_sections\nfrom mag.providers.base import Asset as WireAsset\nfrom mag.providers.gemini import GeminiProvider\nfrom mag.settings import Settings\n\nREPO = Path(__file__).resolve().parent.parent\nPROCESSED = REPO / \"data\" / \"processed\" / \"bowes2023\"\nRUNS = REPO / \"data\" / \"runs\" / \"jansen_bowes2023\"\nMAX_IMAGES = 12  # correlation matrices are the priority; cap to control tokens\n\n# The 53 valid construct tokens (gold vocabulary). Used to drop outcomes that are\n# not real constructs (e.g. the model occasionally leaks a CTType token \"General\").\nWHITELIST_TOKENS = {\n    \"Delusion\", \"Anthro\", \"BSR\", \"IOA\", \"PNR\", \"Dog\", \"ConjFall\", \"NeedClose\", \"REIR\", \"NFCog\",\n    \"IntCT\", \"CRT\", \"AOT\", \"BDW\", \"ExThreat\", \"Cyn\", \"Powerlessness\", \"Anx\", \"DeathAnx\", \"Efficacy\",\n    \"Control\", \"SocThreat\", \"CollNarc\", \"Anomie\", \"Alien\", \"RWA\", \"IndNarc\", \"CollSelfEst\", \"SDO\",\n    \"NFUnique\", \"IndSelfEst\", \"Trust\", \"Neuro\", \"Open\", \"Consc\", \"Extra\", \"Agree\", \"HH\", \"Anger\",\n    \"Antag\", \"Depression\", \"Detach\", \"Dis\", \"NegAff\", \"Paranoia\", \"PhysAgg\", \"Psych\", \"Schizo\",\n    \"UnusExp\", \"Hostility\", \"REII\", \"PercInt\", \"VerbAgg\",\n}\n\n# Construct whitelist (token = construct). Same vocabulary as Jansen's Bowes\n# prompt; gold uses these exact tokens.\nWHITELIST_LINES = (\n    \"EPISTEMIC: Delusion=Delusion-proneness, Anthro=Anthropomorphism, BSR=Bullshit Receptivity, \"\n    \"IOA=Intolerance of ambiguity, PNR=Perceived non-randomness/illusory pattern perception, \"\n    \"Dog=Dogmatism, ConjFall=Conjunction Fallacy, NeedClose=Need for closure, \"\n    \"REIR=Self-reported rationality, NFCog=Need for Cognition, IntCT=Intelligence, \"\n    \"CRT=Cognitive Reflection, AOT=Actively Open-Minded Thinking\\n\"\n    \"EXISTENTIAL: BDW=Belief in a Dangerous World, ExThreat=Existential threat, Cyn=Cynicism, \"\n    \"Powerlessness, Anx=Anxiety, DeathAnx=Death Anxiety, Efficacy, Control\\n\"\n    \"SOCIAL: SocThreat=Social threat perception, CollNarc=Collective Narcissism, Anomie, \"\n    \"Alien=Alienation, RWA=Right-wing authoritarianism, IndNarc=Individual narcissism, \"\n    \"CollSelfEst=Collective Self-Esteem, SDO=Social dominance orientation, NFUnique=Need for \"\n    \"Uniqueness, IndSelfEst=Individual self-esteem, Trust\\n\"\n    \"PERSONALITY: Neuro=Neuroticism, Open=Openness, Consc=Conscientiousness, Extra=Extraversion, \"\n    \"Agree=Agreeableness, HH=Honesty-Humility\\n\"\n    \"PSYCHOPATHOLOGY: Anger, Antag=Antagonism, Depression, Detach=Detachment, Dis=Disinhibition, \"\n    \"NegAff=Negative affect, Paranoia, PhysAgg=Physical Aggression, Psych=Psychoticism, \"\n    \"Schizo=Schizotypy, UnusExp=Susceptibility to unusual experiences, Hostility, \"\n    \"REII=Self-reported intuition, PercInt=Perceived Intentionality, VerbAgg=Verbal Aggression\"\n)\n\nWIRE_SCHEMA = {\n    \"type\": \"object\",\n    \"properties\": {\n        \"conspiracy_measure\": {\"type\": \"string\"},\n        \"study\": {\n            \"type\": \"object\",\n            \"properties\": {\n                \"YearOfPub\": {\"type\": \"integer\"},\n                \"CTType\": {\"type\": \"array\", \"items\": {\"type\": \"string\"}},\n                \"COVID\": {\"type\": \"string\"},  # \"Yes\" | \"No\"\n            },\n            \"required\": [\"YearOfPub\", \"CTType\", \"COVID\"],\n        },\n        \"samples\": {\n            \"type\": \"array\",\n            \"items\": {\n                \"type\": \"object\",\n                \"properties\": {\n                    \"sample_label\": {\"type\": \"string\"},\n                    \"N\": {\"type\": \"integer\"},\n                    \"female_pct\": {\"type\": \"number\"},\n                    \"recruitment\": {\"type\": \"string\"},  # Student|Com|Mixed|Soldier\n                },\n                \"required\": [\"sample_label\", \"N\", \"female_pct\", \"recruitment\"],\n            },\n        },\n        \"effect_sizes\": {\n            \"type\": \"array\",\n            \"items\": {\n                \"type\": \"object\",\n                \"properties\": {\n                    \"outcome\": {\"type\": \"string\"},\n                    \"es\": {\"type\": \"number\"},\n                    \"N\": {\"type\": \"integer\"},\n                    \"sample_label\": {\"type\": \"string\"},\n                    \"source_construct\": {\"type\": \"string\"},\n                    \"evidence\": {\"type\": \"string\"},\n                },\n                \"required\": [\"outcome\", \"es\", \"N\"],\n            },\n        },\n    },\n    \"required\": [\"study\", \"samples\", \"effect_sizes\"],\n}\n\n# Our method-tuned prompt. Reads the paper once and emits ALL variables: study,\n# samples, and effect sizes. Multimodal table-reading, anchor disambiguation,\n# per-sample attribution, scale->token mapping, sign/asterisk handling, evidence.\nSYSTEM = f\"\"\"You are a meta-analysis coding agent for a review of the CORRELATES\nof conspiratorial ideation (belief in conspiracy theories). Read the WHOLE study\nonce — Marker markdown, the per-table TEXT GRIDS (under \"# TABLES\"), AND the\nattached table/figure IMAGES — and extract every variable below in a single\nconsistent pass. Cross-check grid vs image: the grid preserves row/column labels;\nthe image is ground truth for digits. Correlations and demographics also appear\nin PROSE — read it, not only tables.\n\nOutput four things: `conspiracy_measure`, `study` (paper-level), `samples`\n(one per participant sample), and `effect_sizes` (one per correlation). Keep them\nMUTUALLY CONSISTENT: every effect_size's `sample_label` must be one of the\n`samples` you list, and its N should match that sample's N.\n\n=== STUDY-LEVEL (one per paper) ===\n• YearOfPub: publication year (XXXX) from the header/citation/copyright line.\n• CTType: type(s) of the conspiracy measure(s) used — a LIST of: \"General\"\n  (generic conspiracist-belief scales, e.g. GCBS/GCB/BCTI/CMQ), \"Specific\" (real\n  named events, e.g. 9/11), \"Stereotype\" (outgroup-stereotype conspiracies),\n  \"Scenario\" (hypothetical vignette), \"Fictitious\" (invented non-circulated).\n  IMPORTANT: if the study uses BOTH a general measure AND specific/event-based\n  items (common — e.g. a GCBS total plus belief in particular theories), emit\n  BOTH tokens: [\"General\", \"Specific\"]. Use \"Mix\" ONLY for a SINGLE measure that\n  itself blends types and cannot be split. Decide from the conspiracy MEASURE(S),\n  not the paper topic. List every distinct type the study's measures cover.\n• COVID: \"Yes\" only if the conspiracy measure's ITEMS are COVID-19/pandemic\n  specific; else \"No\".\n\n=== SAMPLES (one record per participant sample) ===\nA \"sample\" = ONE distinct participant group that has its OWN reported N and its\nOWN set of correlations (its own correlation matrix / results). Most papers have\nONE sample (sample_label \"main sample\"). A paper reporting SEPARATE studies /\nexperiments / sub-samples gets one record EACH (\"Study 1\",\"Study 2\",\"Sample 1\"...).\n\nCRITICAL census rules (getting the count and N right matters as much as the values):\n  • One record per real participant group. Do NOT split a single sample by gender,\n    age, country, or condition unless each part has its OWN separate correlation\n    matrix and N.\n  • Do NOT invent a \"combined/pooled/total\" sample that aggregates other samples.\n    If the paper reports 3 studies (N=40, 111, 137), emit exactly those three —\n    never a 4th row with N=288, and never one merged row.\n  • Each sample's N must be a number the paper ACTUALLY reports for THAT group —\n    never a sum you computed across studies, and never a grand total.\n  • If you cannot find a separate N + separate correlations for a candidate group,\n    do not emit it as its own sample.\n\nFor each sample:\n• N: that sample's own reported overall size (per the rules above).\n• female_pct: PERCENT female of THAT sample (0-100). If a count is given,\n  convert female_pct = n_female / N * 100; if only n_male, (N-n_male)/N*100;\n  all-female=100, all-male=0. Report a PERCENT, never the raw count.\n• recruitment: one of \"Student\" (university/college), \"Com\" (community / general\n  public / online panel e.g. MTurk/Prolific), \"Mixed\" (a single sample combining\n  sources), \"Soldier\" (military/veterans).\n\n=== EFFECT SIZES (one per correlation) ===\nExtract every zero-order correlation (Pearson r / Spearman rho) between the\nstudy's conspiratorial-ideation measure and any whitelisted construct.\n\n>>> RECALL IS THE TOP PRIORITY. Missing a correlation is the WORST error. It is\n>>> FINE — encouraged — to extract MORE comprehensively than strictly needed\n>>> (e.g. a construct's total AND its subscales, the construct against several\n>>> conspiracy measures). Never omit a correlation to avoid a duplicate or to be\n>>> conservative. When in doubt, INCLUDE it. If a correlation matrix exists, you\n>>> must return a non-empty list.\n\nSTEP 1 — FIND EVERY CORRELATION SOURCE. Conspiracy correlations live in three\nplaces — check ALL of them, do not stop early:\n  (a) a zero-order CORRELATION MATRIX (the main source), often a triangular table\n      with a 1.00 / α-reliability diagonal and all cells in [-1, 1];\n  (b) the RESULTS PROSE (\"conspiracy beliefs correlated .31 with paranoia\");\n  (c) a validation/supplementary table where the conspiracy scale is one row\n      among many (common when conspiracy is a secondary measure).\n  CRITICAL — COMPOSITE IMAGES: a single attached image OFTEN contains MORE THAN\n  ONE element — e.g. a chart/scatterplot in the TOP half AND a separate DATA TABLE\n  (such as the correlation matrix) in the BOTTOM half of the SAME image. Marker\n  frequently merges a figure and an adjacent table into one image, or saves a\n  correlation matrix as a \"figure\". Therefore:\n    • Treat EVERY attached image (table AND figure) as possibly containing a data\n      table. Scan the ENTIRE image top-to-bottom; do not stop at a chart.\n    • If an image shows a chart on top, KEEP LOOKING below it for a table of\n      numbers — the correlation matrix is often printed right under a plot.\n    • A \"Figure\" caption on top does not mean there is no table lower down; read\n      any \"Table N: Correlation matrix...\" caption and grid wherever it appears.\n  The correlation matrix is frequently present ONLY as such an image and NOT in\n  the \"# TABLES\" text grids (Marker fails to parse it). INSPECT EVERY ATTACHED\n  IMAGE in full. If the prose says \"correlations are shown in Table N\", find that\n  matrix among the images and read it. Do NOT conclude \"no correlations\" just\n  because the text grids only contain regression or\n  descriptive tables.\n  DO NOT extract from REGRESSION tables (columns B, SE, β / beta, t, Wald, p,\n  OR / Exp(B)) — a regression coefficient is NOT a zero-order correlation. Use\n  only the bivariate r.\n\nSTEP 2 — IDENTIFY THE ANCHOR. The conspiracy measure: GCBS/GCB (\"Generic\nConspiracist Beliefs\"), CMQ (\"Conspiracy Mentality\"), BCTI, CMS, \"conspiracy\nbeliefs/ideation\", or a TOPIC-SPECIFIC conspiracy scale (HIV / COVID / vaccine /\n9-11 conspiracy beliefs). Report it in `conspiracy_measure`. Every correlation\nmust be BETWEEN this anchor and a whitelisted construct. If several conspiracy\nmeasures appear (e.g. BCTI, CMQ, GCBS subscales + GCBS total), prefer the\ngeneral/total column; you MAY also report the construct against the other\nconspiracy measures rather than miss data — duplicates are acceptable, omissions\nare not. Never pair two conspiracy measures with each other.\n  ORIENTATION: the conspiracy measure may be a ROW or a COLUMN, and a paper may\n  list SEVERAL conspiracy sub-measures (e.g. \"general / classical / political /\n  interpersonal conspiracy theories\") with the whitelisted CONSTRUCT as the other\n  axis. Extract every conspiracy-measure × whitelisted-construct cell regardless\n  of which axis the construct is on. If the construct (e.g. \"subjective\n  randomness\") is a single row/column and the conspiracy measures are the others,\n  read that construct's cell against EACH conspiracy measure.\n\nSTEP 3 — READ THE MATRIX CELL-BY-CELL. Locate the anchor's ROW or COLUMN and walk\nEVERY cell; for each cell whose other variable maps to a whitelist token, record\nthe r:\n  • Keep the SIGN. \".27\" is positive; \"-.27\"/\"−.27\" is negative; honor prose like\n    \"a negative correlation\".\n  • Strip significance markers (*, **, ***, †, superscripts) — keep only the\n    number. Values may have 2-3 decimals (e.g. -.002); never report |r|>1.\n  • Do NOT read the diagonal (1.00 / α reliabilities) or M/SD/Mean columns as r.\n  • Watch OCR slips in the image (O vs 0, l/I vs 1, comma vs dot); trust the image\n    digits and cross-check the text grid.\n\nN RULE — for EACH effect_size, set `N` to the OVERALL N of its sample (the SAME\nvalue you report in `samples[].N`), NOT a per-correlation / listwise / pairwise n\nfrom a table footnote. Every correlation from one sample shares that sample's N.\n\nSTEP 4 — MAP CONSTRUCT -> TOKEN (case-sensitive, EXACT whitelist token):\n  • Big Five / NEO / BFI / HEXACO subscales -> Neuro, Extra, Open, Agree, Consc\n    (+ HH for HEXACO honesty-humility).\n  • SPQ / SPQ-B / O-LIFE / schizotypy -> Schizo;  paranoia scale -> Paranoia.\n  • \"REI analytical-rational\" / \"rational thinking\" -> REIR;  \"REI\n    intuitive-experiential\" / \"faith in intuition\" -> REII.\n  • DWS / \"dangerous world\" -> BDW;  powerlessness / \"lack of control\" -> Powerlessness;\n    \"need for cognition\" -> NFCog;  CRT -> CRT;  bullshit receptivity -> BSR;\n    illusory pattern perception / perceived non-randomness / \"subjective\n    randomness\" / \"perception of randomness\" / \"prior for randomness\" -> PNR;\n    magical / superstitious / unusual-experience beliefs -> UnusExp;  RWA -> RWA;\n    SDO -> SDO;  intolerance of ambiguity -> IOA;  need for (cognitive) closure /\n    NFCC -> NeedClose;  interpersonal trust / trust in others -> Trust;\n    cynicism -> Cyn;  anomie -> Anomie;  alienation -> Alien.\n  • PREFER the construct's TOTAL/composite. If subscales are ALSO reported, you may\n    include them too (recall first) — but always include the total when present.\n  • Skip a column/row only when it maps to NO token (e.g. Education, age, political\n    orientation, the conspiracy measures themselves).\n\n  CONSTRUCT DIRECTION (SIGN) — each whitelist token names a construct with a\n  DEFINED conceptual direction; report `es` with the sign that matches the TOKEN's\n  direction. If the paper measures the OPPOSITE pole of that construct, the\n  reported r is in the reverse direction, so FLIP its sign (negate) so the value\n  expresses the token's construct. Only flip when the measured variable is clearly\n  the reverse pole; otherwise copy the printed sign as-is. Examples:\n    - Trust: a \"mistrust\" / \"cultural mistrust\" / \"medical mistrust\" measure is the\n      reverse of trust -> negate (printed mistrust r = .48 -> Trust es = -0.48).\n    - ConjFall (conjunction FALLACY / susceptibility): a measure of \"conjunction\n      accuracy\" / \"correct conjunction responses\" / resistance to the fallacy is\n      the reverse -> negate (printed accuracy r = -.22 -> ConjFall es = +0.22).\n    - PNR (illusory pattern / seeing non-randomness): a measure of \"accuracy at\n      detecting randomness\" / correct randomness judgments is the reverse -> negate.\n    - CRT / cognitive-reflection ACCURACY is itself the token direction (do NOT\n      flip) — only flip when the variable is explicitly the construct's opposite.\n\nSTEP 4 — N AND SAMPLE. Report `N` = the overall sample size the correlation is\nbased on (mind pairwise-deletion / per-correlation n footnotes; use the\ntable/sample N). If the paper reports SEPARATE samples/studies (each with its own\nmatrix and N), attribute each correlation to its sample via `sample_label`\n(\"main sample\", \"Study 1\", \"Study 2\", \"Sample 1\"...) and use that sample's N.\n\nEach effect_size: `outcome` (a CONSTRUCT token from the whitelist below — NEVER a\nCTType label like \"General\"/\"Specific\"; those are not constructs), `es` (exact,\nsigned), `N`, `sample_label` (one of the samples above), `source_construct`\n(construct name as printed), `evidence` (the cell/sentence read, short verbatim).\nBivariate zero-order only — ignore partial/adjusted r, betas, interactions,\ncomposites of multiple constructs, factor loadings, path coefficients. Do NOT\ninvent or emit a placeholder value: if you cannot actually read a correlation's\nnumber (e.g. it is only in an online supplement not shown here), OMIT that\ncorrelation — never report es=0 as a stand-in. Empty list if none.\n\nWHITELIST (token = construct):\n{WHITELIST_LINES}\n\"\"\"\n\n\ndef _iter_blocks(node: dict):\n    yield node\n    for c in node.get(\"children\") or []:\n        yield from _iter_blocks(c)\n\n\ndef _html_table_to_grid(html: str) -> str:\n    \"\"\"Convert a Marker <table> HTML to a pipe-delimited text grid (rows/cols\n    preserved). build_sections drops Table blocks, so we add them back as text\n    alongside the table images — the model gets BOTH modalities.\"\"\"\n    rows: list[str] = []\n    for tr in re.findall(r\"<tr>(.*?)<\/tr>\", html, flags=re.S | re.I):\n        cells = re.findall(r\"<t[hd][^>]*>(.*?)<\/t[hd]>\", tr, flags=re.S | re.I)\n        cells = [re.sub(r\"<[^>]+>\", \" \", c).strip() for c in cells]\n        cells = [re.sub(r\"\\s+\", \" \", c) for c in cells]\n        if any(cells):\n            rows.append(\" | \".join(cells))\n    return \"\\n\".join(rows)\n\n\ndef tables_as_text(paper_dir: Path, paper_id: str) -> str:\n    \"\"\"Pipe-grid text for every JSON Table block that looks like a data table.\"\"\"\n    doc = json.loads((paper_dir / f\"{paper_id}.json\").read_text(encoding=\"utf-8\"))\n    out: list[str] = []\n    n = 0\n    for blk in _iter_blocks(doc):\n        if blk.get(\"block_type\") != \"Table\":\n            continue\n        html = blk.get(\"html\") or \"\"\n        # keep only tables that carry decimals (correlation/descriptive matrices)\n        if len(re.findall(r\"-?\\.\\d\", html)) < 4:\n            continue\n        grid = _html_table_to_grid(html)\n        if grid:\n            n += 1\n            out.append(f\"[TABLE {n} — {blk.get('id', '')}]\\n{grid}\")\n    return \"\\n\\n\".join(out)\n\n\ndef collect(paper_dir: Path, paper_id: str) -> tuple[str, list[WireAsset]]:\n    normalize_manifests(paper_dir)  # rebase Fir-absolute image paths -> local (idempotent)\n    sections = build_sections(paper_dir, paper_id)\n    prose = \"\\n\\n\".join(f\"## {s.section_title or s.section_id}\\n{s.text}\".strip() for s in sections)\n    tbl_text = tables_as_text(paper_dir, paper_id)\n    text = prose\n    if tbl_text:\n        text += \"\\n\\n# TABLES (text grids — cross-check against the attached table images)\\n\\n\" + tbl_text\n    # Load images DIRECTLY from the tables/ and figures/ dirs. We do NOT rely on\n    # build_sections asset attachment: the figures manifest schema (file/page/index)\n    # doesn't match what _attach_asset expects (image_path/page_index), so figure\n    # images — where Marker often saves correlation matrices (e.g. Ball2017) — would\n    # otherwise never be fed. Tables first (correlation matrices), then figures.\n    img_paths = sorted((paper_dir / \"tables\").glob(\"*.png\")) + \\\n        sorted((paper_dir / \"figures\").glob(\"*.png\"))\n    wire: list[WireAsset] = []\n    for p in img_paths[:MAX_IMAGES]:\n        try:\n            data = p.read_bytes()\n        except OSError:\n            continue\n        wire.append(WireAsset(path=str(p), mime_type=\"image/png\", data=data))\n    return text, wire\n\n\ndef run_one(paper_dir: Path, paper_id: str, provider: GeminiProvider, out_dir: Path) -> dict:\n    out_dir.mkdir(parents=True, exist_ok=True)\n    final = out_dir / \"extraction.json\"\n    if final.exists() and final.stat().st_size > 40:\n        return {\"paper_id\": paper_id, \"status\": \"skipped\"}\n    text, assets = collect(paper_dir, paper_id)\n    user = (\n        f\"PAPER: {paper_id}\\n\\n{text}\\n\\n\"\n        f\"[{len(assets)} table/figure image(s) attached — read cell values from \"\n        f\"the images.]\\n\\nExtract study, samples, and all effect sizes now.\"\n    )\n    resp = provider._generate(\n        wire_schema=WIRE_SCHEMA, system_prompt=SYSTEM, user_prompt=user, assets=assets\n    )\n    d = resp.data if isinstance(resp.data, dict) else {}\n    es = d.get(\"effect_sizes\", []) or []\n    samples = d.get(\"samples\", []) or []\n\n    # CONDITIONAL N alignment: gold usually uses a sample's OVERALL N for all its\n    # effect sizes, while the model sometimes copies a per-correlation/listwise n.\n    # Overwrite ES N with the matched sample's N ONLY when they are close (a\n    # listwise-vs-total gap, <=15%) or the paper has a single sample. If a paper\n    # genuinely reports several different Ns (multi-wave, e.g. ArdevolAbreu\n    # 3073/5428), trust the ES's own N rather than force one value. Keep the\n    # model's original as N_reported for audit.\n    by_label = {s.get(\"sample_label\"): s.get(\"N\") for s in samples if s.get(\"N\") is not None}\n    sole_n = next(iter(by_label.values())) if len(by_label) == 1 else None\n    for r in es:\n        sn = by_label.get(r.get(\"sample_label\"), sole_n)\n        rn = r.get(\"N\")\n        if sn is None or rn == sn:\n            continue\n        try:\n            close = rn is not None and abs(float(rn) - float(sn)) <= 0.15 * float(sn)\n        except (TypeError, ValueError):\n            close = False\n        # Only snap to the sample N for the listwise-vs-total case (close) or when\n        # the model gave no N. A large gap signals a genuinely different N (multi-\n        # wave) — leave it alone rather than corrupt it.\n        if rn is None or close:\n            r[\"N_reported\"] = rn\n            r[\"N\"] = sn\n\n    # Drop rows whose outcome is not a real construct token (e.g. a leaked CTType\n    # token like \"General\"). Keeps the effect_sizes clean without touching recall\n    # of true constructs.\n    dropped = [r for r in es if r.get(\"outcome\") not in WHITELIST_TOKENS]\n    es = [r for r in es if r.get(\"outcome\") in WHITELIST_TOKENS]\n    d[\"effect_sizes\"] = es\n    payload = {\n        \"conspiracy_measure\": d.get(\"conspiracy_measure\"),\n        \"study\": d.get(\"study\", {}),\n        \"samples\": samples,\n        \"effect_sizes\": es,\n        \"_meta\": {\n            \"paper_id\": paper_id, \"n_samples\": len(samples), \"n_effect_sizes\": len(es),\n            \"n_images\": len(assets), \"prompt_tokens\": resp.prompt_tokens,\n            \"completion_tokens\": resp.completion_tokens,\n        },\n    }\n    final.write_text(json.dumps(payload, indent=2, ensure_ascii=False))\n    return {\"paper_id\": paper_id, \"status\": \"ok\", \"n_es\": len(es),\n            \"n_samp\": len(samples), \"n_img\": len(assets)}\n\n\ndef main() -> int:\n    ap = argparse.ArgumentParser(description=__doc__)\n    ap.add_argument(\"--only\", nargs=\"*\", help=\"restrict to these paper ids\")\n    ap.add_argument(\"--processed\", type=Path, default=PROCESSED)\n    args = ap.parse_args()\n\n    if not args.processed.is_dir():\n        sys.exit(f\"!! marker dir not found: {args.processed} (run Marker first)\")\n    papers = sorted(\n        d for d in args.processed.iterdir() if d.is_dir() and (d / f\"{d.name}.json\").exists()\n    )\n    if args.only:\n        papers = [d for d in papers if d.name in args.only]\n    if not papers:\n        sys.exit(\"!! no Marker-processed papers found\")\n\n    provider = GeminiProvider.from_settings(Settings())\n    print(f\"Unified Bowes extraction (study + samples + effect sizes) over {len(papers)} papers\\n\")\n    for i, pdir in enumerate(papers, 1):\n        try:\n            r = run_one(pdir, pdir.name, provider, RUNS / pdir.name)\n            tag = (f\"{r['n_samp']} samples, {r['n_es']} ES, {r['n_img']} img\"\n                   if r[\"status\"] == \"ok\" else r[\"status\"])\n            print(f\"[{i}/{len(papers)}] {pdir.name:18s} {tag}\")\n        except Exception as exc:  # noqa: BLE001\n            print(f\"[{i}/{len(papers)}] {pdir.name:18s} ERROR: {type(exc).__name__}: {exc}\"[:160])\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"}, {"group": "Schema & field definitions", "title": "schemas/bowes2023/fields.json", "text": "{\n  \"version\": 1,\n  \"meta_analysis\": \"Bowes, Costello & Tasimi (2023) — The Conspiratorial Mind: motivational and personological correlates of conspiratorial ideation\",\n  \"doi\": \"10.1037/bul0000392\",\n  \"jansen_label\": \"Bowes2023\",\n  \"rationale\": \"Bowes is a CORRELATES meta-analysis: each effect size is a zero-order correlation r between conspiratorial ideation and a psychological construct, nested article -> study -> SAMPLE -> effect-size. We replicate EXACTLY the variables Jansen 2025 benchmarked (no extras): study-level YearOfPub, CTType, COVID, Outcome; sample-level Females and Sample(recruitment); and the effect-size triple outcome/es/N (phase 2). KEY granularity decision: studies ~= articles (169 studies / 165 articles, multi-study rare) but SAMPLES are frequently multiple (257 samples / 169 studies; e.g. Betsch2018 = 1 study, 2 samples). So Females, recruitment and N are SAMPLE-scoped (each sample has its own), unlike Jansen who collapsed to one-per-paper. CRITICAL FIX: gold `Females` is a PERCENTAGE (0-100, mean 56.95), not an absolute count — Jansen extracted counts and scored 0.03; we extract female_pct to match gold. Gold lives in RDataFile2023Final.xlsx 'For R' sheet.\",\n  \"fields\": [\n    {\n      \"name\": \"Sample\",\n      \"scope\": \"sample\",\n      \"gender_specific\": false,\n      \"type\": \"object\",\n      \"items_type\": \"integer\",\n      \"definition\": \"Anchors the within-paper sample census. Each distinct participant SAMPLE the paper reports correlations for is one record. Most papers have ONE sample -> sample_key 'main sample'. A paper that reports SEPARATE samples / studies / data collections with their own N and their own correlation set emits one record per sample -> 'Study 1', 'Study 2' (or 'Sample 1', 'Sample 2'). DO NOT put author/year in the sample_key. total_n is this sample's overall N (the denominator the correlations are based on). The Females / Sample-recruitment values and the effect sizes key off these same sample labels. YearOfPub / CTType / COVID / Outcome are study-level (shared across the paper's samples).\"\n    },\n    {\n      \"name\": \"YearOfPub\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"integer\",\n      \"items_type\": \"integer\",\n      \"range\": [1990, 2023],\n      \"definition\": \"Official year of publication of the article (format XXXX). Not the submission/acceptance/online-posting year unless that is the only date available.\",\n      \"skill_hints\": \"Look at the study header, citation/copyright line, or any year on the first page ('published', 'online', copyright year). One value per paper.\",\n      \"validator_match\": \"numeric_exact\"\n    },\n    {\n      \"name\": \"CTType\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"multi_label\",\n      \"items_type\": \"enum\",\n      \"allowed_values\": [\"General\", \"Specific\", \"Stereotype\", \"Scenario\", \"Fictitious\", \"Mix\"],\n      \"value_labels\": {\n        \"General\": \"General belief in conspiracy theories with no focus on specific events/narratives (e.g. generic conspiracist-belief scales).\",\n        \"Specific\": \"Concrete, event-based conspiracy theories (e.g. 9/11 was an inside job, faked moon landing).\",\n        \"Stereotype\": \"Conspiracy beliefs tied to outgroup stereotypes (e.g. a group conspiring for dominance).\",\n        \"Scenario\": \"Hypothetical/scenario-based conspiracies where participants read a conspiratorial scenario.\",\n        \"Fictitious\": \"Conspiracy theories that are not publicly circulated (invented for the study, e.g. Red Bull is carcinogenic and hidden).\",\n        \"Mix\": \"Combines different conspiracy types, or does not differentiate specific vs general.\"\n      },\n      \"definition\": \"Type of conspiracy theory the study's conspiratorial-ideation measure assessed. Multi-label only when the study genuinely uses more than one distinct type; otherwise a single token. Map to 'Mix' when types are combined / undifferentiated.\",\n      \"skill_hints\": \"Read the conspiracy-belief MEASURE described in Methods/Materials. Generic Conspiracist Beliefs Scale / Conspiracy Mentality -> General. Named real events -> Specific. Invented item -> Fictitious. Scenario vignette -> Scenario. Outgroup-stereotype items -> Stereotype.\",\n      \"validator_match\": \"set_overlap\"\n    },\n    {\n      \"name\": \"Females\",\n      \"scope\": \"sample\",\n      \"gender_specific\": false,\n      \"comment_on_gender\": \"IS the gender metric, expressed as PERCENT female of the sample (gold convention), NOT decomposed [total,female,male] and NOT an absolute count.\",\n      \"type\": \"number\",\n      \"unit\": \"percent\",\n      \"range\": [0, 100],\n      \"precision_dp\": 2,\n      \"definition\": \"Percentage of THIS sample that is female (0-100). Bowes gold stores female PERCENT, so report a percentage even if the paper gives a raw count: female_pct = (n_female / N) * 100. If only n_male is given, female_pct = (N - n_male)/N * 100. All-female -> 100; all-male -> 0. One value per SAMPLE (a paper with two samples has two female% values).\",\n      \"skill_hints\": \"Find the Participants/Sample demographics for EACH sample. Keywords: 'female', 'women', 'male', 'men', '% female', 'gender'. Convert any count to a percentage of that sample's N. Do NOT report the absolute number.\",\n      \"validator_match\": \"numeric_tolerance\",\n      \"validator_tolerance\": 1.0,\n      \"fallback_tolerance\": 3.0\n    },\n    {\n      \"name\": \"SampleType\",\n      \"scope\": \"sample\",\n      \"gender_specific\": false,\n      \"jansen_label\": \"Sample\",\n      \"type\": \"enum\",\n      \"items_type\": \"string\",\n      \"allowed_values\": [\"Student\", \"Com\", \"Mixed\", \"Soldier\"],\n      \"value_labels\": {\n        \"Student\": \"Recruited from university/college student populations.\",\n        \"Com\": \"Community / general public / online panel (e.g. MTurk, Prolific, general adult sample).\",\n        \"Mixed\": \"Composed of participants from more than one category (e.g. students AND community).\",\n        \"Soldier\": \"Military personnel, serving or with a military background.\"\n      },\n      \"definition\": \"Recruitment category of THIS sample (Jansen variable 'Sample'). One value per sample. Use 'Mixed' when a single sample combines multiple recruitment sources; use 'Com' for general-public / online-panel adults.\",\n      \"skill_hints\": \"Read recruitment text in Methods/Participants. 'undergraduates / psychology students' -> Student. 'MTurk / Prolific / online panel / general public / community adults' -> Com. 'students and community' in one sample -> Mixed. 'soldiers / military / veterans' -> Soldier.\",\n      \"validator_match\": \"string_normalized\"\n    },\n    {\n      \"name\": \"COVID\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"enum\",\n      \"items_type\": \"string\",\n      \"allowed_values\": [\"Yes\", \"No\"],\n      \"value_labels\": {\n        \"Yes\": \"The conspiracy measure specifically assessed COVID-19 conspiracy theories.\",\n        \"No\": \"The measure did not specifically assess COVID-19 conspiracy theories.\"\n      },\n      \"definition\": \"Whether the study specifically assessed COVID-19 conspiracy theories. 'Yes' only if the conspiratorial-ideation measure is explicitly about COVID-19/pandemic conspiracies; otherwise 'No'.\",\n      \"skill_hints\": \"Look at the conspiracy measure / Materials. Keywords: 'COVID-19', 'coronavirus', 'pandemic'. A general conspiracy scale that happens to be administered during 2020-2022 is still 'No' unless its ITEMS are COVID-specific.\",\n      \"validator_match\": \"string_normalized\"\n    },\n    {\n      \"name\": \"Outcome\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"multi_label\",\n      \"items_type\": \"enum\",\n      \"allowed_values\": [\"AOT\",\"Agree\",\"Alien\",\"Anger\",\"Anomie\",\"Antag\",\"Anthro\",\"Anx\",\"BDW\",\"BSR\",\"CRT\",\"CollNarc\",\"CollSelfEst\",\"ConjFall\",\"Consc\",\"Control\",\"Cyn\",\"DeathAnx\",\"Delusion\",\"Depression\",\"Detach\",\"Dis\",\"Dog\",\"Efficacy\",\"ExThreat\",\"Extra\",\"HH\",\"Hostility\",\"IOA\",\"IndNarc\",\"IndSelfEst\",\"IntCT\",\"NFCog\",\"NFUnique\",\"NeedClose\",\"NegAff\",\"Neuro\",\"Open\",\"PNR\",\"Paranoia\",\"PercInt\",\"PhysAgg\",\"Powerlessness\",\"Psych\",\"REII\",\"REIR\",\"RWA\",\"SDO\",\"Schizo\",\"SocThreat\",\"Trust\",\"UnusExp\",\"VerbAgg\"],\n      \"value_labels\": {\n        \"Agree\": \"Agreeableness\", \"Alien\": \"Alienation\", \"Anger\": \"Anger\", \"Anomie\": \"Anomie\",\n        \"Antag\": \"Antagonism\", \"Anthro\": \"Anthropomorphism\", \"Anx\": \"Anxiety\",\n        \"AOT\": \"Actively Open-minded Thinking\", \"BDW\": \"Belief in a Dangerous World\",\n        \"BSR\": \"Bullshit Receptivity\", \"CollNarc\": \"Collective Narcissism\",\n        \"CollSelfEst\": \"Collective Self-Esteem\", \"ConjFall\": \"Conjunction Fallacy\",\n        \"Consc\": \"Conscientiousness\", \"Control\": \"Sense of control/power\", \"CRT\": \"Cognitive Reflection\",\n        \"Cyn\": \"Cynicism\", \"DeathAnx\": \"Death Anxiety\", \"Delusion\": \"Delusion-proneness\",\n        \"Depression\": \"Depression\", \"Detach\": \"Detachment\", \"Dis\": \"Disinhibition\", \"Dog\": \"Dogmatism\",\n        \"Efficacy\": \"Efficacy\", \"ExThreat\": \"Existential threat\", \"Extra\": \"Extraversion\",\n        \"HH\": \"Honesty-Humility\", \"Hostility\": \"Hostility\", \"IndNarc\": \"Individual narcissism\",\n        \"IndSelfEst\": \"Individual self-esteem\", \"IntCT\": \"Intelligence\", \"IOA\": \"Intolerance of ambiguity\",\n        \"NeedClose\": \"Need for closure\", \"NegAff\": \"Negative affect\", \"Neuro\": \"Neuroticism\",\n        \"NFCog\": \"Need for Cognition\", \"NFUnique\": \"Need for Uniqueness\", \"Open\": \"Openness\",\n        \"Paranoia\": \"Paranoia\", \"PercInt\": \"Perceived Intentionality\", \"PhysAgg\": \"Physical Aggression\",\n        \"PNR\": \"Perceived non-randomness/illusory pattern perception\", \"Powerlessness\": \"Powerlessness\",\n        \"Psych\": \"Psychoticism\", \"REII\": \"Self-reported intuition\", \"REIR\": \"Self-reported rationality\",\n        \"RWA\": \"Right-wing authoritarianism\", \"Schizo\": \"Schizotypy\", \"SDO\": \"Social dominance orientation\",\n        \"SocThreat\": \"Social threat perception\", \"Trust\": \"Trust in others\",\n        \"UnusExp\": \"Susceptibility to unusual experiences\", \"VerbAgg\": \"Verbal Aggression\"\n      },\n      \"definition\": \"The set of psychological/behavioral constructs the study correlated with conspiratorial ideation, each mapped to its controlled-vocabulary token. Multi-label: list every construct measured. Map a measured construct to a token ONLY when it clearly matches; skip constructs with no token. This is the study-level union of the per-effect-size `outcome` values.\",\n      \"skill_hints\": \"Read Methods (Measures) and the correlation table headers/results. Each scale that is correlated with the conspiracy measure -> its token (e.g. Big Five NEO -> Neuro/Extra/Open/Agree/Consc; RWA scale -> RWA; paranoia scale -> Paranoia). Use the correlation matrix as the authoritative list of measured constructs.\",\n      \"validator_match\": \"set_overlap\"\n    }\n  ]\n}\n"}, {"group": "Jansen's effect-size prompt (kept for ablation, not used)", "title": "schemas/bowes2023/jansen_effectsize_prompt.txt", "text": "<Context>\nRead the <study> and extract essential information. Act as a researcher conducting the coding process for a systematic literature review. Pay close attention, as these results will influence future research decisions.\n<\/Context>\n\n<Task>\nIdentify and extract all zero-order correlations between conspiratorial ideation and any construct that correspond to the `Construct_category` whitelist. For each valid correlation, create one entry with the following variables:\n- `outcome`: One construct of the 55 labels from the provided whitelist (case-sensitive).\n- `es`: correlation (e.g., Pearson’s *r*, Spearman’s *ρ*) conspiratorial ideation and outcome category.\n- `N`: The overall sample size on which the effect size is based.\n\n**Whitelist of Construct_categories:**\n\n     ### EPISTEMIC\n     - Delusion = Delusion-proneness\n     - Anthro = Anthropomorphism\n     - BSR = Bullshit Receptivity\n     - IOA = Intolerance of ambiguity\n     - PNR = Perceived non-randomness/illusory pattern perception\n     - Dog = Dogmatism\n     - ConjFall = Conjunction Fallacy\n     - NeedClose = Need for closure\n     - REIR = Self-reported rationality\n     - NFCog = Need for Cognition\n     - IntCT = Intelligence\n     - CRT = Cognitive Reflection\n     - AOT = Actively Open-Minded Thinking\n\n     ### EXISTENTIAL\n     - BDW = Belief in Dangerous World\n     - ExThreat = Existential threat\n     - Cyn = Cynicism\n     - Powerlessness\n     - Anx = Anxiety (e.g., social anxiety)\n     - DeathAnx = Death Anxiety\n     - Efficacy = Efficacy\n     - Control\n\n     ### SOCIAL\n     - SocThreat = Social threat perception\n     - CollNarc = Collective Narcissism\n     - Anomie\n     - Alien = Alienation\n     - RWA = Right-wing authoritarianism\n     - IndNarc = Individual narcissism\n     - CollSelfEst = Collective Self-Esteem\n     - SDO = Social dominance orientation\n     - NFUnique = Need for Uniqueness\n     - IndSelfEst = Individual self-esteem\n     - Trust\n\n     ### GENREAL PERSONALITY\n     - Neuro = Neuroticism\n     - Open = Openness\n     - Consc = Conscientiousness\n     - Extra = Extraversion\n     - Agree = Agreeableness\n     - HH = Honesty-humility\n\n     ### PSYCHOPATHOLOGY\n     - Anger\n     - Antag = Antagonism\n     - Depression\n     - Detach = Detachment\n     - Dis = Disinhibition\n     - NegAff = Negative affect\n     - Paranoia\n     - PhysAgg = Physical Aggression\n     - Psych = Psychoticism\n     - Schizo = Schizotypy\n     - UnusExp = Susceptibility to unusual experiences\n     - Hostility\n\n<\/Task>\n\n<Procedure>\nTo do this, use the following step-by-step (chain-of-thought approach) instructions:\n\n1. Carefully Read the Article:\n- Identify all reported correlations conspiratorial ideation and every construct.\n- Focus on Results, Tables, and Methods sections where statistical values are reported.\n- Pay attention to construct names and their corresponding statistical values.  \n\n2. Match Outcomes:\n- For each identified correlation between conspiratorial ideation and construct category, determine if the construct in the article has an exact match in the provided `Construct_category` whitelist (case-sensitive).\n- Identify every single measured construct that can match with construct categories.\n- If a construct in the article has no obvious label in the list, skip the entire correlation.\n\n3. Provide Answer:\n- For each valid correlation, extract the construct category (outcome), correlation (es), and the corresponding sample size (`N`) (see <Output Example>).\n- Output your final result as a valid JSON array (see <Example Output>) WITHOUT any additional information!\n\n4. Coding Rules:\n- Ensure that only bivariate statistics are considered.\n- Ignore partial/adjusted values, interaction terms, composites, factor scores, or path-model coefficients.\n- Copy numbers exactly; do not perform any transformations or rounding.\n\n<\/Procedure>\n\n<Output Example>\n[\n  {\n    \"outcome\": \"Anx\",\n    \"es\": 0.35,\n    \"N\": 180\n  },\n  {\n    \"outcome\": \"Depression\",\n    \"es\": -0.22,\n    \"N\": 180,\n  },\n  {\n    \"outcome\": \"RWA\",\n    \"es\": 0.48,\n    \"N\": 180,\n  }\n]\n<\/Output Example>\n"}, {"group": "Ground-truth mapping", "title": "eval/bowes2023/bowes_references_gold.md", "text": "# Bowes 2023 — Included Studies (download tracker)\n\n**Downloaded: 97/167**  ·  ✅ = have PDF (Marker+extracted)  ·  ⬜ = still to download\nAuthor/title from gold; DOI carried from Crossref only when title-verified (else [needs manual]).\n\n1. ⬜ [ANES2012] ANES (2012) — *(no title in gold)*.  [DOI: needs manual]\n2. ⬜ [ANES2016] ANES (2016) — *(no title in gold)*.  [DOI: needs manual]\n3. ✅ [AdamTroian2019] Adam-Troian (2019) — *Unfounded beliefs among teachers: The interactive role of rationality priming and cognitive ability*.  [DOI: needs manual]\n4. ✅ [Alper2020] Alper (2020) — *Psychological correlates of COVID-19 conspiracy beliefs and preventive measures: Evidence from Turkey*. https://doi.org/10.31234/osf.io/mt3p4\n5. ✅ [Anthony2019] Anthony (2019) — *Breaking the news: Belief in fake news and conspiracist beliefs*. https://doi.org/10.1111/ajpy.12233\n6. ✅ [ArdevolAbreu2020] Ardevol-Abreu (2020) — *The influence of conspiracy beliefs on conventional and unconventional forms of political participation: The mediating role of political efficacy*.  [DOI: needs manual]\n7. ✅ const evald = new Set(DATA.evaluated_fields);

const byId = {}; papers.forEach(p => byId[p.id] = p);
let pinned = null;
let std = 'strict';

// klass -> outcome under each standard
const STD = {
  strict:  {exact:'correct', contains:'incorrect (partial)', wrong:'incorrect', missing:'missing'},
  widened: {exact:'correct', contains:'correct',             wrong:'incorrect', missing:'missing'},
};

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function pct(x){ return (x*100).toFixed(1)+'%'; }
function f3(x){ return x.toFixed(3); }

document.getElementById('title').textContent = DATA.ma_name + " — reference vs extracted";
document.getElementById('subtitle').textContent =
  "Gold: " + DATA.gold_label + " · " + papers.length + " papers · ★ = scored field · metric = revision paper CED/IED/MD";

// ---- assets panel ----
(function(){
  const groups = {};
  (DATA.assets||[]).forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
  const order = ["Prompts","Schema & field definitions","Rules","Ground-truth mapping"];
  const body = document.getElementById('assetsBody');
  let html = '';
  for (const g of order) {
    const items = groups[g]; if (!items) continue;
    html += `<div class="asset-group"><div class="gh">${esc(g)}</div>`;
    for (const a of items) {
      html += `<div class="asset"><details><summary>${esc(a.title)}</summary><pre>${esc(a.text)}</pre></details></div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html || '<em>No assets found.</em>';
})();

// ---- metric panels ----
function renderPanel(elId, label, sub){
  const el = document.getElementById(elId);
  const key = elId === 'panelStrict' ? 'strict' : 'widened';
  const o = DATA.summary.overall[key];
  let h = `<h3>${label} <span class="tag">— ${sub}</span></h3>`;
  h += `<div class="bigrow">
    <div class="big"><b>${f3(o.f1)}</b><span>F1</span></div>
    <div class="big"><b>${f3(o.precision)}</b><span>Precision</span></div>
    <div class="big"><b>${f3(o.recall)}</b><span>Recall</span></div>
    <div class="big"><b>${pct(o.accuracy)}</b><span>Accuracy</span></div>
  </div>`;
  h += `<div class="counts">CED ${o.ced} · IED ${o.ied} · MD ${o.md} &nbsp;(${o.ced+o.ied+o.md} scored data points)</div>`;
  h += `<table class="fm"><thead><tr><th>field</th><th>P</th><th>R</th><th>F1</th><th>Acc</th></tr></thead><tbody>`;
  for (const f of DATA.evaluated_fields) {
    const m = DATA.summary.per_field[f][key];
    h += `<tr><td>${esc(f)}</td><td>${f3(m.precision)}</td><td>${f3(m.recall)}</td><td>${f3(m.f1)}</td><td>${pct(m.accuracy)}</td></tr>`;
  }
  h += `</tbody></table>`;
  el.innerHTML = h;
}
renderPanel('panelStrict', 'Strict', 'exact match only');
renderPanel('panelWidened', 'Widened', 'reference within extraction = match');

function markActivePanel(){
  document.getElementById('panelStrict').classList.toggle('active', std==='strict');
  document.getElementById('panelWidened').classList.toggle('active', std==='widened');
}

// ---- cell color ----
function cellColor(klass){
  if (!klass || klass==='neutral') return 'neutral';
  if (klass==='exact') return 'full';
  if (klass==='contains') return std==='widened' ? 'full' : 'partial';
  return 'none'; // wrong | missing
}

function renderCell(cell){
  if (!cell || cell.kind === 'empty') return '<span class="empty-val">(empty)</span>';
  if (cell.kind === 'scalar') return esc(cell.text);
  return cell.rows.map(([label, vals]) =>
    `<div class="sub"><span class="sub-h">${esc(label)}:</span> ${vals.map(esc).join(', ')}</div>`).join('');
}

// ---- tooltip ----
const tt = document.getElementById('tooltip');
function showTip(pid, field, x, y){
  const cell = byId[pid].cells[field];
  if (!cell) { tt.style.display='none'; return; }
  const k = cell.klass || 'neutral';
  let h = `<div class="tt-row"><span class="tt-label">${esc(pid)}</span> · ${esc(field)} <span class="tt-klass">${k}</span></div>`;
  if (k !== 'neutral') {
    h += `<div class="tt-std">strict: <b>${STD.strict[k]}</b> &nbsp;·&nbsp; widened: <b>${STD.widened[k]}</b></div>`;
  }
  if (cell.gold != null) {
    h += `<div class="tt-gold"><span class="tt-label">reference:</span> ${esc(cell.gold)}`;
    if (cell.gold_source) h += `<div class="tt-src">source: ${esc(cell.gold_source)}</div>`;
    h += `</div>`;
  } else {
    h += `<div class="tt-gold tt-src">no reference value (unscored)</div>`;
  }
  if (cell.evidence && cell.evidence.length) {
    h += `<div class="tt-ev"><span class="tt-label">evidence (${cell.evidence.length}):</span>`;
    for (const e of cell.evidence) {
      const loc = [e.sample, e.section, (e.page!=null?('p.'+e.page):null)].filter(Boolean).map(esc).join(' · ');
      h += `<div style="margin-top:4px"><div class="q">“${esc(e.quote)}”</div>${loc?`<div class="meta">${loc}</div>`:''}</div>`;
    }
    h += `</div>`;
  }
  tt.innerHTML = h; tt.style.display='block';
  const r = tt.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  let left=x+12, top=y+12;
  if (left+r.width>vw-10) left=x-r.width-12;
  if (top+r.height>vh-10) top=y-r.height-12;
  tt.style.left=Math.max(10,left)+'px'; tt.style.top=Math.max(10,top)+'px';
}
function hideTip(){ tt.style.display='none'; tt.classList.remove('pinned'); }

// ---- table ----
function buildTable(visible){
  const hr = document.getElementById('headerRow');
  hr.innerHTML = '<th>Paper</th>' + fields.map(f => `<th class="${evald.has(f)?'evald':''}" title="${esc(f)}">${esc(f)}</th>`).join('');
  const rows = visible.map(pid => {
    const p = byId[pid];
    let tr = `<tr><td title="${esc(pid)}">${esc(pid)}</td>`;
    for (const f of fields) {
      const cell = p.cells[f];
      tr += `<td><div class="cell ${cellColor(cell&&cell.klass)}" data-p="${esc(pid)}" data-f="${esc(f)}">${renderCell(cell)}</div></td>`;
    }
    return tr + '</tr>';
  });
  document.getElementById('tableBody').innerHTML = rows.join('');
  document.getElementById('paperCount').textContent = visible.length + ' papers';
  document.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('mouseenter', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mousemove', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mouseleave', () => { if(!pinned) hideTip(); });
    c.addEventListener('click', e => {
      e.stopPropagation();
      const same = pinned && pinned.p===c.dataset.p && pinned.f===c.dataset.f;
      document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
      if (same) { pinned=null; hideTip(); }
      else { pinned={p:c.dataset.p,f:c.dataset.f}; c.classList.add('pinned'); showTip(c.dataset.p,c.dataset.f,e.clientX,e.clientY); tt.classList.add('pinned'); }
    });
  });
}
document.addEventListener('click', e => {
  if (pinned && !e.target.closest('.cell') && !e.target.closest('.tooltip')) {
    pinned=null; hideTip(); document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
  }
});

const viewMode=document.getElementById('viewMode'), paperSelect=document.getElementById('paperSelect'), searchBox=document.getElementById('searchBox');
papers.forEach(p => { const o=document.createElement('option'); o.value=p.id; o.textContent=p.id; paperSelect.appendChild(o); });
function refresh(){
  const search=searchBox.value.trim().toLowerCase();
  let vis;
  if (viewMode.value==='single'){ paperSelect.style.display=''; vis=[paperSelect.value]; }
  else { paperSelect.style.display='none'; vis=papers.map(p=>p.id); }
  if (search) vis=vis.filter(id=>id.toLowerCase().includes(search));
  pinned=null; hideTip(); buildTable(vis);
}
viewMode.onchange=refresh; paperSelect.onchange=refresh; searchBox.oninput=refresh;
document.querySelectorAll('input[name=std]').forEach(r => r.addEventListener('change', e => {
  std = e.target.value; markActivePanel(); refresh();
}));

markActivePanel();
refresh();
</script>
</body>
