<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraction Pipeline Dashboard</title>
<style>
:root {
  --bg: #f8f9fa;
  --text: #212529;
  --border: #dee2e6;
  --header-bg: #343a40;
  --header-text: #f8f9fa;
  --cell-border: rgba(150,150,150,0.4);
  --match-full: rgba(72, 199, 116, 0.25);
  --match-partial: rgba(255, 221, 87, 0.30);
  --match-none: rgba(255, 99, 99, 0.22);
  --match-neutral: rgba(200,200,200,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
}

/* --- Controls --- */
.controls {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #fff;
  border-bottom: 2px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.controls label { font-weight: 600; font-size: 12px; white-space: nowrap; }
.controls input[type="text"], .controls select {
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
}
.controls input[type="text"] { width: 200px; }
.controls select { max-width: 320px; }
.controls .sep { border-left: 1px solid var(--border); height: 28px; }
.controls .badge {
  background: #e9ecef;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  color: #495057;
}

/* --- Table wrapper --- */
.table-wrap {
  overflow: auto;
  max-height: calc(100vh - 60px);
  position: relative;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  min-width: 100%;
}

/* --- Header --- */
thead th {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header-bg);
  color: var(--header-text);
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,0.1);
  min-width: 160px;
}
thead th:first-child {
  position: sticky;
  left: 0;
  z-index: 200;
  min-width: 220px;
  max-width: 280px;
}

/* --- Body --- */
tbody td {
  vertical-align: top;
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  min-width: 160px;
}
tbody td:first-child {
  position: sticky;
  left: 0;
  z-index: 50;
  background: #fff;
  font-weight: 600;
  font-size: 12px;
  min-width: 220px;
  max-width: 280px;
  word-break: break-word;
  border-right: 2px solid var(--border);
}

/* --- Cell block --- */
.cell-block {
  border: 1px solid var(--cell-border);
  border-radius: 4px;
  padding: 4px 6px;
  cursor: pointer;
  position: relative;
  min-height: 24px;
  transition: box-shadow 0.15s;
}
.cell-block:hover {
  box-shadow: 0 0 0 2px rgba(66,133,244,0.3);
}
.cell-block.pinned {
  box-shadow: 0 0 0 2px rgba(66,133,244,0.6);
}
.cell-block.match-full    { background: var(--match-full); }
.cell-block.match-partial { background: var(--match-partial); }
.cell-block.match-none    { background: var(--match-none); }
.cell-block.match-neutral { background: var(--match-neutral); }

/* sub-blocks */
.sub-block { margin-bottom: 3px; }
.sub-block:last-child { margin-bottom: 0; }
.sub-block-header {
  font-weight: 600;
  font-size: 11px;
  color: #495057;
}
.gender-line {
  margin-left: 12px;
  font-size: 11px;
  color: #555;
}
.gender-label { font-weight: 600; text-transform: capitalize; }
.empty-val { color: #aaa; font-style: italic; }

/* --- Tooltip --- */
.tooltip-box {
  position: fixed;
  z-index: 5000;
  background: #fff;
  border: 1px solid #aaa;
  border-radius: 6px;
  padding: 10px 12px;
  max-width: 480px;
  min-width: 200px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  font-size: 12px;
  line-height: 1.5;
  display: none;
  pointer-events: none;
  word-wrap: break-word;
}
.tooltip-box.pinned {
  pointer-events: auto;
}
.tooltip-box .tt-label { font-weight: 700; color: #333; }
.tooltip-box .tt-section { margin-top: 6px; }
.tooltip-box .tt-gt { border-top: 1px dashed #ccc; padding-top: 6px; margin-top: 6px; }

/* --- Legend --- */
.legend {
  display: flex; gap: 12px; align-items: center; font-size: 11px;
}
.legend-item {
  display: flex; align-items: center; gap: 4px;
}
.legend-swatch {
  width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.15);
}

/* search highlight */
tr.highlight-row td:first-child { background: #fff3cd !important; }
</style>
</head>
<body>

<div class="controls" id="controls">
  <label>View:</label>
  <select id="viewMode">
    <option value="all">All papers</option>
    <option value="single">Single paper</option>
  </select>
  <select id="paperSelect" style="display:none"></select>
  <div class="sep"></div>
  <label>Search:</label>
  <input type="text" id="searchBox" placeholder="Filter papers...">
  <div class="sep"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-full)"></div> Full match</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-partial)"></div> Partial match</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-none)"></div> No match</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-neutral)"></div> No GT</div>
  </div>
  <div class="sep"></div>
  <span class="badge" id="paperCount"></span>
</div>

<div class="table-wrap" id="tableWrap">
  <table id="mainTable">
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="tooltip-box" id="tooltip"></div>

const DATA = {"papers": {"1Atari2016": {"Number of studies": {"extract_value": [1], "best_indices": [0, 1, 2, 3, 4, 5], "reason": "All six candidates consistently report a value of 1, indicating this paper contains a single study examining the psychometric properties of the Persian Body Appreciation Scale-2 (BAS-2) in Iran. The evidence is consistent across multiple sections: the abstract describes one study with 1093 university students, the introduction presents the aims of a single study, the methods section describes participant recruitment and procedures for one study, and the discussion sections present findings from this single study. There is no indication of multiple separate studies within this paper."}, "Publication type": {"extract_value": ["journal articles"], "best_indices": [0, 1], "reason": "Both candidates consistently identify the publication type as \"journal articles.\" Candidate [0] explicitly states this is a brief research report published in the Body Image journal, while Candidate [1] confirms this is a Body Image journal publication. Despite both candidates noting \"No evidence\" in their evidence field, the source context clearly indicates this paper is published in a peer-reviewed journal (Body Image), which definitively establishes it as a journal article rather than a dissertation. This is the most reliable indicator of publication type, as it comes directly from the journal header and publication information visible in the paper itself."}, "Country": {"extract_value": {"Single study": ["Iran"]}, "best_indices": [0, 1, 2, 3, 4, 5, 6], "reason": "All six candidates consistently report Iran as the country where the study was conducted. The paper contains a single study examining the psychometric properties of the Persian Body Appreciation Scale-2 (BAS-2) in Iran. Evidence is consistent across multiple sections: the title and author affiliation (Candidate 0), abstract describing 1093 university students from seven universities in Tehran (Ca sities in Tehran. Candidate [0] from the abstract and Candidate [1] from the participants section are consistent and complementary. Both sources are reliable (abstract and method section), so both are selected. The values are merged into a single study entry with the total sample size of 1093 and complete gender breakdown (male: 568, female: 525). The context confirms this paper contains only one study, so the resolved_studies list contains a single entry labeled 'Single study'.\"", "extract_value_by_gender": {"male": {"Single study": [568]}, "female": {"Single study": [525]}, "other": {"Single study": []}, "total": {"Single study": [1093]}}}, "Percentage of college or higher of participants": {"extract_value": {"Single study": [100]}, "best_indices": [0, 1, 2], "reason": "All three candidates consistently report 100% of participants having college or higher education experience. The paper contains a single study examining the psychometric properties of the Persian Body Appreciation Scale-2 (BAS-2) in Iran. Candidate [0] from the abstract provides gender-specific breakdowns (male: 100%, female: 100%, total: 100%) based on 568 men and 525 women recruited from seven universities in Tehran. Candidate [1] from the procedure section confirms all participants were university students (100%). Candidate [2] from the discussion section reiterates the university population setting (100%). All candidates refer to the same single study with consistent evidence that participants were recruited exclusively from university settings, justifying the 100% value. The gender-split data from Candidate [0] is merged with the total value to provide complete information across all demographic categories.", "extract_value_by_gender": {"male": {"Single study": [100]}, "female": {"Single study": [100]}, "other": {"Single study": []}, "total": {"Single study": [100]}}}, "Source of sample": {"extract_value": {"Single study": ["college"]}, "best_indices": [0, 1, 2, 3, 4, 5], "reason": "All six candidates consistently report 'college' as the source of sample, referring to the same single study examining the Persian Body Appreciation Scale-2 (BAS-2) in Iran. The paper contains only one study with 1093 university students (568 men and 525 women) recruited from seven universities in Tehran. Candidates [0-3, 5] explicitly label this as 'Study X', while candidate [4] labels it as 'Study 1', but all refer to the identical study based on matching participant numbers (1093 total), demographics, and study design. The minor labeling variation ('Study X' vs 'Study 1') is resolved by recognizing this is a single-study paper. All candidates provide consistent evidence from different sections (Abstract, Participants, Procedure, Between-group Differences, Discussion) confirming university/college-level recruitment. No conflicts exist, and no subsample merging is needed as all candidates describe the same sample from the same study.\""}, "Mean age of participants": {"extract_value": {"Single study": [25.87]}, "best_indices": [0], "reason": "The paper contains a single study examining the psychometric properties of the Persian Body Appreciation Scale-2 (BAS-2) in Iran. Candidate [0] from the Participants section provides the mean age of participants (M = 25.87 years) extracted directly from the text describing participant demographics. This is the most reliable source as it comes from the Method/Participants section where demographic information is typically reported. The value is clear and unambiguous, with no conflicting data from other candidates. The total value of 25.87 years is included in the extract_value_by_gender total field as this represents the overall mean age across all participants (568 men and 525 women, N=1093).", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": []}, "other": {"Single study": []}, "total": {"Single study": [25.87]}}}, "Mean BMI of participants": {"extract_value": {"Single study": [23.69, 25.17, 22.07]}, ecise values for both genders with clear table documentation. The values are: Female: -0.24 (negative association), Male: 0.12 (positive association), consistent with the study's finding that body appreciation correlates differently with BMI by gender.", "extract_value_by_gender": {"male": {"Single study": [0.12]}, "female": {"Single study": [-0.24]}, "other": {"Single study": []}, "total": {"Single study": [-0.24, 0.12]}}}}, "1Benford2014": {"Number of studies": {"extract_value": [1], "best_indices": [0, 1, 2], "reason": "All three candidates consistently report a value of 1 study. The evidence comes from multiple reliable sections: (1) the abstract clearly describes a single study examining Big Five personality traits and body image; (2) the participants section describes recruitment for one study in London with N=509; (3) the results section reports findings from a single study with N=509. All candidates converge on the same value with consistent sample size (N=509) and study design details, indicating this paper contains exactly 1 study. No conflicting evidence of multiple studies is present."}, "Publication type": {"extract_value": ["journal articles"], "best_indices": [0, 1], "reason": "Both candidates consistently identify the publication type as \"journal articles\" based on the source material (journal header and cover page from Body Image journal). Although neither candidate provides substantive study content evidence, the structural evidence from the journal publication itself is reliable and definitive. The paper is published in a peer-reviewed journal (Body Image: An International Journal of Research), which clearly establishes it as a journal article rather than a dissertation. This is the most straightforward interpretation of the publication context."}, "Country": {"extract_value": {"Single study": ["United Kingdom"]}, "best_indices": [0, 1, 2, 3], "reason": "All four candidates consistently report the same country value for a single study. Candidate const papers = DATA.papers;
const fields = DATA.fields;
const comparison = DATA.comparison;
const gtDisplay = DATA.gt_display;
const paperIds = Object.keys(papers).sort();

// ---- State ----
let pinnedTooltip = null;  // {paperId, field} or null

// ---- Helpers ----
function isNoneLike(v) {
  if (v === null || v === undefined) return true;
  const s = String(v).trim().toLowerCase();
  return s === 'none' || s === 'nan' || s === '' || s === '.';
}

function formatBestIndices(indices) {
  if (!indices || !indices.length) return '(none)';
  const sorted = [...indices].sort((a,b) => a - b);
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === end + 1) {
      end = sorted[i];
    } else {
      ranges.push(start === end ? String(start) : `${start}-${end}`);
      start = end = sorted[i];
    }
  }
  ranges.push(start === end ? String(start) : `${start}-${end}`);
  return ranges.join(', ');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function filterNoneLike(arr) {
  return (arr || []).filter(v => !isNoneLike(v));
}

function listsMatch(a, b) {
  // Compare two value lists (order-insensitive, approximate)
  if (a.length !== b.length) return false;
  const na = a.map(v => { try { return parseFloat(v); } catch(e) { return String(v).toLowerCase(); } }).sort();
  const nb = b.map(v => { try { return parseFloat(v); } catch(e) { return String(v).toLowerCase(); } }).sort();
  for (let i = 0; i < na.length; i++) {
    if (typeof na[i] === 'number' && typeof nb[i] === 'number') {
      if (Math.abs(na[i] - nb[i]) > 0.05) return false;
    } else if (String(na[i]) !== String(nb[i])) return false;
  }
  return true;
}

// ---- Cell rendering ----
function renderCell(fieldData) {
  if (!fieldData) return '<span class="empty-val">(no data)</span>';

  const ev = fieldData.extract_value;
  const evg = fieldData.extract_value_by_gender;
  let html = '';

  if (evg) {
    html = renderGenderCell(ev, evg);
  } else if (ev !== undefined) {
    html = renderPlainCell(ev);
  } else {
    html = '<span class="empty-val">(no data)</span>';
  }
  return html;
}

function renderPlainCell(ev) {
  // ev is dict or list
  if (ev && typeof ev === 'object' && !Array.isArray(ev)) {
    // Dict: per-study
    const parts = [];
    for (const [study, vals] of Object.entries(ev)) {
      const filtered = filterNoneLike(vals);
      if (filtered.length) {
        parts.push(`<div class="sub-block"><span class="sub-block-header">${esc(study)}:</span> ${filtered.map(v => esc(String(v))).join(', ')}</div>`);
      } else {
        parts.push(`<div class="sub-block"><span class="sub-block-header">${esc(study)}:</span> <span class="empty-val">(empty)</span></div>`);
      }
    }
    return parts.join('') || '<span class="empty-val">(empty)</span>';
  }
  if (Array.isArray(ev)) {
    const filtered = filterNoneLike(ev);
    if (filtered.length) {
      return `<div class="sub-block">${filtered.map(v => esc(String(v))).join(', ')}</div>`;
    }
    return '<span class="empty-val">(empty)</span>';
  }
  if (isNoneLike(ev)) return '<span class="empty-val">(empty)</span>';
  return `<div class="sub-block">${esc(String(ev))}</div>`;
}

function renderGenderCell(ev, evg) {
  // Collect all study keys from evg (from any gender dict)
  const studyKeys = new Set();
  for (const g of ['female', 'male', 'other', 'total']) {
    const gDict = evg[g];
    if (gDict && typeof gDict === 'object' && !Array.isArray(gDict)) {
      for (const k of Object.keys(gDict)) studyKeys.add(k);
    }
  }
  // Also get study keys from ev if it's a dict
  const evIsDict = (ev && typeof ev === 'object' && !Array.isArray(ev));
  if (evIsDict) {
    for (const k of Object.keys(ev)) studyKeys.add(k);
  }

  const parts = [];
  for (const study of studyKeys) {
    let headerVals = '';

    // Get extract_value for this study
    let evStudyVals = [];
    if (evIsDict && ev[study]) {
      evStudyVals = filterNoneLike(Array.isArray(ev[study]) ? ev[study] : [ev[study]]);
    }

    // Get total for this study
    let totalVals = [];
    if (evg.total && typeof evg.total === 'object' && !Array.isArray(evg.total) && evg.total[study]) {
      totalVals = filterNoneLike(Array.isArray(evg.total[study]) ? evg.total[study] : [evg.total[study]]);
    }

    // Check if total matches extract_value
    const totalMatchesEv = evStudyVals.length > 0 && totalVals.length > 0 && listsMatch(evStudyVals, totalVals);

    // Header line
    if (!totalMatchesEv && evStudyVals.length > 0) {
      headerVals = ` ${evStudyVals.map(v => esc(String(v))).join(', ')}`;
    }

    let studyHtml = `<div class="sub-block"><div class="sub-block-header">${esc(study)}:${headerVals}</div>`;

    // Gender lines
    for (const g of ['female', 'male', 'other', 'total']) {
      const gDict = evg[g];
      if (!gDict) continue;
      let gVals = [];
      if (typeof gDict === 'object' && !Array.isArray(gDict) && gDict[study]) {
        gVals = filterNoneLike(Array.isArray(gDict[study]) ? gDict[study] : [gDict[study]]);
      }
      // Skip empty or zero-only
      if (!gVals.length) continue;
      if (gVals.length === 1 && (gVals[0] === 0 || gVals[0] === '0')) continue;

      studyHtml += `<div class="gender-line"><span class="gender-label">${g}:</span> ${gVals.map(v => esc(String(v))).join(', ')}</div>`;
    }

    studyHtml += '</div>';
    parts.push(studyHtml);
  }

  // Also render studies from ev that are NOT in evg study keys
  if (evIsDict) {
    for (const [study, vals] of Object.entries(ev)) {
      if (studyKeys.has(study)) continue;  // already rendered above
      const filtered = filterNoneLike(Array.isArray(vals) ? vals : [vals]);
      if (filtered.length) {
        parts.push(`<div class="sub-block"><span class="sub-block-header">${esc(study)}:</span> ${filtered.map(v => esc(String(v))).join(', ')}</div>`);
      }
    }
  }

  return parts.join('') || '<span class="empty-val">(empty)</span>';
}

// ---- Tooltip ----
const tooltipEl = document.getElementById('tooltip');

function showTooltip(paperId, field, x, y) {
  const fd = papers[paperId]?.[field];
  const gt = gtDisplay[paperId]?.[field];

  // If no extracted data AND no GT info, nothing to show
  if (!fd && gt === undefined) { tooltipEl.style.display = 'none'; return; }

  let html = '';
  if (fd) {
    // best_indices
    html += `<div><span class="tt-label">best_indices:</span> ${formatBestIndices(fd.best_indices)}</div>`;
    // reason
    if (fd.reason) {
      html += `<div class="tt-section"><span class="tt-label">reason:</span> ${esc(fd.reason)}</div>`;
    }
  } else {
    html += `<div><span class="tt-label" style="color:#888">No values extracted for this field.</span></div>`;
  }
  // ground truth
  if (gt !== undefined) {
    html += `<div class="tt-gt"><span class="tt-label">ground_truth:</span> ${esc(gt)}</div>`;
  }

  tooltipEl.innerHTML = html;
  tooltipEl.style.display = 'block';

  // Position
  const rect = tooltipEl.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = x + 12;
  let top = y + 12;
  if (left + rect.width > vw - 10) left = x - rect.width - 12;
  if (top + rect.height > vh - 10) top = y - rect.height - 12;
  if (left < 0) left = 10;
  if (top < 0) top = 10;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function hideTooltip() {
  tooltipEl.style.display = 'none';
  tooltipEl.classList.remove('pinned');
}

// ---- Build table ----
function buildTable(visiblePapers) {
  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('tableBody');

  // Header
  headerRow.innerHTML = '<th>Paper</th>' + fields.map(f => `<th title="${esc(f)}">${esc(f)}</th>`).join('');

  // Body
  const rows = [];
  for (const pid of visiblePapers) {
    const pdata = papers[pid];
    let tr = `<tr data-paper="${esc(pid)}"><td title="${esc(pid)}">${esc(pid)}</td>`;
    for (const field of fields) {
      const fd = pdata[field];
      const match = comparison[pid]?.[field] || 'neutral';
      const cellContent = renderCell(fd);
      tr += `<td><div class="cell-block match-${match}" data-paper="${esc(pid)}" data-field="${esc(field)}">${cellContent}</div></td>`;
    }
    tr += '</tr>';
    rows.push(tr);
  }
  tbody.innerHTML = rows.join('');

  document.getElementById('paperCount').textContent = `${visiblePapers.length} papers`;

  // Attach events
  attachCellEvents();
}

function attachCellEvents() {
  document.querySelectorAll('.cell-block').forEach(block => {
    block.addEventListener('mouseenter', (e) => {
      if (pinnedTooltip) return; // don't override pinned
      const pid = block.dataset.paper;
      const field = block.dataset.field;
      showTooltip(pid, field, e.clientX, e.clientY);
    });
    block.addEventListener('mousemove', (e) => {
      if (pinnedTooltip) return;
      const pid = block.dataset.paper;
      const field = block.dataset.field;
      showTooltip(pid, field, e.clientX, e.clientY);
    });
    block.addEventListener('mouseleave', () => {
      if (!pinnedTooltip) hideTooltip();
    });
    block.addEventListener('click', (e) => {
      e.stopPropagation();
      const pid = block.dataset.paper;
      const field = block.dataset.field;

      if (pinnedTooltip && pinnedTooltip.paperId === pid && pinnedTooltip.field === field) {
        // Unpin
        pinnedTooltip = null;
        hideTooltip();
        block.classList.remove('pinned');
      } else {
        // Unpin old
        if (pinnedTooltip) {
          document.querySelectorAll('.cell-block.pinned').forEach(b => b.classList.remove('pinned'));
        }
        // Pin new
        pinnedTooltip = { paperId: pid, field: field };
        block.classList.add('pinned');
        showTooltip(pid, field, e.clientX, e.clientY);
        tooltipEl.classList.add('pinned');
      }
    });
  });
}

// Click elsewhere to unpin
document.addEventListener('click', (e) => {
  if (pinnedTooltip && !e.target.closest('.cell-block') && !e.target.closest('.tooltip-box')) {
    pinnedTooltip = null;
    hideTooltip();
    document.querySelectorAll('.cell-block.pinned').forEach(b => b.classList.remove('pinned'));
  }
});

// ---- Controls ----
const viewMode = document.getElementById('viewMode');
const paperSelect = document.getElementById('paperSelect');
const searchBox = document.getElementById('searchBox');

// Populate paper select
paperIds.forEach(pid => {
  const opt = document.createElement('option');
  opt.value = pid;
  opt.textContent = pid;
  paperSelect.appendChild(opt);
});

function refresh() {
  const mode = viewMode.value;
  const search = searchBox.value.trim().toLowerCase();

  let visible;
  if (mode === 'single') {
    paperSelect.style.display = '';
    visible = [paperSelect.value];
  } else {
    paperSelect.style.display = 'none';
    visible = paperIds;
  }

  if (search) {
    visible = visible.filter(pid => pid.toLowerCase().includes(search));
  }

  // Reset tooltip state
  pinnedTooltip = null;
  hideTooltip();

  buildTable(visible);
}

viewMode.addEventListener('change', refresh);
paperSelect.addEventListener('change', refresh);
searchBox.addEventListener('input', refresh);

// Initial render
refresh();
</script>
