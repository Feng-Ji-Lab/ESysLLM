page": 2, "quote": "Interviews containing shame reactions were included in the present study (n ¼ 13)."}]}}}, {"id": "Ziolkowska2017", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["Poland"]]], "klass": "exact", "gold": "poland", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "The study", "page": 4, "quote": "The interviews were recorded between September 2010 and May 2011 in the south west of Poland."}]}, "Population": {"kind": "cells", "rows": [["Study 1 - main sample", ["Bereaved (Male Suicide)"]]], "klass": "exact", "gold": "bereaved (male suicide)", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "ABSTRACT", "page": 1, "quote": "In this article we are interested in stories of sons and daughters about their fathers who completed suicide. The data come from 10 interviews with survivors of suicidal death of their fathers."}, {"sample": "Study 1 - main sample", "section": "Aims and methodology", "page": 2, "quote": "And so in this article we are interested in stories of (adult) children who lost their fathers through suicide."}, {"sample": "Study 1 - main sample", "section": "The study", "page": 4, "quote": "The article is based on 10 interviews with adults who survived the suicidal death of their fathers. The criteria for inclusion were: (1) surviving the suicidal death of father"}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "exact", "gold": "primary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "ABSTRACT", "page": 1, "quote": "The data come from 10 interviews with survivors of suicidal death of their fathers."}, {"sample": "Study 1 - main sample", "section": "The study", "page": 4, "quote": "The article is based on 10 interviews with adults who survived the suicidal death of their fathers."}, {"sample": "Study 1 - main sample", "section": "The positive father", "page": 5, "quote": "our corpus where interviewers asked our informants about their fathers."}, {"sample": "Study 1 - main sample", "section": "(12) badany 2, mężczyzna", "page": 11, "quote": "[/page/11/Text/2] I: popadł w alkoholizm. to jest przede wszystkim myślę główna przyczyna powodu tego tego samobójstwa. nadmiar alkoholu nieporadzenie sobie z własnymi problemami. y: co niepowodzenia życiowe. zawodowe. rozwód z matką. y samotność. i alkohol. i to wystarczy do tego żeby gdzieś tam popada się w jakąś depresję prawda później depresja wiadomo do czego prowadzi.[…] aż w końcu no muszę "}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk", "Recovery"]]], "klass": "contains", "gold": "risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "ABSTRACT", "page": 1, "quote": "We shall show how they use the discursive strategies of distancing in the narratives about fathers' suicide as a means of coping with the two conflicting discourses."}, {"sample": "Study 1 - main sample", "section": "Aims and methodology", "page": 2, "quote": "As we have just indicated, we approached our data with the evidence-based assumption that the positivity and strength of the provider role and negativity and implied weakness of those who complete suicide potentially lead to a conflict. To put it simply: how can a strong father complete such a cowardly act? And so in this article we are interested in stories of (adult) children who lost their fath"}, {"sample": "Study 1 - main sample", "section": "The positive father", "page": 5, "quote": "The stories we obtained were of unquestioned positivity of the father. Consider the following three extracts: ... The constructed commitment to the father and his positivity is quite striking – the father is referred to as an authority4 , 'everything', the most important person. ... Throughout the stories, the positive light in which fathers are rendered is unqualified."}, {"sample": "Study 1 - main sample", "section": "Distancing from suicide", "page": 6, "quote": "In this section we present the stories of the father's suicide. We focus on the strategies of distancing we found in our corpus. We first describe strategies in which the speakers make both the act and 'doer' ambiguous, and then we discuss the stories in which the agentivity is undermined."}, {"sample": "Study 1 - main sample", "section": "Suicide?", "page": 6, "quote": "it's an extraordinary figure for me, certainly. now it can be said that he has become a kind of a legend. it can be said a hero and it is not because of that event, but just by his life."}, {"sample": "Study 1 - main sample", "section": "(4) badany 10, mężczyzna", "page": 7, "quote": "[/page/7/Text/6] The speaker prefers to speak of 'that event', rather than of the suicide. In such a way, we think, the speaker is able to preserve the untarnished image of the father, with a life that does not contain the negatively evaluated suicide. The distancing strategy allows the speaker to keep the positive image intact."}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["10"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - main sample", "section": "ABSTRACT", "page": 1, "quote": "The data come from 10 interviews with survivors of suicidal death of their fathers."}, {"sample": "Study 1 - main sample", "section": "The study", "page": 4, "quote": "The article is based on 10 interviews with adults who survived the suicidal death of their fathers."}]}}}], "summary": {"per_field": {"Country": {"counts": {"exact": 66, "contains": 0, "wrong": 3, "missing": 0}, "strict": {"ced": 66, "ied": 3, "md": 0, "precision": 0.9565217391304348, "recall": 1.0, "f1": 0.9777777777777777, "accuracy": 0.9565217391304348}, "widened": {"ced": 66, "ied": 3, "md": 0, "precision": 0.9565217391304348, "recall": 1.0, "f1": 0.9777777777777777, "accuracy": 0.9565217391304348}}, "Population": {"counts": {"exact": 53, "contains": 7, "wrong": 9, "missing": 0}, "strict": {"ced": 53, "ied": 16, "md": 0, "precision": 0.7681159420289855, "recall": 1.0, "f1": 0.8688524590163935, "accuracy": 0.7681159420289855}, "widened": {"ced": 60, "ied": 9, "md": 0, "precision": 0.8695652173913043, "recall": 1.0, "f1": 0.9302325581395349, "accuracy": 0.8695652173913043}}, "Type": {"counts": {"exact": 43, "contains": 1, "wrong": 25, "missing": 0}, "strict": {"ced": 43, "ied": 26, "md": 0, "precision": 0.6231884057971014, "recall": 1.0, "f1": 0.7678571428571428, "accuracy": 0.6231884057971014}, "widened": {"ced": 44, "ied": 25, "md": 0, "precision": 0.6376811594202898, "recall": 1.0, "f1": 0.7787610619469026, "accuracy": 0.6376811594202898}}, "Area": {"counts": {"exact": 42, "contains": 14, "wrong": 13, "missing": 0}, "strict": {"ced": 42, "ied": 27, "md": 0, "precision": 0.6086956521739131, "recall": 1.0, "f1": 0.7567567567567568, "accuracy": 0.6086956521739131}, "widened": {"ced": 56, "ied": 13, "md": 0, "precision": 0.8115942028985508, "recall": 1.0, "f1": 0.896, "accuracy": 0.8115942028985508}}}, "overall": {"counts": {"exact": 204, "contains": 22, "wrong": 50, "missing": 0}, "strict": {"ced": 204, "ied": 72, "md": 0, "precision": 0.7391304347826086, "recall": 1.0, "f1": 0.85, "accuracy": 0.7391304347826086}, "widened": {"ced": 226, "ied": 50, "md": 0, "precision": 0.8188405797101449, "recall": 1.0, "f1": 0.900398406374502, "accuracy": 0.8188405797101449}}}, "assets": [{"group": "Prompts", "title": "schemas/bennett2023/prompts.yaml", "text": "# Editable prompt prose for the Bennett 2023 male-suicide qualitative meta-synthesis.\n# Domain prose only — wire-contract rules (block_id verbatim, \"None\" sentinel,\n# JSON shape) live in code.\n#\n# Variables targeted (all study-level categorical):\n#   Country, Population, Type, Area\n# Category definitions mirror Jansen 2025 Supplement_A (the ## Bennett2023 block).\n# See schemas/bennett2023/fields.json and docs/reports/2026-06-18-bennett2023-benchmark-feasibility.md.\n\nstage1:\n  system:\n    role: |\n      You are a coding agent for a QUALITATIVE systematic review of male\n      suicide risk and recovery factors. Each paper you receive is ONE\n      PRIMARY qualitative study (interviews, focus groups, psychological\n      autopsy, etc.) that was included in the review. For each target field,\n      find its value in the attached paper section and cite specific\n      evidence. There are NO effect sizes, means, SDs, or sample numbers to\n      extract — only the four categorical descriptors below.\n\n    sample_naming: |\n      A \"sample\" here = one study record. Almost every paper contributes\n      exactly ONE record -> sample label \"main sample\". RARE EXCEPTION: a\n      paper that explicitly reports multiple distinct sub-studies (separate\n      samples / data collections, e.g. \"Study 1\", \"Study 2\") emits one\n      record per sub-study with label \"Study 1\", \"Study 2\", ... DO NOT put\n      the author or year in the sample label. All four fields (Country,\n      Population, Type, Area) key off these labels.\n\n    effect_size_guidance: |\n      Bennett MA coding fields (categorical — pick from the controlled\n      vocabulary; emit the controlled-vocabulary token verbatim):\n\n      ┌─ Country (open vocabulary) ────────────────────────────────────────\n      │ The country where the study was conducted / where the sample\n      │ originated. Read Methods / Participants for the recruitment site,\n      │ city, university, or stated nationality. If multiple countries,\n      │ list each. Use the common short name (\"UK\", \"USA\").\n\n      ┌─ Population (set of 5 categories — ANCHOR TO THE SAMPLE) ──────────\n      │ The suicide experience(s) that DEFINE who was RECRUITED (the sample's\n      │ inclusion criteria) — NOT every suicide phenomenon the paper mentions.\n      │  • \"Attempted Suicide (Mixed)\" — attempt survivors, men AND women.\n      │  • \"Attempted Suicide (Men)\"   — attempt survivors, men only.\n      │  • \"Bereaved (Male Suicide)\"   — bereaved by suicide, deceased male.\n      │  • \"Bereaved (Mixed)\"          — bereaved by suicide, deceased mixed.\n      │  • \"Suicidal Ideation\"         — recruited for ideation, no attempt.\n      │ RULES:\n      │  1. Emit a Population candidate ONLY from text describing WHO WAS\n      │     RECRUITED (Participants / Methods inclusion criteria / the\n      │     abstract's sample sentence).\n      │  2. Do NOT emit a label because participants merely DESCRIBE that\n      │     experience in the Findings. Men recruited as suicide attempters\n      │     who recount past suicidal thoughts are \"Attempted Suicide (Men)\",\n      │     NOT also \"Suicidal Ideation\".\n      │  3. Do NOT emit a label from the Introduction/background or from a\n      │     CITED other study's sample.\n      │  4. Gender qualifier: for ATTEMPT/IDEATION samples it follows the\n      │     PARTICIPANTS' gender (all-male -> (Men); both -> (Mixed)). For\n      │     BEREAVED samples it follows the DECEASED person's gender, NOT the\n      │     informants' (e.g. relatives of men who died by suicide ->\n      │     \"Bereaved (Male Suicide)\" even if the interviewees are women). A\n      │     generic \"suicide attempts\" phrase with no gender does NOT make a\n      │     men-only sample \"(Mixed)\".\n      │  5. Emit MULTIPLE labels only when the inclusion criteria explicitly\n      │     recruited multiple groups (e.g. \"eligible if ideation OR attempt\"\n      │     -> both; a sample of bereaved-by-male-suicide that is a subset of\n      │     bereaved-mixed -> both).\n\n      ┌─ Type (Primary / Secondary) — read the DATA-PROVENANCE sentence ────\n      │ \"Primary\"   = the researchers collected the data FOR THIS study\n      │               (interviews, focus groups, observation, psychological\n      │               autopsy with fresh informant interviews).\n      │ \"Secondary\" = the DATA pre-existed. Emit Secondary when the Methods\n      │               state EITHER of these ABOUT THE DATA:\n      │   (a) the data were previously reported / already collected — e.g.\n      │       \"as previously reported (Author, YEAR), our data...\", \"data\n      │       drawn from the X dataset\", \"re-analysis of [earlier study]'s\n      │       narratives\";\n      │   (b) the data belong to a LARGER / parent project this paper is one\n      │       output of — e.g. \"forms part of a larger research project\n      │       on ...\", \"as part of a wider study\".\n      │ CRITICAL — distinguish DATA-provenance from METHOD/THEORY citation:\n      │ \"the psychological autopsy approach [Shneidman, 1981]\" or citing\n      │ prior literature for a construct is a METHOD citation, NOT secondary\n      │ data -> Primary. A paper that recruits participants and collects its\n      │ OWN interviews with no (a)/(b) statement is Primary, even if it cites\n      │ lots of prior work. When the data-provenance sentence is genuinely\n      │ absent, default to Primary.\n\n      ┌─ Area (multi-label set: Risk / Recovery) ──────────────────────────\n      │ \"Risk\"     = findings about factors that INCREASE suicide risk in\n      │              men (masculine norms, emotional suppression, isolation,\n      │              dysfunctional coping, psychological pain).\n      │ \"Recovery\" = findings about resilience / recovery / protective\n      │              factors (emotional regulation, social connection,\n      │              positive self-perception, help-seeking, therapy).\n      │ MANY studies speak to BOTH — if the paper reports risk factors AND\n      │ any recovery/protective/coping theme, emit BOTH \"Risk\" and\n      │ \"Recovery\". Most of these studies are coded as both at study level,\n      │ so do not be stingy with \"Recovery\". The only \"Recovery\" signals to\n      │ IGNORE are non-findings: a funder/charity acknowledgment (e.g.\n      │ PAPYRUS), a keyword list, or a bare \"more support would help\"\n      │ recommendation with no supporting finding.\n\n  user:\n    section_context: \"SECTION: <<SECTION_TITLE>> (<<SECTION_ID>>)\"\n    content: \"<<SECTION_BLOCKS>>\"\n    assets_note: \"ATTACHED <<ASSET_TYPE>> (block <<ASSET_BLOCK>>): <<ASSET_TEXT>>\"\n    instruction: |\n      Extract a target field ONLY when THIS section is the right kind of\n      evidence for it — quote the sentence verbatim. Return \"None\" otherwise;\n      the aggregator merges across sections, so partial sections are fine.\n        • Country / Type — one candidate per study record, from Methods /\n          Participants / Data-source text.\n        • Population — emit ONLY from text stating WHO WAS RECRUITED (sample\n          inclusion criteria; Participants/Methods; the abstract's sample\n          sentence). Do NOT emit a Population label from a Findings quote\n          where a participant merely describes a suicide experience, nor from\n          background or a cited other study. If this section is not about the\n          sample, return \"None\" for Population.\n        • Area — run TWO SEPARATE sweeps on THIS section; emit whichever\n          apply (one, both, or \"None\"):\n            (1) RISK sweep — does it report a factor that INCREASED these\n                men's suicide risk? -> Risk.\n            (2) RECOVERY sweep — does it report anything that HELPED the\n                participants cope, survive, recover, stay resilient, find\n                meaning, or get support that worked? -> Recovery. LOOK\n                DELIBERATELY: recovery findings are easy to miss in a\n                risk-dominated paper, and a study of suicide deaths/attempts\n                often STILL reports survivors' coping, protective factors,\n                recovery journeys, or what helped. A positive/protective\n                valence ABOUT THE PARTICIPANTS is the signal.\n          \"Recovery\" does NOT include: acknowledgments, funder/charity names,\n          keyword lists, generic \"more support would help\" recommendations, a\n          CITED other study's findings, or risk-framed content (e.g. \"loss of\n          faith led to the attempt\" is RISK, not recovery).\n      For Population, it is fine to emit just one group for a section — do NOT\n      pad with another unless this section's evidence supports it.\n\nstage2:\n  census_system: |\n    You are a meta-analysis aggregator for a qualitative male-suicide review.\n    From the candidate descriptions below, enumerate every DISTINCT study\n    record reported in the paper.\n\n    For almost every paper, the article contributes ONE study record\n    (sample_label = \"main sample\").\n\n    PAPERS WITH MULTIPLE SUB-STUDIES: only when a paper explicitly presents\n    separate sub-studies with their own samples/data collections, emit one\n    record per sub-study (sample_label = \"Study 1\", \"Study 2\", ...). DO NOT\n    split a single study by gender, by outcome group, or by risk-vs-recovery.\n\n    Output fields per record:\n      - study_index: 1, 2, 3, ... in presentation order.\n      - sample_label: \"main sample\" (single record) or \"Study 1\"/\"Study 2\"\n        (multi-sub-study). No author or year in the label.\n      - total_n: qualitative sample size if stated, else null (NOT scored).\n      - gender: \"all_female\" / \"all_male\" / \"mixed\".\n\n    Rules:\n      - Do NOT enumerate gender as separate samples.\n      - Do NOT enumerate Population outcome groups as separate samples.\n      - Do NOT enumerate Risk/Recovery as separate samples.\n\n  field_system: |\n    You are a meta-analysis aggregator resolving ONE field across candidate\n    extractions from different sections. Map each candidate's value onto the\n    FIXED list of sample keys from the census; sample_key MUST be one of\n    those keys. Cite the candidate indices you relied on in best_indices and\n    explain briefly in reasoning. Follow the VALUE SHAPE instruction exactly.\n\n    SELECTION HEURISTICS (in priority order):\n\n    0. NULL IS NOT A VOTE. A candidate that emits null / \"None\" / [] has only\n       reported absence in that section; treat it as SILENT. If even ONE\n       candidate gives a non-null value with a real evidence quote, adopt it.\n\n    1. Section labels are unreliable (Marker mis-classifies). Trust the\n       evidence quote over the `from=` section label.\n\n    2. Prefer evidence from Title / Abstract / Methods / Participants /\n       Results over Introduction / Discussion / References.\n\n    3. COUNTRY (single value per study): pick the country where data were\n       collected. If candidates name several countries for one sample only\n       because they cite OTHER studies, keep only the country of THIS study's\n       data collection.\n\n    4. TYPE (single value, rarely two): default \"Primary\"; emit \"Secondary\"\n       only when evidence says the data pre-existed / were a secondary\n       analysis.\n\n    MULTI-LABEL UNION (Population, Area; and Type when genuinely both) —\n    EVIDENCE-GATED, NOT a blind union. Over-prediction is the main error mode;\n    a label needs QUALIFYING evidence, and a lone weak candidate does NOT\n    force inclusion:\n      1. First DISCARD non-qualifying candidates, THEN union what remains.\n      2. POPULATION — keep a candidate only if its evidence describes WHO WAS\n         RECRUITED (inclusion criteria / sample definition / abstract sample\n         sentence). DISCARD candidates whose evidence is a Findings quote of a\n         participant describing an experience, an Introduction/background\n         line, or a cited other study. So a men-attempter sample where\n         \"Suicidal Ideation\" appears only in findings quotes -> drop it.\n         Keep the gender qualifier the SAMPLE supports (do not turn a\n         men-only sample into \"(Mixed)\" from a generic phrase).\n      3. AREA — keep a candidate only if its evidence is a genuine FINDING\n         about the participants (positive/protective valence for Recovery;\n         risk-increasing valence for Risk). DISCARD \"Recovery\" candidates\n         whose evidence is an acknowledgment, funder/charity name, keyword, a\n         \"more support would help\" recommendation, a CITED other study, or\n         risk-framed content. BUT: if even ONE candidate reports a genuine\n         protective/coping/recovery finding about THESE participants, INCLUDE\n         \"Recovery\" — do NOT drop it just because Risk candidates are far more\n         numerous. A risk-dominated paper that still reports one real\n         protective finding is {Risk, Recovery}.\n      4. After discarding, a category that STILL has qualifying evidence MUST\n         be kept even if it appears once. (Rule 1 removes noise; it does not\n         license dropping a genuinely-evidenced minority label.)\n      5. TYPE — emit \"Secondary\" ONLY if a candidate's evidence is a\n         DATA-PROVENANCE statement: the data were (a) previously reported /\n         already collected (\"as previously reported (Author, YEAR), our\n         data...\") or (b) part of a larger/parent project (\"forms part of a\n         larger research project\"). A METHOD or theory citation (e.g.\n         \"psychological autopsy [Shneidman, 1981]\") is NOT such evidence ->\n         Primary. No data-provenance statement -> Primary.\n\n    FINAL SELF-CHECK — run this verification over your proposed value for\n    EACH field BEFORE emitting (check BOTH directions: unsupported labels to\n    drop, and required labels you may have missed):\n      • POPULATION:\n          - DROP any label whose only support is a Findings quote, background,\n            or a cited other study (e.g. \"Suicidal Ideation\" mentioned by a\n            couple of participants but not an inclusion criterion).\n          - ADD any group the INCLUSION CRITERIA recruited that you left out\n            (e.g. eligibility \"attempters AND ideators\" -> BOTH must appear;\n            do not collapse to one).\n          - Bereaved gender follows the DECEASED: relatives of men who died ->\n            \"Bereaved (Male Suicide)\"; if the deceased include men AND women,\n            emit both bereaved labels.\n      • TYPE: confirm \"Secondary\" only if a DATA-provenance statement (a)/(b)\n        exists; re-read whether the cited prior work is the DATA SOURCE or\n        just a method/theory citation. Else \"Primary\".\n      • AREA: do a dedicated RECOVERY sweep — re-scan EVERY candidate for a\n        genuine protective/coping/recovery finding about the participants; if\n        any exists, \"Recovery\" MUST be in the set even if Risk dominates.\n        Keep \"Risk\" likewise on a real risk finding. Ignore acknowledgments,\n        funder/charity names, keyword lists, recommendations, cited studies,\n        and risk-framed content (those are NOT recovery findings).\n\n    NO SYNTHESIZED VALUES: only emit a value backed by a candidate's evidence.\n\n  flat_system: |\n    All Bennett fields are study-scoped (one study census per paper). Treat\n    every candidate as belonging to the study census; there are no\n    paper-flat (non-sample) fields.\n\n  gender_shape: |\n    VALUE SHAPE: gender-specific fields output [total, female, male].\n    (Bennett has NO gender-specific fields — this shape is unused.)\n\n  nongender_shape: |\n    VALUE SHAPE: this is NOT a gender-specific field. For each sample key\n    output a SINGLE-element list, [value]. For the multi-label fields\n    (Population, Area, and Type when both), the list value is itself a list\n    of category tokens, e.g. [[\"Risk\", \"Recovery\"]] or\n    [[\"Attempted Suicide (Men)\"]].\n"}, {"group": "Schema & field definitions", "title": "schemas/bennett2023/fields.json", "text": "{\n  \"version\": 3,\n  \"meta_analysis\": \"Bennett et al. (2023) — Male suicide risk and recovery factors: a qualitative meta-synthesis\",\n  \"doi\": \"10.1037/bul0000397\",\n  \"jansen_label\": \"Bennett2023\",\n  \"rationale\": \"Bennett is a QUALITATIVE meta-synthesis: no effect sizes. The extraction unit is each included primary study; the task is the 4 categorical variables Jansen 2025 benchmarked (Country, Population, Type, Area). Gold lives in Jansen's d_long.xlsx at (study x variable) granularity; see eval/bennett2023/gold_studylevel.csv and docs/reports/2026-06-18-bennett2023-benchmark-feasibility.md. Population and Area are multi-label (a study can list several suicide-outcome groups, and 49/69 studies cover BOTH risk and recovery), so they aggregate to a study-level SET. Type is multi-label only for the rare primary+secondary study. Country is open-vocabulary free text.\",\n  \"fields\": [\n    {\n      \"name\": \"Sample\",\n      \"scope\": \"sample\",\n      \"gender_specific\": false,\n      \"type\": \"object\",\n      \"items_type\": \"integer\",\n      \"definition\": \"Anchors the within-paper study census. Each included PRIMARY paper is normally ONE study record -> sample_key 'main sample'. EXCEPTION: an article that explicitly reports multiple distinct sub-studies emits one record per sub-study -> 'Study 1', 'Study 2'. DO NOT put the author or year in the sample_key. The Country / Population / Type / Area values key off these same labels. total_n is the qualitative sample size if the paper reports one (else null) — it is NOT scored, it only anchors the census.\"\n    },\n    {\n      \"name\": \"Country\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"string\",\n      \"items_type\": \"string\",\n      \"definition\": \"The country in which the study was conducted (open vocabulary — any country name, e.g. 'UK', 'Ghana', 'Australia'). Determined from where data were collected / where the sample originated. If conducted in multiple countries, list each. Gold is stored lowercase; the validator normalizes case + common aliases (e.g. 'United Kingdom'->'uk', 'USA'/'United States'->'america').\",\n      \"skill_hints\": \"Read Methods / Participants for the study location or sample origin (university, city, recruitment site). Keywords: participants, origin, university, country, citizens.\",\n      \"validator_match\": \"string_normalized\"\n    },\n    {\n      \"name\": \"Population\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"multi_label\",\n      \"items_type\": \"enum\",\n      \"allowed_values\": [\n        \"Attempted Suicide (Mixed)\",\n        \"Attempted Suicide (Men)\",\n        \"Bereaved (Male Suicide)\",\n        \"Bereaved (Mixed)\",\n        \"Suicidal Ideation\"\n      ],\n      \"value_labels\": {\n        \"Attempted Suicide (Mixed)\": \"Individuals who made one or more suicide attempts but survived, both men and women\",\n        \"Attempted Suicide (Men)\": \"Suicide-attempt survivors, restricted to men only\",\n        \"Bereaved (Male Suicide)\": \"People bereaved by suicide where the deceased was male\",\n        \"Bereaved (Mixed)\": \"People bereaved by suicide, deceased of mixed/both genders\",\n        \"Suicidal Ideation\": \"Individuals with thoughts of ending their life without a suicide attempt\"\n      },\n      \"definition\": \"Suicide-experience group(s) that DEFINE the study SAMPLE — i.e. who was recruited (the inclusion criteria), NOT every suicide phenomenon discussed. Multi-label ONLY when the inclusion criteria explicitly recruited more than one distinct group (e.g. Lusk2018 recruited people with EITHER ideation OR an attempt -> two labels; Jordan2012 recruited attempters AND ideators -> two labels). Aggregates to a study-level set.\",\n      \"skill_hints\": \"ANCHOR to the SAMPLE's inclusion criteria in Participants/Methods ('we recruited men who had attempted suicide', 'eligible if history of ideation or attempt'). Set the gender qualifier from the SAMPLE composition: all-male sample -> (Men)/(Male Suicide); both genders -> (Mixed) — a generic phrase like 'suicide attempts' without gender does NOT override a men-only sample. Do NOT add a group just because: (a) participants describe it in the FINDINGS (men recruited as attempters who recount past ideation are NOT a 'Suicidal Ideation' sample); (b) it appears in the Introduction/background or a CITED other study. Keywords: 'participants were', 'we recruited', 'eligible', 'inclusion criteria', bereaved, attempted, ideation.\",\n      \"validator_match\": \"set_overlap\",\n      \"validator_note\": \"Gold strings in d_long are messy/compound (e.g. 'attempted suicide (men)' vs 'attempted suicide (male)', 'mixture'/'mixed', typo 'non-attemtped'). The validator normalizes to the 5 canonical labels before set comparison.\"\n    },\n    {\n      \"name\": \"Type\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"multi_label\",\n      \"items_type\": \"enum\",\n      \"allowed_values\": [\"Primary\", \"Secondary\"],\n      \"value_labels\": {\n        \"Primary\": \"Data collected directly by the researchers (interviews, surveys, experiments, observations)\",\n        \"Secondary\": \"Analysis of pre-existing data (prior studies, datasets, document/literature review)\"\n      },\n      \"definition\": \"Whether the DATA analyzed were collected specifically for THIS study (Primary) or pre-existed (Secondary). Decide from the data-provenance sentence. Secondary signals (about the DATA, not the method): (a) the data were previously reported/already collected ('as previously reported (Author, YEAR), our data...'); (b) the data belong to a larger/parent project ('forms part of a larger research project'). A METHOD/theory citation (e.g. 'psychological autopsy [Shneidman, 1981]') is NOT secondary data. A paper recruiting participants and collecting its own interviews with no (a)/(b) statement is Primary even if it cites much prior work. Usually a single value; multi-label only when genuinely both. ~85% are 'Primary' (degenerate) — report kappa alongside accuracy.\",\n      \"skill_hints\": \"Ask: were these data collected FOR this study, or drawn from a pre-existing/larger dataset? SECONDARY cues: 'data from our previous study / [prior citation]', 'as part of a larger study/project', 're-analysis', 'secondary analysis', 'the same dataset/narratives as [earlier paper]', 'drawn from a corpus collected for...'. If this paper re-analyzes interviews/narratives gathered for another study (even by the same authors) -> Secondary. Do NOT mark Secondary merely because the Method or theoretical constructs cite prior literature.\",\n      \"validator_match\": \"set_overlap\"\n    },\n    {\n      \"name\": \"Area\",\n      \"scope\": \"study\",\n      \"gender_specific\": false,\n      \"type\": \"multi_label\",\n      \"items_type\": \"enum\",\n      \"allowed_values\": [\"Risk\", \"Recovery\"],\n      \"value_labels\": {\n        \"Risk\": \"Examines factors that INCREASE male suicide risk (cultural norms, emotional suppression, social isolation, dysfunctional coping, impaired psychological-pain regulation)\",\n        \"Recovery\": \"Examines factors that support resilience/recovery (emotional regulation, meaningful social connection, positive self-perception, therapeutic intervention)\"\n      },\n      \"definition\": \"Whether the study's analytical FINDINGS about the participants speak to suicide RISK factors, RECOVERY/protective factors, or both. Judge from the study's own RESULTS/FINDINGS, not from framing words elsewhere. Multi-label and frequently BOTH (49/69 studies), so scored as set overlap. Emit Recovery ONLY if the findings actually report factors that supported resilience/recovery IN THE PARTICIPANTS — NOT from: a funder/charity acknowledgment (e.g. a suicide-PREVENTION charity), keywords, or a Discussion recommendation that 'better support could have helped'.\",\n      \"skill_hints\": \"Read the RESULTS/FINDINGS themes. Risk = findings about what increased these men's suicide risk (masculine norms, emotional suppression, isolation, dysfunctional coping). Recovery = findings about what helped them survive/recover/be resilient (emotional regulation, connection, meaning, help that worked). Emit {Risk, Recovery} only when the findings genuinely report BOTH. IGNORE for Area: acknowledgments, funding/charity names, keyword lists, and generic prevention recommendations.\",\n      \"validator_match\": \"set_overlap\",\n      \"validator_note\": \"Jansen scored Area at the quote/instance level (n~118/model) because most studies are both. We score the study-level set with overlap.\"\n    }\n  ]\n}\n"}, {"group": "Ground-truth mapping", "title": "eval/bennett2023/README.md", "text": "# Bennett 2023 — study-level extraction benchmark (pilot)\n\nBennett, S., Robb, K. A., Zortea, T. C., Dickson, A., Richardson, C., & O'Connor, R. C. (2023).\n*Male suicide risk and recovery factors: A systematic review and qualitative meta-synthesis of\ntwo decades of research.* Psychological Bulletin, 149(7–8), 371–417. https://doi.org/10.1037/bul0000397\n\nSource review PDF: `Jansen2025/Bennett2023_77/2024-05957-001.pdf`\n\n## What this benchmark is\n\nBennett is a **qualitative meta-synthesis**, not a quantitative meta-analysis — it has no\nmeans/SDs/Ns/effect sizes. The unit of extraction is the **primary study** included in the\nreview (~69–78 of them). For each primary study, the task is to extract **4 categorical\nvariables**, matching exactly what Jansen 2025 benchmarked:\n\n| Variable | Meaning | Gold cleanliness | Jansen 8-model accuracy |\n|---|---|---|---|\n| `Country` | country the study was conducted in | clean (67/69 single-valued) | 83.3 – 94.4 % |\n| `Type` | primary vs secondary data | clean but **degenerate** (~all \"primary\"; κ≈0) | 65.2 – 82.2 % |\n| `Population` | suicide outcome group | **messy** (24+ strings, compound labels, typos) | 34.7 – 64.6 % |\n| `Area` | risk vs recovery focus | **multi-label** (49/69 are BOTH) | 49.5 – 71.2 % |\n\nThis is a *study-level categorical-coding* benchmark, directly comparable to Jansen's published\nper-model numbers — unlike the Supplement G 9-column table, which Jansen never scored and whose\nonly in-paper source is the supplement itself (source leakage).\n\n## Provenance of the gold\n\n`gold_studylevel.csv` is pivoted from Jansen's own scoring file\n`Jansen2025/osfstorage-archive/Archive/analysis/d_long.xlsx` (sheet `Sheet1`, `meta=='Bennett2023'`),\nwhich scores at **(study × variable × model)** granularity: column `code` = gold answer,\n`llm_answer` = model answer, `llm_code_num` = correctness.\n\n**Harness validation:** aggregating `d_long` by (model × variable) reproduces Jansen's published\nper-model accuracy ranges *exactly* for Country/Type/Area and within rounding for Population\n(see `docs/reports/2026-06-18-bennett2023-benchmark-feasibility.md`). This confirms the gold +\nscoring path before any of our own extraction is run.\n\n## Comparison-unit caveats (read before scoring)\n\n- **Area is multi-label.** 49/69 studies contribute both \"risk\" and \"recovery\" quotes, so a single\n  per-study Area is ill-defined. Jansen scored Area at the quote/instance level (n≈118/model, not 69).\n  Our scorer should treat the gold as a *set* and score set-overlap, not exact string match.\n- **Population needs normalization.** Gold strings are inconsistent (`attempted suicide (men)` vs\n  `attempted suicide (male)`, `mixture` vs `mixed`, the typo `non-attemtped`). A normalization map\n  is required or accuracy is artificially depressed.\n- **Type is near-constant** (\"primary\"); report accuracy *and* kappa, since accuracy alone is\n  misleading on a degenerate class.\n- 69 studies are scored in `d_long`; Supplement G lists 78 and `human_coding_final` has 75. The\n  delta is studies Jansen dropped from scoring; we follow `d_long` (the scored set).\n\n## The blocker: source PDFs\n\nOur extraction pipeline reads each **included primary-study PDF** (cf. `data/runs/jansen_ng2023/<Study>/`).\nThose ~69 primary papers are **not** in the dataset — only the Bennett review is. The review body\ncontains no per-study metadata table (it defers to Supplement G), so the primaries must be sourced\nto run a real extraction. `study_references.csv` carries the citation + DOI for 53/69; the 10-study\npilot in `pilot_studies.csv` all have clean DOIs.\n\n## Files\n\n| File | Contents |\n|---|---|\n| `gold_studylevel.csv` | 69 studies × {Country, Population, Type, Area}, pivoted from `d_long` |\n| `study_references.csv` | study → DOI + citation, parsed from the Bennett reference list (53/69 matched) |\n| `pilot_studies.csv` | the 10-study smoke subset (coverage-greedy: 10 countries, 10 populations, all Types, both Area patterns) — all with DOIs |\n\n## Next steps (pilot, gated on PDFs)\n\n1. Source the 10 pilot PDFs from the DOIs in `pilot_studies.csv` → `data/runs/jansen_bennett2023/<Study>/`.\n2. Add a `goldlib_bennett.py` + validator for the 4 categorical vars (with Population normalization\n   + multi-label Area scoring).\n3. Run our extraction agent on the 10, score against `gold_studylevel.csv`, compare to Jansen's\n   per-model baseline.\n4. If the harness holds, scale to the full ~69.\n"}]};
const fields = DATA.fields;
const evald = new Set(DATA.evaluated_fields);
const papers = DATA.papers;
const byId = {}; papers.forEach(p => byId[p.id] = p);
let pinned = null;
let std = 'strict';

// klass -> outcome under each standard
const STD = {
  strict:  {exact:'correct', contains:'incorrect (partial)', wrong:'incorrect', missing:'missing'},
  widened: {exact:'correct', contains:'correct',             wrong:'incorrect', missing:'missing'},
};

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function pct(x){ return (x*100).toFixed(1)+'%'; }
function f3(x){ return x.toFixed(3); }

document.getElementById('title').textContent = DATA.ma_name + " — reference vs extracted";
document.getElementById('subtitle').textContent =
  "Gold: " + DATA.gold_label + " · " + papers.length + " papers · ★ = scored field · metric = revision paper CED/IED/MD";

// ---- assets panel ----
(function(){
  const groups = {};
  (DATA.assets||[]).forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
  const order = ["Prompts","Schema & field definitions","Rules","Ground-truth mapping"];
  const body = document.getElementById('assetsBody');
  let html = '';
  for (const g of order) {
    const items = groups[g]; if (!items) continue;
    html += `<div class="asset-group"><div class="gh">${esc(g)}</div>`;
    for (const a of items) {
      html += `<div class="asset"><details><summary>${esc(a.title)}</summary><pre>${esc(a.text)}</pre></details></div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html || '<em>No assets found.</em>';
})();

// ---- metric panels ----
function renderPanel(elId, label, sub){
  const el = document.getElementById(elId);
  const key = elId === 'panelStrict' ? 'strict' : 'widened';
  const o = DATA.summary.overall[key];
  let h = `<h3>${label} <span class="tag">— ${sub}</span></h3>`;
  h += `<div class="bigrow">
    <div class="big"><b>${f3(o.f1)}</b><span>F1</span></div>
    <div class="big"><b>${f3(o.precision)}</b><span>Precision</span></div>
    <div class="big"><b>${f3(o.recall)}</b><span>Recall</span></div>
    <div class="big"><b>${pct(o.accuracy)}</b><span>Accuracy</span></div>
  </div>`;
  h += `<div class="counts">CED ${o.ced} · IED ${o.ied} · MD ${o.md} &nbsp;(${o.ced+o.ied+o.md} scored data points)</div>`;
  h += `<table class="fm"><thead><tr><th>field</th><th>P</th><th>R</th><th>F1</th><th>Acc</th></tr></thead><tbody>`;
  for (const f of DATA.evaluated_fields) {
    const m = DATA.summary.per_field[f][key];
    h += `<tr><td>${esc(f)}</td><td>${f3(m.precision)}</td><td>${f3(m.recall)}</td><td>${f3(m.f1)}</td><td>${pct(m.accuracy)}</td></tr>`;
  }
  h += `</tbody></table>`;
  el.innerHTML = h;
}
renderPanel('panelStrict', 'Strict', 'exact match only');
renderPanel('panelWidened', 'Widened', 'reference within extraction = match');

function markActivePanel(){
  document.getElementById('panelStrict').classList.toggle('active', std==='strict');
  document.getElementById('panelWidened').classList.toggle('active', std==='widened');
}

// ---- cell color ----
function cellColor(klass){
  if (!klass || klass==='neutral') return 'neutral';
  if (klass==='exact') return 'full';
  if (klass==='contains') return std==='widened' ? 'full' : 'partial';
  return 'none'; // wrong | missing
}

function renderCell(cell){
  if (!cell || cell.kind === 'empty') return '<span class="empty-val">(empty)</span>';
  if (cell.kind === 'scalar') return esc(cell.text);
  return cell.rows.map(([label, vals]) =>
    `<div class="sub"><span class="sub-h">${esc(label)}:</span> ${vals.map(esc).join(', ')}</div>`).join('');
}

// ---- tooltip ----
const tt = document.getElementById('tooltip');
function showTip(pid, field, x, y){
  const cell = byId[pid].cells[field];
  if (!cell) { tt.style.display='none'; return; }
  const k = cell.klass || 'neutral';
  let h = `<div class="tt-row"><span class="tt-label">${esc(pid)}</span> · ${esc(field)} <span class="tt-klass">${k}</span></div>`;
  if (k !== 'neutral') {
    h += `<div class="tt-std">strict: <b>${STD.strict[k]}</b> &nbsp;·&nbsp; widened: <b>${STD.widened[k]}</b></div>`;
  }
  if (cell.gold != null) {
    h += `<div class="tt-gold"><span class="tt-label">reference:</span> ${esc(cell.gold)}`;
    if (cell.gold_source) h += `<div class="tt-src">source: ${esc(cell.gold_source)}</div>`;
    h += `</div>`;
  } else {
    h += `<div class="tt-gold tt-src">no reference value (unscored)</div>`;
  }
  if (cell.evidence && cell.evidence.length) {
    h += `<div class="tt-ev"><span class="tt-label">evidence (${cell.evidence.length}):</span>`;
    for (const e of cell.evidence) {
      const loc = [e.sample, e.section, (e.page!=null?('p.'+e.page):null)].filter(Boolean).map(esc).join(' · ');
      h += `<div style="margin-top:4px"><div class="q">“${esc(e.quote)}”</div>${loc?`<div class="meta">${loc}</div>`:''}</div>`;
    }
    h += `</div>`;
  }
  tt.innerHTML = h; tt.style.display='block';
  const r = tt.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  let left=x+12, top=y+12;
  if (left+r.width>vw-10) left=x-r.width-12;
  if (top+r.height>vh-10) top=y-r.height-12;
  tt.style.left=Math.max(10,left)+'px'; tt.style.top=Math.max(10,top)+'px';
}
function hideTip(){ tt.style.display='none'; tt.classList.remove('pinned'); }

// ---- table ----
function buildTable(visible){
  const hr = document.getElementById('headerRow');
  hr.innerHTML = '<th>Paper</th>' + fields.map(f => `<th class="${evald.has(f)?'evald':''}" title="${esc(f)}">${esc(f)}</th>`).join('');
  const rows = visible.map(pid => {
    const p = byId[pid];
    let tr = `<tr><td title="${esc(pid)}">${esc(pid)}</td>`;
    for (const f of fields) {
      const cell = p.cells[f];
      tr += `<td><div class="cell ${cellColor(cell&&cell.klass)}" data-p="${esc(pid)}" data-f="${esc(f)}">${renderCell(cell)}</div></td>`;
    }
    return tr + '</tr>';
  });
  document.getElementById('tableBody').innerHTML = rows.join('');
  document.getElementById('paperCount').textContent = visible.length + ' papers';
  document.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('mouseenter', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mousemove', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mouseleave', () => { if(!pinned) hideTip(); });
    c.addEventListener('click', e => {
      e.stopPropagation();
      const same = pinned && pinned.p===c.dataset.p && pinned.f===c.dataset.f;
      document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
      if (same) { pinned=null; hideTip(); }
      else { pinned={p:c.dataset.p,f:c.dataset.f}; c.classList.add('pinned'); showTip(c.dataset.p,c.dataset.f,e.clientX,e.clientY); tt.classList.add('pinned'); }
    });
  });
}
document.addEventListener('click', e => {
  if (pinned && !e.target.closest('.cell') && !e.target.closest('.tooltip')) {
    pinned=null; hideTip(); document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
  }
});

const viewMode=document.getElementById('viewMode'), paperSelect=document.getElementById('paperSelect'), searchBox=document.getElementById('searchBox');
papers.forEach(p => { const o=document.createElement('option'); o.value=p.id; o.textContent=p.id; paperSelect.appendChild(o); });
function refresh(){
  const search=searchBox.value.trim().toLowerCase();
  let vis;
  if (viewMode.value==='single'){ paperSelect.style.display=''; vis=[paperSelect.value]; }
  else { paperSelect.style.display='none'; vis=papers.map(p=>p.id); }
  if (search) vis=vis.filter(id=>id.toLowerCase().includes(search));
  pinned=null; hideTip(); buildTable(vis);
}
viewMode.onchange=refresh; paperSelect.onchange=refresh; searchBox.oninput=refresh;
document.querySelectorAll('input[name=std]').forEach(r => r.addEventListener('change', e => {
  std = e.target.value; markActivePanel(); refresh();
}));

markActivePanel();
refresh();
</script>
</body>
</html>
