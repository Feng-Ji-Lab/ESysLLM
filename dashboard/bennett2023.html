<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Dashboard — reference vs extracted</title>
<style>
:root {
  --bg:#f8f9fa; --text:#212529; --border:#dee2e6;
  --header-bg:#343a40; --header-text:#f8f9fa;
  --cell-border:rgba(150,150,150,0.4);
  --full:rgba(72,199,116,0.28); --partial:rgba(255,221,87,0.34);
  --none:rgba(255,99,99,0.24); --neutral:rgba(200,200,200,0.12);
  --full-s:#48c774; --partial-s:#ffdd57; --none-s:#ff6363; --neutral-s:#ccc;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:13px; background:var(--bg); color:var(--text); line-height:1.4; }
.topbar { background:#fff; border-bottom:2px solid var(--border); padding:12px 18px; }
.topbar h1 { font-size:1.2rem; font-weight:700; }
.topbar .sub { color:#6b7280; font-size:12px; margin-top:2px; }

/* assets */
.assets { margin:12px 0; border:1px solid var(--border); border-radius:8px; background:#fcfcfd; }
.assets > summary { cursor:pointer; padding:10px 14px; font-weight:600; color:#1d4ed8; list-style:none; }
.assets > summary::before { content:'▸ '; }
.assets[open] > summary::before { content:'▾ '; }
.assets-body { padding:6px 14px 14px; }
.asset-group { margin-top:10px; }
.asset-group > .gh { font-weight:700; font-size:12px; color:#374151; text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
.asset details { border:1px solid var(--border); border-radius:6px; margin:5px 0; background:#fff; }
.asset details > summary { cursor:pointer; padding:6px 10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#0f172a; }
.asset pre { margin:0; padding:10px 12px; border-top:1px solid var(--border); background:#0f172a; color:#e2e8f0; font-size:11.5px; line-height:1.5; overflow:auto; max-height:420px; }

/* standard toggle + metric panels */
.stdtoggle { margin:12px 0 6px; display:flex; gap:18px; align-items:center; font-size:13px; }
.stdtoggle label { cursor:pointer; }
.stdtoggle .hint { color:#6b7280; font-size:12px; }
.panels { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .panels { grid-template-columns:1fr; } }
.panel { border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff; }
.panel.active { border-color:#1d4ed8; box-shadow:0 0 0 2px rgba(29,78,216,.12); }
.panel h3 { font-size:13px; margin-bottom:8px; }
.panel h3 .tag { font-weight:500; color:#6b7280; }
.bigrow { display:flex; gap:16px; margin:6px 0 8px; }
.big b { font-size:1.45rem; font-weight:700; display:block; line-height:1; }
.big span { font-size:11px; color:#6b7280; }
.counts { font-size:11.5px; color:#6b7280; margin-bottom:8px; }
table.fm { width:100%; border-collapse:collapse; font-size:11.5px; }
table.fm th, table.fm td { padding:3px 6px; border-bottom:1px solid var(--border); text-align:right; }
table.fm th:first-child, table.fm td:first-child { text-align:left; }
table.fm th { color:#6b7280; font-weight:600; }

/* controls */
.controls { position:sticky; top:0; z-index:1000; background:#fff; border-bottom:2px solid var(--border); padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.controls label { font-weight:600; font-size:12px; }
.controls input[type=text], .controls select { padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; }
.controls input[type=text] { width:200px; }
.controls .sep { border-left:1px solid var(--border); height:26px; }
.controls .badge { background:#e9ecef; padding:2px 8px; border-radius:10px; font-size:11px; color:#495057; }
.legend { display:flex; gap:12px; align-items:center; font-size:11px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-swatch { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,0.15); }

/* table */
.table-wrap { overflow:auto; max-height:calc(100vh - 60px); }
table.grid { border-collapse:separate; border-spacing:0; min-width:100%; }
.grid thead th { position:sticky; top:0; z-index:100; background:var(--header-bg); color:var(--header-text); padding:8px 10px; font-size:11px; font-weight:600; text-align:left; white-space:nowrap; border-right:1px solid rgba(255,255,255,0.1); min-width:150px; }
.grid thead th.evald::after { content:" \2605"; color:#ffd43b; }
.grid thead th:first-child { left:0; z-index:200; min-width:170px; max-width:220px; }
.grid tbody td { vertical-align:top; padding:4px 6px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); min-width:150px; }
.grid tbody td:first-child { position:sticky; left:0; z-index:50; background:#fff; font-weight:600; font-size:12px; min-width:170px; max-width:220px; word-break:break-word; border-right:2px solid var(--border); }
.cell { border:1px solid var(--cell-border); border-radius:4px; padding:4px 6px; cursor:pointer; min-height:24px; transition:box-shadow .15s; }
.cell:hover { box-shadow:0 0 0 2px rgba(66,133,244,0.3); }
.cell.pinned { box-shadow:0 0 0 2px rgba(66,133,244,0.6); }
.cell.full { background:var(--full); } .cell.partial { background:var(--partial); }
.cell.none { background:var(--none); } .cell.neutral { background:var(--neutral); }
.sub { margin-bottom:3px; } .sub:last-child { margin-bottom:0; }
.sub-h { font-weight:600; font-size:11px; color:#495057; }
.empty-val { color:#aaa; font-style:italic; }
.tooltip { position:fixed; z-index:5000; background:#fff; border:1px solid #aaa; border-radius:6px; padding:10px 12px; max-width:520px; min-width:220px; box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:12px; line-height:1.5; display:none; }
.tooltip.pinned { pointer-events:auto; }
.tt-row { margin-bottom:5px; } .tt-label { font-weight:700; color:#333; }
.tt-klass { display:inline-block; padding:1px 8px; border-radius:999px; font-weight:700; font-size:11px; background:#eef; }
.tt-std { font-size:11px; color:#374151; }
.tt-gold { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-src { color:#6b7280; font-size:11px; }
.tt-ev { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-ev .q { color:#333; } .tt-ev .meta { color:#6b7280; font-size:11px; }
</style>
</head>
<body>
<div class="topbar">
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>

  <details class="assets" id="assetsPanel">
    <summary>Customizations — prompts · schema · field definitions · rules (click to expand)</summary>
    <div class="assets-body" id="assetsBody"></div>
  </details>

  <div class="stdtoggle">
    <strong>Standard:</strong>
    <label><input type="radio" name="std" value="strict" checked> Strict (exact match)</label>
    <label><input type="radio" name="std" value="widened"> Widened (reference within extraction)</label>
    <span class="hint">— toggles cell coloring; both panels below always shown</span>
  </div>
  <div class="panels">
    <div class="panel" id="panelStrict"></div>
    <div class="panel" id="panelWidened"></div>
  </div>
</div>

<div class="controls">
  <label>View:</label>
  <select id="viewMode"><option value="all">All papers</option><option value="single">Single paper</option></select>
  <select id="paperSelect" style="display:none"></select>
  <div class="sep"></div>
  <label>Search:</label><input type="text" id="searchBox" placeholder="Filter papers...">
  <div class="sep"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--full)"></div>exact (correct)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--partial)"></div>contains (→correct if widened)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--none)"></div>wrong / missing</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--neutral)"></div>no gold</div>
  </div>
  <div class="sep"></div>
  <span class="badge" id="paperCount"></span>
</div>

<div class="table-wrap"><table class="grid"><thead><tr id="headerRow"></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="tooltip" id="tooltip"></div>

/3/Text/7] The only noted significance was the experience of command auditory hallucinations during times of decompensation (52% repeated attempters, 3% nonattempters, p < .001). In the interview sample, five (42%) of the participants also reported hearing voices that urged them to kill themselves preceding one or more of their attempts. [/page/5/Text/6] with persons who made repeated attemp"}, {"sample": "Study 1 - Chart Review Sample", "section": "Impulsivity During Times of Distress", "page": null, "quote": "Of the 44 patients in the chart review, 34 (77%) were characterized as \"impulsive.\" Based on partial information from the narratives of the interviews, the circumstances of the participants' suicide attempts also indicated a high level of impulsivity. Most attempts appeared to be triggered by arguments with significant others or disappointing news related to finances, housing, and employment. All "}, {"sample": "Study 1 - Chart Review Sample", "section": "Life Stressors and Coping Mechanism", "page": null, "quote": "The relatively high percentage of persons repeating attempts (34%; 10 of 29 cases) who lived alone or in shelters was in congruence with the data of social isolation noted in the overall demographic profile of the two study samples, and should still be considered as a potential indicator of the type of social instability associated with greater risk. The considerable number of common life stressor"}, {"sample": "Study 1 - Chart Review Sample", "section": "Retrospective Chart Reviews and Comparative Analysis", "page": null, "quote": "[page/1/Text/14] A chart review instrument was used to gather data on the identified patients' demographics, psychopathology, psychosocial stressors, and history of suicidal attempts."}, {"sample": "Study 1 - Chart Review Sample", "section": "Mental Illness and Comorbid Issues as Correlates of  Suicide Risk Factor", "page": 3, "quote": "[/page/3/Text/7] The only noted significance was the experience of command auditory hallucinations during times of decompensation (52% repeated attempters, 3% nonattempters, p < .001). In the interview sample, five (42%) of the participants also reported hearing voices that urged them to kill themselves preceding one or more of their attempts. [/page/5/Text/6] with persons who made repeated attemp"}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - Chart Review Sample", ["44"]], ["Study 2 - Interview Sample", ["12"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - Chart Review Sample", "section": "A Mixed-Method Study of Risk and Protective Factors", "page": 0, "quote": "We utilized retrospective chart reviews (n = 44) and in-person interviews (n = 12) in two urban public hospitals."}, {"sample": "Study 1 - Chart Review Sample", "section": "Retrospective Chart Reviews and Comparative Analysis", "page": null, "quote": "[page/1/Text/14] A total of 44 (7.2%) of the 608 Asian immigrant patients admitted to the two hospitals during the 2-year period (2009–2010) were identified for this sample."}, {"sample": "Study 1 - Chart Review Sample", "section": "History of Mental Illness and Clinical Profile", "page": 3, "quote": "Table 1. continued (n = 44) Frequency Chart Review Sample (n = 12) Frequency Interview Sample"}, {"sample": "Study 1 - Chart Review Sample", "section": "Impulsivity During Times of Distress", "page": null, "quote": "Of the 44 patients in the chart review, 34 (77%) were characterized as \"impulsive.\""}, {"sample": "Study 2 - Interview Sample", "section": "A Mixed-Method Study of Risk and Protective Factors", "page": 0, "quote": "We utilized retrospective chart reviews (n = 44) and in-person interviews (n = 12) in two urban public hospitals."}, {"sample": "Study 2 - Interview Sample", "section": "Semistructured Interviews", "page": 1, "quote": "[/page/1/Text/17] The second part of our study utilized semistructured interviews with 12 consenting participants."}]}}}, {"id": "Cleary2005", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["Ireland"]]], "klass": "exact", "gold": "ireland", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Methodology", "page": 3, "quote": "The sample was drawn from three hospitals in the general Dublin area."}]}, "Population": {"kind": "cells", "rows": [["Study 1 - main sample", ["Attempted Suicide (Men)"]]], "klass": "exact", "gold": "attempted suicide (men)", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Death rather than disclosure: struggling to be a real man", "page": 2, "quote": "The research presented here is part of a study of young men in the midst of a 'critical moment' (Giddens, 1991) in that they have attempted suicide."}, {"sample": "Study 1 - main sample", "section": "Methodology", "page": 3, "quote": "The following study, based on interviews with 52 men who engaged in suicidal behaviour, is part of an attempt to explore the background circumstances and motivations involved in the suicidal behaviour. A consecutive sample of 52 men aged between eighteen and thirty years was interviewed as soon as possible after a suicidal action."}, {"sample": "Study 1 - main sample", "section": "Discussion", "page": 18, "quote": "This study is based on in-depth interviews with fifty-two men who had attempted suicide."}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "exact", "gold": "primary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Methodology", "page": 3, "quote": "The following study, based on interviews with 52 men who engaged in suicidal behaviour, is part of an attempt to explore the background circumstances and motivations involved in the suicidal behaviour. A qualitative methodology, based on in-depth, unstructured interviews, was chosen as the most appropriate way to explore these issues. A consecutive sample of 52 men aged between eighteen and thirty"}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk", "Recovery"]]], "klass": "contains", "gold": "risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Death rather than disclosure: struggling to be a real man", "page": 0, "quote": "Non-disclosure of distress emerged as a key issue in examining pathways to suicidal action for a group of men. Disclosure of difficulties was viewed as un-masculine, as implying weakness and this was associated with feminine or homosexual type behaviour. Constant performative work, including hyper-performances, was required to project an image of strength and to conceal growing levels of distress."}, {"sample": "Study 1 - main sample", "section": "Methodology", "page": 3, "quote": "The following study, based on interviews with 52 men who engaged in suicidal behaviour, is part of an attempt to explore the background circumstances and motivations involved in the suicidal behaviour."}, {"sample": "Study 1 - main sample", "section": "The suicidal behaviour]", "page": null, "quote": "Although there was evidence of an impulsive quality to some of the suicidal actions the men generally had been thinking about suicide for some time, often for years. Their intent in almost all cases was to end their lives and the outcome for any of them could have been death. A variety of methods were used but over-dosing with prescribed drugs was the most usual means. When they realised they were"}, {"sample": "Study 1 - main sample", "section": "Performing masculinities: Being strong and concealing problems", "page": 4, "quote": "Non-disclosure emerged as a major theme in the study and was a widespread and prolonged pattern of behaviour for almost all the men. Over two thirds (67 per cent) said they would never disclose emotional matters to anyone. More specifically, almost none had spoken of the distress which led to the suicidal action. This admission was made very early in their narratives and formed an important part o"}, {"sample": "Study 1 - main sample", "section": "Disclosing is un-masculine behaviour", "page": 5, "quote": "Narratives often moved from subjective accounts towards more general expressions of what men usually do. Typically, subjects linked their performance to masculinity. Concealing emotions and distress, they maintained, is what men do, it is male behaviour. ; You have to be man enough to ask somebody for help, but the way people look at it, you're man enough to do it yourself, so do it yourself. Don'"}, {"sample": "Study 1 - main sample", "section": "The confiding network: social networks and connectedness", "page": 10, "quote": "It was apparent from these men's stories that lack of disclosure around emotional difficulties was maintained even if individuals regarded themselves as having close relations with family and friends. However, other subjects detailed histories of social and psychological isolation from their own families, a separation which they themselves frequently nurtured. They often desired emotional engageme"}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["52"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - main sample", "section": "Methodology", "page": 3, "quote": "The following study, based on interviews with 52 men who engaged in suicidal behaviour, is part of an attempt to explore the background circumstances and motivations involved in the suicidal behaviour. A qualitative methodology, based on in-depth, unstructured interviews, was chosen as the most appropriate way to explore these issues. A consecutive sample of 52 men aged between eighteen and thirty"}, {"sample": "Study 1 - main sample", "section": "Discussion", "page": 18, "quote": "This study is based on in-depth interviews with fifty-two men who had attempted suicide."}]}}}, {"id": "Cleary2012", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["Ireland"]]], "klass": "exact", "gold": "ireland", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "abstract", "page": 0, "quote": "in-depth interviews with 52 young Irish men"}, {"sample": "Study 1 - main sample", "section": "Sample and data collection", "page": 1, "quote": "A consecutive sample of 52 men was selected from three hospitals in the Dublin area within the same general geographical area."}, {"sample": "Study 1 - main sample", "section": "Findings", "page": 2, "quote": "The majority (94 per cent) were single and they were all born in the Republic of Ireland."}]}, "Population": {"kind": "cells", "rows": [["Study 1 - main sample", ["Attempted Suicide (Men)"]]], "klass": "exact", "gold": "attempted suicide (men)", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "abstract", "page": 0, "quote": "in-depth interviews with 52 young Irish men who made a suicide attempt"}, {"sample": "Study 1 - main sample", "section": "Introduction: the sociological study of suicide", "page": 0, "quote": "The present enquiry seeks to address this gap in the sociological literature by examining the emotions and meanings involved in suicidal behaviour, based on a sample of young men who made a suicide attempt."}, {"sample": "Study 1 - main sample", "section": "Masculinities, emotions, health behaviours and suicide", "page": null, "quote": "[/page/1/Text/7] The aim of this paper is to examine this qualitatively, drawing on the narratives of a sample of young men who made a suicide attempt."}, {"sample": "Study 1 - main sample", "section": "Methods", "page": null, "quote": "This study, funded by the Irish Research Council for the Humanities and the Social Sciences, was carried out over a period of two and a half years between 2000 and 2003 and is based on interviews with a group of men who attempted suicide."}, {"sample": "Study 1 - main sample", "section": "Sample and data collection", "page": 1, "quote": "Inclusion criteria included gender (male), age (18e30 years) and intent, in that all those included in the study had made a suicide attempt with definite intent to die."}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "wrong", "gold": "secondary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "abstract", "page": 0, "quote": "This inquiry, based on in-depth interviews with 52 young Irish men who made a suicide attempt, examines suicidal behaviour at the individual level."}, {"sample": "Study 1 - main sample", "section": "Methods", "page": null, "quote": "This study, funded by the Irish Research Council for the Humanities and the Social Sciences, was carried out over a period of two and a half years between 2000 and 2003 and is based on interviews with a group of men who attempted suicide. The objective of the investigation was to understand the practice and to explore the background circumstances and motivations involved in the suicidal behaviour."}, {"sample": "Study 1 - main sample", "section": "Sample and data collection", "page": 2, "quote": "The participants were interviewed, by the author, as soon as possible after a suicidal action (depending on the extent of their injuries) but usually within 24 h. An unstructured interview schedule was used in the session consisting of one introductory question 'Can you tell me how you came to be admitted here?'"}, {"sample": "Study 1 - main sample", "section": "Concealing distress", "page": 3, "quote": "The text includes direct quotes from participants (e.g., (Brian/24), (David/28), (Adam/35), (Jim/47)), indicating that the researchers collected original qualitative data for this study."}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk"]]], "klass": "wrong", "gold": "recovery, risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "abstract", "page": 0, "quote": "The findings demonstrate that these men experienced high levels of emotional pain but had problems identifying symptoms and disclosing distress and this, along with the coping mechanisms used, was linked to a form of masculinity prevalent in their social environment. Dominant or hegemonic masculinity norms discouraged disclosure of emotional vulnerability, and participants used alcohol and drugs t"}, {"sample": "Study 1 - main sample", "section": "Findings", "page": 2, "quote": "The biographical details of the sample confirm an association between lower socio-economic status and risk of suicidal behaviour (Gunnell et al., 1995). Redley (2003) has suggested that living in disadvantaged areas creates a particular risk dynamic for suicidal behaviour which is related to lack of control over one's life."}, {"sample": "Study 1 - main sample", "section": "A narrative of long-term pain and distress", "page": 3, "quote": "In this study, the participants spoke of emotional experiences extending over their lifetime and of the intense emotional pain they had been enduring for some time. The emotional distress related to the suicidal action was almost always present for at least one year and sometimes for much longer. The prevalent emotions at interview were sadness, anxiety and panic, but they had difficulty identifyi"}, {"sample": "Study 1 - main sample", "section": "Concealing distress", "page": 3, "quote": "The longstanding problems these men were experiencing were not apparent to their social network, because they actively concealed their distress. As in studies of male help-seeking practices, a perceived stigma was attached to the expression of emotional pain (O'Brien et al., 2005). Non-disclosure was a widespread and prolonged pattern of behaviour, and only one participant had spoken (to a family "}, {"sample": "Study 1 - main sample", "section": "Discussion", "page": null, "quote": "The findings in this study demonstrate high levels of emotional distress and the existence of long-term problems amongst a group of young men. The participants, interviewed soon after they made a suicide attempt, had difficulties both identifying symptoms and managing the distress and felt unable to tell their family and friends or seek professional help. They failed to disclose their distress bec"}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["52"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - main sample", "section": "abstract", "page": 0, "quote": "This inquiry, based on in-depth interviews with 52 young Irish men who made a suicide attempt, examines suicidal behaviour at the individual level."}, {"sample": "Study 1 - main sample", "section": "Sample and data collection", "page": 1, "quote": "A consecutive sample of 52 men was selected from three hospitals in the Dublin area within the same general geographical area."}]}}}, {"id": "Costa2017", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["Brazil"]]], "klass": "exact", "gold": "brazil", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "RESUMO", "page": 0, "quote": "Analisar as narrativas de familiares sobre o suicídio de idosos em Manaus, Amazonas, Brasil."}, {"sample": "Study 1 - main sample", "section": "Correspondència:", "page": 0, "quote": "Maximiliano Loiola Ponte de Souza Rua Teresina, 476 Adrianópolis 69057-070 Manaus, AM, Brasil E-mail: maximiliano.souza@fiocruz.br"}, {"sample": "Study 1 - main sample", "section": "INTRODUÇÃO", "page": 1, "quote": "No município mais populoso da região norte do Brasil, Manaus, capital do estado do Amazonas"}, {"sample": "Study 1 - main sample", "section": "Seleção dos Entrevistados", "page": 1, "quote": "Fundação de Vigilância em Saúde do Estado do Amazonas... em Manaus."}, {"sample": "Study 1 - main sample", "section": "Instrumento", "page": 2, "quote": "Utilizou-se o \"Roteiro de entrevista semiestruturada para autópsias psicológicas e psicossociais\", desenvolvido e validado para investigação de suicídio de idosos no Brasil3 , para acessar os fragmentos narrativos dos familiares sobre o suicídio, conforme proposto por Owens e Lambert18."}, {"sample": "Study 1 - main sample", "section": "Aspectos Éticos", "page": null, "quote": "Pesquisa aprovada por Comitê de Ética em Pesquisa (CAAE 30929114.8.0000.5020)."}]}, "Population": {"kind": "cells", "rows": [["Study 1 - main sample", ["Bereaved (Mixed)"]]], "klass": "exact", "gold": "bereaved (mixed)", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "RESUMO", "page": 0, "quote": "Analisar as narrativas de familiares sobre o suicídio de idosos em Manaus, Amazonas, Brasil."}, {"sample": "Study 1 - main sample", "section": "INTRODUÇÃO", "page": 1, "quote": "a proposta deste artigo é analisar as narrativas de familiares sobre o suicídio de idosos em Manaus"}, {"sample": "Study 1 - main sample", "section": "Seleção dos Entrevistados", "page": 1, "quote": "37 declarações de óbito de idosos (60 anos ou mais) que morreram por suicídio (X60–X84)... incluindo idosos com mais de 70 anos, mulheres, e pessoas que cometeram suicídio por diferentes métodos."}, {"sample": "Study 1 - main sample", "section": "Instrumento", "page": 2, "quote": "Utilizou-se o \"Roteiro de entrevista semiestruturada para autópsias psicológicas e psicossociais\", desenvolvido e validado para investigação de suicídio de idosos no Brasil3 , para acessar os fragmentos narrativos dos familiares sobre o suicídio, conforme proposto por Owens e Lambert18."}, {"sample": "Study 1 - main sample", "section": "Quadro. Sínteses narrativas.", "page": 3, "quote": "1ª narrativa: Quando jovem deixou sua cidade natal. Trabalhou duro como feirante. Tinha certa mágoa dos filhos, pois nenhum quis dar seguimento em seu negócio. Um ano antes de sua morte, organizou uma viagem para visitar sua mãe em outro estado. Tinha o desejo de mostrar a família que construiu para a mãe. Pouco antes da viagem, sua mãe morreu. Meses depois, após realizar exames, foi informado pel"}, {"sample": "Study 1 - main sample", "section": "Perdas", "page": 4, "quote": "Na 3ª narrativa, descreve-se o suicídio de uma idosa que teria sido despedida na velhice. [...] Tempo depois, o idoso atentou contra sua vida."}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "exact", "gold": "primary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Seleção dos Entrevistados", "page": 1, "quote": "Familiares de oito idosos aceitaram participar da pesquisa, assinando o termo de consentimento livre e esclarecido (Tabelas 1 e 2). Em data pré-agendada, visitou-se os familiares, momento em que houve detalhamento dos objetivos da pesquisa."}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk"]]], "klass": "exact", "gold": "risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "RESUMO", "page": 0, "quote": "Os familiares conceberiam o suicídio dos idosos como relacionado a perdas, que se dariam em um cenário sociofamiliar tensionado, levando ao surgimento de quadros psicopatológicos que, se não adequadamente acompanhados, resultariam na morte. Haveria também algo de inexorável nessa sequência de eventos. O idoso, pelo próprio tempo de sua vida, tenderia a acumular em sua trajetória perdas de diferent"}, {"sample": "Study 1 - main sample", "section": "Quadro. Sínteses narrativas.", "page": 3, "quote": "1ª narrativa: Quando jovem deixou sua cidade natal. Trabalhou duro como feirante. Tinha certa mágoa dos filhos, pois nenhum quis dar seguimento em seu negócio. Um ano antes de sua morte, organizou uma viagem para visitar sua mãe em outro estado. Tinha o desejo de mostrar a família que construiu para a mãe. Pouco antes da viagem, sua mãe morreu. Meses depois, após realizar exames, foi informado pel"}, {"sample": "Study 1 - main sample", "section": "Perdas", "page": 3, "quote": "Em diferentes narrativas, o ponto de partida era a descrição de uma ou mais perdas sofridas pelo idoso (Tabela 3). Perdas relacionadas à saúde estiveram presentes em seis a oito narrativas. [...] Perdas relacionadas ao trabalho estiveram presentes em metade das narrativas. [...] relatam-se perdas familiares que ocorreram na velhice, de modo próximo ou simultâneo, a ocorrência de perdas relacionada"}, {"sample": "Study 1 - main sample", "section": "Conflitos Familiares", "page": 5, "quote": "[page/5/Text/5] Recorrentes nas narrativas que descreviam conflitos envolvendo filhos ou enteados eram as tentativas do idoso em disciplinar ou influenciar o comportamento dos mesmos. Na 1ª narrativa, aborda-se a frustração do idoso em virtude de nenhum de seus filhos querer trabalhar no negócio humilde e árduo, que garantiu durante anos o sustento da família. Já na 2ª narrativa, o idoso não aceit"}, {"sample": "Study 1 - main sample", "section": "Indícios de Psicopatologia e Acesso aos Serviços de Saúde", "page": 6, "quote": "Indícios de sintomas depressivos (tristeza, desânimo, isolamento, ideias de morte) puderam ser observados em cinco narrativas (2ª, 3ª, 4ª, 5ª, 6ª). Em três (2ª, 3ª e 4ª), a família não teria identificado a necessidade de levar o paciente para tratamento, e em outras duas (5ª e 6ª), os idosos teriam iniciado tratamento, mas abandonando-os, por acharem que não era preciso. Por sua vez, sintomas psic"}, {"sample": "Study 1 - main sample", "section": "CONSIDERAÇÕES FINAIS", "page": 7, "quote": "Por meio da análise das narrativas, podemos propor que os familiares concebem o suicídio dos idosos como relacionado a perdas, que se dariam em um cenário sociofamiliar tensionado, levando ao surgimento de quadros psicopatológicos que, se não adequadamente acompanhados, resultariam na morte. [...] Além disso, estratégias para auxiliar os idosos a lidar com as perdas e conflitos familiares, associa"}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["8"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - main sample", "section": "RESUMO", "page": 0, "quote": "Estudo qualitativo de narrativas de oito idosos que morreram por suicídio no período 2001–2012."}, {"sample": "Study 1 - main sample", "section": "Seleção dos Entrevistados", "page": 1, "quote": "Familiares de oito idosos aceitaram participar da pesquisa"}, {"sample": "Study 1 - main sample", "section": "Quadro. Sínteses narrativas.", "page": 3, "quote": "1ª narrativa: Quando jovem deixou sua cidade natal. Trabalhou duro como feirante. Tinha certa mágoa dos filhos, pois nenhum quis dar seguimento em seu negócio. Um ano antes de sua morte, organizou uma viagem para visitar sua mãe em outro estado. Tinha o desejo de mostrar a família que construiu para a mãe. Pouco antes da viagem, sua mãe morreu. Meses depois, após realizar exames, foi informado pel"}, {"sample": "Study 1 - main sample", "section": "Perdas", "page": 4, "quote": "Tabela 3. Temas recorrentes nas narrativas."}]}}}, {"id": "Creighton2017", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["Canada"]]], "klass": "exact", "gold": "canada", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Abstract", "page": 0, "quote": "[/page/0/Text/7] Suicide rates in Canada are highest among rural men. Drawing on photovoice interviews with 13 women and two men living in a small rural Canadian town who lost a man to suicide, we inductively derived three themes to describe how contextual factors influence rural men's experiences of depression and responses to suicidal thoughts: (a) hiding depression and its cause, (b) manly self"}, {"sample": "Study 1 - main sample", "secti ": 8, "quote": "Three main themes predisposing the individuals to maladaptive perfectionism related to suicide, emerged from the analysis of the life history of the six men in the present material: (a) Exposure to high expectations combined with little recognition and warmth; (b) Reduced ability to cope with failures and weaknesses; and (c) Fear of emotional rejection."}, {"sample": "Study 1 - main sample", "section": "Exposure to High Expectations Combined With Little Recognition and Warmth", "page": 8, "quote": "[/page/8/Text/7] The deceased were understood as perfectionists based upon their strong engagement in work, study, and career and were perceived to be very successful and well-functioning men. [/page/8/Text/8] However, in their narratives, informants clearly perceived that the parents' unrealistic expectations and their concern about fac¸ade and status went beyond what their sons' could live up to"}, {"sample": "Study 1 - main sample", "section": "Reduced Ability to Cope With Failures and Weaknesses", "page": null, "quote": "[/page/10/Text/7] Feelings of failure and weakness in youth and adulthood seemed to predispose these men to perfectionist behavior. [/page/11/Text/4] Consequently, this discrepancy may have further reduced the deceased's ability to cope with failures and weaknesses in life and may have propelled the deceased to work even harder, and in short, pushed them further toward maladaptive perfectionism."}, {"sample": "Study 1 - main sample", "section": "Fear of Emotional Rejection", "page": 11, "quote": "Furthermore, all love relationships in four cases related the deceased's tendency towards perfectionism to negative emotional experiences, associated with a one way communication between the deceased and their parents (in particular their fathers) where these negative experiences were not addressed."}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["6"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{ uence on the suicidal process by facilitating the suicidal acts; it was used as a means to suicide or had an influence on the overall life style of the individuals. Indirectly, alcohol had an influence in the suicidal process of the decedents as victims of the alcohol use by others."}, {"sample": "Study 1 - main sample", "section": "General Discussion", "page": 6, "quote": "In this study we explored the role of alcohol in suicide in postconflict Northern Uganda. The findings indicated that alcohol acted as a facilitator of suicidal acts, was used as a means to implement the act, or had an influence on the overall lifestyle of some of the decedents who abused alcohol. It further influenced the suicidal process of significant others as victims of those who misuse alcoh"}, {"sample": "Study 1 - main sample", "section": "Implications for Suicide Prevention", "page": 7, "quote": "Our results show that alcohol played a complex role in the suicide cases studied. In two of our groups, alcohol could be seen as a method of suicide, while in the other groups it had a more indirect influence by causing intra- and interpersonal suffering."}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["20"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - main sample", "section": "A Qualitative Psychological Autopsy Study", "page": 0, "quote": "Qualitative psychological autopsy interviews were conducted with bereaved relatives and friends of 20 suicides mainly from Internally Displaced Peoples' camps in Northern Uganda."}, {"sample": "Study 1 - main sample", "section": "Study Subjects", "page": null, "quote": "Twenty decedents (17 men and 3 women) were identified, all aged between 18–39 years or 60–85 years."}]}}}, {"id": "Kjolseth2009", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["Norway"]]], "klass": "exact", "gold": "norway", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Stu _long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "ABSTRACT", "page": 0, "quote": "[page/0/Text/7] In-depth interviews were carried out with seven probation clients who made near-lethal suicide attempts whilst serving a probation sentence."}, {"sample": "Study 1 - main sample", "section": "Methods", "page": 1, "quote": "JM conducted all interviews which lasted 50–90 min. The semi-structured interview schedule was developed from previous interview questions used for near-lethal attempters and in collaboration with the London Probation Suicide and Self-harm Prevention Forum. Questions were open ended, encouraging free recall by the participants and focused on understanding how clients experienced their suicidal sta"}, {"sample": "Study 1 - main sample", "section": "What this study adds", "page": null, "quote": "This is the first qualitative study to be carried out with probation clients who have carried out near-lethal selfinjury."}, {"sample": "Study 1 - main sample", "section": "Limitations of this study", "page": 5, "quote": "[/page/5/Text/7] Given the participants' difficulties with trust, particularly authority figures, they may not have disclosed all feelings about their near-lethal behaviour to the interviewer. However, the depth of the data suggests that participants were open about their suicidal experiences, also reflected in their positive comments about taking part in the research."}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk", "Recovery"]]], "klass": "exact", "gold": "recovery, risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "ABSTRACT", "page": 0, "quote": "[page/0/Text/8] Participants recounted negative experiences which they perceived to be linked to their suicidal feelings and behaviours, such as experiencing bereavements, perceived loss of control over their mental state or situation, and difficulties relating to stages of their probation sentence. Participants expressed severe difficulties with trusting authorities, making disclosure of suicidal"}, {"sample": "Study 1 - main sample", "section": "Difficulties with trust", "page": null, "quote": "['Participants\\' reactions to trust and trust building were complex, with many struggling to fully embrace trusting relationships through fear of rejection and being hurt. Furthermore, participants\\' exposure to negative experiences led to a general distrust in authority and the CJS.', 'Thus lack of trust led to difficulties with building relationships with their probation officers and more signif"}, {"sample": "Study 1 - main sample", "section": "Struggles to find a purpose", "page": null, "quote": "Participants frequently referred to their struggles in trying to find a meaningful and purposeful life. Periods when they lacked achievement and felt hopeless about the future were accompanied by suicidal feelings and depression. A continued search for a purpose to live were reflected in all participants' accounts. Some participants spoke of how having a job could provide both purpose and stabilit"}, {"sample": "Study 1 - main sample", "section": "Main findings of this study", "page": 4, "quote": "Findings indicate that clients' suicidal states were strongly related to the experience of loss, including bereavement. At the time of their attempts, clients experienced a loss of control over their lives and in many cases their mental state. When clients felt suicidal they often struggled to open up to others about their feelings, despite acknowledging the value of talking to others about their "}, {"sample": "Study 1 - main sample", "section": "What this study adds", "page": null, "quote": "An important finding of this research is that participants struggled to express and manage their experiences of loss both prior to their probation sentence and whilst serving their sentence. This was reported as directly contributing towards participants' suicidal on": "Ethics and moral considerations", "page": 2, "quote": "The research project was approved by the Ethics Committee of the Psychology Department at the University of Leeds, UK and adheres to the British Psychological Society Code of Practice."}]}, "Population": {"kind": "cells", "rows": [["Study 1 - main sample", ["Attempted Suicide (Men)", "Suicidal Ideation"]]], "klass": "exact", "gold": "attempted suicide (men), suicidal ideation", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "INTRODUCTION", "page": 0, "quote": "This paper focuses on the early biographical experiences of four adult gay men who have experienced suicide ideation and engaged in suicidal behaviour"}, {"sample": "Study 1 - main sample", "section": "INTRODUCTION", "page": 0, "quote": "This paper focuses on the early biographical experiences of four adult gay men who have experienced suicide ideation and engaged in suicidal behaviour"}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "exact", "gold": "primary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Coming out to talk about suicide: Gay men and suicidality", "page": 0, "quote": "This qualitative study, utilizing single case studies, was used to gain an in-depth understanding of the life experiences contributing to the suicidality of four gay men. The methodology was psychoanalytically informed, using free association narrative interviewing."}, {"sample": "Study 1 - main sample", "section": "REVIEWING THE LITERATURE", "page": 1, "quote": "This study adopted a qualitative psychosocial approach, using free association narrative interviewing (FANI) (Hollway & Jefferson 2000) to facilitate the exploration of the early biographical experiences of adult gay men who have engaged in suicidality."}, {"sample": "Study 1 - main sample", "section": "Methodology", "page": 1, "quote": "Developing a bricolage approach in this study offered the opportunity to explore the participants' multifaceted life experiences, the impact of the researcher on the research encounter, and the interpretation of the data from a number of philosophical and theoretical positions."}, {"sample": "Study 1 - main sample", "section": "Participants", "page": 1, "quote": "While everything was done to promote a safe and sensitive environment for a face-to-face research encounter, alternative, less intrusive methods of data collection could have been considered, for example, digital storytelling. Such approaches could have yielded more participants. However, in narra- [/page/2/Text/3] tive research there is no fixed sample size, the focus being on the ideographic rat"}, {"sample": "Study 1 - main sample", "section": "Ethics and moral considerations", "page": 2, "quote": "Participants were offered written and verbal information relating to the study. Following a decision to participate, written consent was gained from each individual. ... after each interview had finished, 30 min was also set aside to allow participants the opportunity to discuss any unresolved emotional difficulties they encountered during the interview."}, {"sample": "Study 1 - main sample", "section": "Data collection and analysis", "page": 2, "quote": "FANI was used as the main method of data collection. Narrative interviewing per se does not take account of defended participants, but one way of exploring early unconscious experiences in the therapeutic encounter would be to use free association."}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk"]]], "klass": "wrong", "gold": "recovery, risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Coming out to talk about suicide: Gay men and suicidality", "page": 0, "quote": "The significance of the life experiences these themes illustrate reveal why some gay men might not only experience long-term mental health problems, but also engage in suicidality."}, {"sample": "Study 1 - main sample", "section": "REVIEWING THE LITERATURE", "page": 1, "quote": "This study adopted a qualitative psychosocial approach, using free association narrative interviewing (FANI) (Hollway & Jefferson 2000) to facilitate the exploration of the early biographical experiences of adult gay men who have engaged in suicidality."}, {"sample": "Study 1 - main sample", "section": "Findings", "page": null, "quote": "The shared experiences drawn from each individual's account are described as: 'not knowing and knowing', 'the centrality of the father', 'the loneliness of outsiderness', 'leading a double life', and 'crime and punishment'."}, {"sample": "Study 1 - main sample", "section": "Not knowing and knowing", "page": 3, "quote": "[page/3/Text/6] As gay children, and not yet able to identify themselves as such, the boys had an awareness of being different, of knowing, but this appeared to be a 'felt' knowing and not a knowing they could articulate.[page/3/Text/9] The participants' knowing, having the ability to verbalize their difference in terms of their sexuality, gave rise to an increased sense of vulnerability.[page/3/T"}, {"sample": "Study 1 - main sample", "section": "The centrality of the father", "page": null, "quote": "The participants in the study appeared to experience an absence of the all-important father–son relationship, therefore lacking a male role model whom they could be guided by in terms of their emotional self.I think this anxiety and apprehension was also to do with this lack of bonding with my dad; I felt vulnerable, no strong male role model, so I think that just kind of exacerbated the whole gay"}, {"sample": "Study 1 - main sample", "section": "The loneliness of outsiderness", "page": 3, "quote": "The unacceptability of being gay often equates to social exclusion and condemned the men in this study to experience 'outsiderness' (Smith 1992)."}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - main sample", ["4"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - main sample", "section": "Coming out to talk about suicide: Gay men and suicidality", "page": 0, "quote": "This qualitative study, utilizing single case studies, was used to gain an in-depth understanding of the life experiences contributing to the suicidality of four gay men."}, {"sample": "Study 1 - main sample", "section": "INTRODUCTION", "page": 0, "quote": "This paper focuses on the early biographical experiences of four adult gay men who have experienced suicide ideation and engaged in suicidal behaviour"}, {"sample": "Study 1 - main sample", "section": "Participants", "page": 1, "quote": "Purposive sampling was used to recruit four gay men between the ages of 35 and 41 through placing advertisements at the premises of voluntary organizations that support gay men."}, {"sample": "Study 1 - main sample", "section": "DISCUSSION", "page": 5, "quote": "[/page/5/Text/8] For these four men, this led to a sense of being a failure in terms of meeting the cultural expectations placed on them by their sex and becoming sex-stressed (Drescher 1998)."}, {"sample": "Study 1 - main sample", "section": "ACKNOWLEDGEMENTS", "page": 7, "quote": "We would like to thank the four men who willingly and generously shared their intimate life experiences in the name of research."}]}}}, {"id": "Meissner2017", "cells": {"Country": {"kind": "cells", "rows": [["Study 1 - main sample", ["South Africa"]]], "klass": "exact", "gold": "south africa", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Birte Linda Meissner &amp; Jason Bantjes", "page": 0, "quote": "four young South African men's experience of attempting suicide"}, {"sample": "Study 1 - main sample", "section": "Introduction", "page": 1, "quote": "[/page/1/Text/13] It was within this context that we examined how four South African young men t of control. This theme has a double meaning of not being in control as well as wishing to regain control. Statements expressing a want of control were present throughout the different aspects of being suicidal addressed in the interviews; concerning the perceived long-term backgroun"}, {"sample": "Study 1 - main sample", "section": "Discussion", "page": null, "quote": "That being in want of control is a key issue in the experience of being suicidal is supported by other interview studies with people who have made a suicide attempt (Crocker et al., 2006; Everall, 2000; Michel &amp; Valach, 2001; Sinclair &amp; Green, 2005.) Further, it seems likely that being in want of control is a general feature of the suicidal process, since this theme recurs in different stu"}, {"sample": "Study 1 - main sample", "section": "Conclusions", "page": 10, "quote": "We conclude that being in want of control is a relevant and general feature of being suicidal and that people who have attempted suicide need more adequate help to restore the sense of control. In order to restore a sense of control it seems important to help patients breaking the vicious circles before they reach a point of no return and enter an acute suicidal state of mind. We can also conclude"}, {"sample": "Study 1 - main sample", "section": "Abstract", "page": null, "quote": "The participants' experience of being suicidal and of having attempted suicide could be described as ''Being on the road towards suicidal action'', which culminated in an experience of either chaos or turned off emotions, ''Making sense of the suicide attempt'', and ''Opening the door to possible life lines''. An overall theme, ''Being in want of control'', captured their all-embracing lack of sen"}, {"sample": "Study 1 - main sample", "section": "Findings", "page": 4, "quote": "The experience of being suicidal and making a suicide attempt could be understood in the overall theme Being in want of control. This theme has a double meaning of not echnology—Sydney, Faculty of Health, Sydney, Australia"}]}, "Population": {"kind": "cells", "rows": [["Study 1 - main sample", ["Bereaved (Male Suicide)"]]], "klass": "exact", "gold": "bereaved (male suicide)", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Debra Jackson, RN, PhD", "page": 1, "quote": "Relatively little is known about the experiences of those bereaved by suicide, particularly in the weeks leading to the death of a loved one. This study used a qualitative methodology to explore the perspectives of close survivors of a completed suicide. Ten people who were bereaved by suicide participated in face-toface interviews"}, {"sample": "Study 1 - main sample", "section": "Inclusion Criteria", "page": 2, "quote": "Further, all participants had to have experienced a completed suicide of a family member at least 12 months prior to being interviewed and had to have had dealings with official agencies (e.g., police, coroner, insurance company, funeral directors, banks) related to the suicide of a family member."}, {"sample": "Study 1 - main sample", "section": "FINDINGS", "page": 3, "quote": "[/page/3/Text/10] Ten participants, 25–65 years of age, were recruited into this study. All had been in very close familial relationships with the deceased persons and were bereaved for between 2 and 20 years (see Table 1). All decedents were male, 20–60 years of age, and hanging was the most common form of suicide (n = 6)."}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "exact", "gold": "primary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "Debra Jackson, RN, PhD", "page": 1, "quote": "Ten people who were bereaved by suicide participated in face-toface interviews that were digitally recorded, transcribed verbatim, and thematically analysed."}, {"sample": "Study 1 - main sample", "section": "Design", "page": null, "q e": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "'The self-destruction force is so strong': male survivors' experience of suicidal thoughts following sexual violence", "page": 0, "quote": "The purpose of this study was to explore the experience of male survivors themselves of suicidal thoughts following sexual violence within the framework of men and masculinity."}, {"sample": "Study 1 - main sample", "section": "Introduction", "page": 1, "quote": "The purpose of this study was to increase knowledge and deepen understanding in this area by exploring the experience of male survivors themselves of suicidal thoughts following sexual violence within a theoretical framework of men and masculinity."}, {"sample": "Study 1 - main sample", "section": "Method", "page": 1, "quote": "In this study, interviews were conducted with seven male sexual violence survivors who had experienced suicidal thoughts following the violence"}, {"sample": "Study 1 - main sample", "section": "Ethical considerations", "page": 3, "quote": "The research question of the study, 'what is the experience of male sexual violence survivors of suicidal ideation following sexual violence?', guided the selection of the sample. Purposive sampling (five participants) and snowball sampling (two participants) were used, and thus, seven participants selected who had experienced suicidal thoughts following sexual violence."}]}, "Type": {"kind": "cells", "rows": [["Study 1 - main sample", ["Primary"]]], "klass": "exact", "gold": "primary", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "'The self-destruction force is so strong': male survivors' experience of suicidal thoughts following sexual violence", "page": 0, "quote": "The research methodology was The Vancouver School of Doing Phenomenology, and a total of 17 interviews were conducted with seven male survivors."}, {"sample": "Study 1 - main sample", "section": "Method", "page": 1, "quote": "In this study, interviews were conducted with seven male sexual violence survivors who had experienced suicidal thoughts following the violence, two interviews with four of them and three interviews with three, a total of 17 interviews. The first author, and primary researcher, conducted all the interviews."}, {"sample": "Study 1 - main sample", "section": "Author contributions", "page": 8, "quote": "EDVT collected the data, did the primary data analysis and drafted the manuscript."}]}, "Area": {"kind": "cells", "rows": [["Study 1 - main sample", ["Risk", "Recovery"]]], "klass": "exact", "gold": "recovery, risk", "gold_source": "d_long.xlsx (Jansen 2025)", "evidence": [{"sample": "Study 1 - main sample", "section": "'The self-destruction force is so strong': male survivors' experience of suicidal thoughts following sexual violence", "page": 0, "quote": "The main findings of the study are that the source of the suicidal thoughts after sexual violence is based on an experienced strong self-destruction force that involves almost unbearable and unexpressed suffering. The strong self-destruction force appeared among other things in risk behaviour and negligence towards own life and health. Participants all agreed that the thought of suicide was a cert"}, {"sample": "Study 1 - main sample", "section": "Results", "page": null, "quote": "['suicidal thoughts following sexual violence are based on an experienced \\'strong self-destruction force\\' that involves almost unbearable suffering which is still unexpressed but primarily focused on avoiding frequent thoughts about the violence and finding peace.', 'The strong self-destruction force resulted in participants\\' risk behaviour, such as driving too fast without seatbelts, high drin"}, {"sample": "Study 1 - main sample", "section": "To quit the plan to commit suicide: 'I did not want to leave my boy'", "page": null, "quote": "When suicidal thoughts had developed into planning the suicide, th
