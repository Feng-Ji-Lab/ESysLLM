<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Dashboard — reference vs extracted</title>
<style>
:root {
  --bg:#f8f9fa; --text:#212529; --border:#dee2e6;
  --header-bg:#343a40; --header-text:#f8f9fa;
  --cell-border:rgba(150,150,150,0.4);
  --full:rgba(72,199,116,0.28); --partial:rgba(255,221,87,0.34);
  --none:rgba(255,99,99,0.24); --neutral:rgba(200,200,200,0.12);
  --full-s:#48c774; --partial-s:#ffdd57; --none-s:#ff6363; --neutral-s:#ccc;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:13px; background:var(--bg); color:var(--text); line-height:1.4; }
.topbar { background:#fff; border-bottom:2px solid var(--border); padding:12px 18px; }
.topbar h1 { font-size:1.2rem; font-weight:700; }
.topbar .sub { color:#6b7280; font-size:12px; margin-top:2px; }

/* assets */
.assets { margin:12px 0; border:1px solid var(--border); border-radius:8px; background:#fcfcfd; }
.assets > summary { cursor:pointer; padding:10px 14px; font-weight:600; color:#1d4ed8; list-style:none; }
.assets > summary::before { content:'▸ '; }
.assets[open] > summary::before { content:'▾ '; }
.assets-body { padding:6px 14px 14px; }
.asset-group { margin-top:10px; }
.asset-group > .gh { font-weight:700; font-size:12px; color:#374151; text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
.asset details { border:1px solid var(--border); border-radius:6px; margin:5px 0; background:#fff; }
.asset details > summary { cursor:pointer; padding:6px 10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#0f172a; }
.asset pre { margin:0; padding:10px 12px; border-top:1px solid var(--border); background:#0f172a; color:#e2e8f0; font-size:11.5px; line-height:1.5; overflow:auto; max-height:420px; }

/* standard toggle + metric panels */
.stdtoggle { margin:12px 0 6px; display:flex; gap:18px; align-items:center; font-size:13px; }
.stdtoggle label { cursor:pointer; }
.stdtoggle .hint { color:#6b7280; font-size:12px; }
.panels { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .panels { grid-template-columns:1fr; } }
.panel { border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff; }
.panel.active { border-color:#1d4ed8; box-shadow:0 0 0 2px rgba(29,78,216,.12); }
.panel h3 { font-size:13px; margin-bottom:8px; }
.panel h3 .tag { font-weight:500; color:#6b7280; }
.bigrow { display:flex; gap:16px; margin:6px 0 8px; }
.big b { font-size:1.45rem; font-weight:700; display:block; line-height:1; }
.big span { font-size:11px; color:#6b7280; }
.counts { font-size:11.5px; color:#6b7280; margin-bottom:8px; }
table.fm { width:100%; border-collapse:collapse; font-size:11.5px; }
table.fm th, table.fm td { padding:3px 6px; border-bottom:1px solid var(--border); text-align:right; }
table.fm th:first-child, table.fm td:first-child { text-align:left; }
table.fm th { color:#6b7280; font-weight:600; }

/* controls */
.controls { position:sticky; top:0; z-index:1000; background:#fff; border-bottom:2px solid var(--border); padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.controls label { font-weight:600; font-size:12px; }
.controls input[type=text], .controls select { padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; }
.controls input[type=text] { width:200px; }
.controls .sep { border-left:1px solid var(--border); height:26px; }
.controls .badge { background:#e9ecef; padding:2px 8px; border-radius:10px; font-size:11px; color:#495057; }
.legend { display:flex; gap:12px; align-items:center; font-size:11px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-swatch { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,0.15); }

/* table */
.table-wrap { overflow:auto; max-height:calc(100vh - 60px); }
table.grid { border-collapse:separate; border-spacing:0; min-width:100%; }
.grid thead th { position:sticky; top:0; z-index:100; background:var(--header-bg); color:var(--header-text); padding:8px 10px; font-size:11px; font-weight:600; text-align:left; white-space:nowrap; border-right:1px solid rgba(255,255,255,0.1); min-width:150px; }
.grid thead th.evald::after { content:" \2605"; color:#ffd43b; }
.grid thead th:first-child { left:0; z-index:200; min-width:170px; max-width:220px; }
.grid tbody td { vertical-align:top; padding:4px 6px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); min-width:150px; }
.grid tbody td:first-child { position:sticky; left:0; z-index:50; background:#fff; font-weight:600; font-size:12px; min-width:170px; max-width:220px; word-break:break-word; border-right:2px solid var(--border); }
.cell { border:1px solid var(--cell-border); border-radius:4px; padding:4px 6px; cursor:pointer; min-height:24px; transition:box-shadow .15s; }
.cell:hover { box-shadow:0 0 0 2px rgba(66,133,244,0.3); }
.cell.pinned { box-shadow:0 0 0 2px rgba(66,133,244,0.6); }
.cell.full { background:var(--full); } .cell.partial { background:var(--partial); }
.cell.none { background:var(--none); } .cell.neutral { background:var(--neutral); }
.sub { margin-bottom:3px; } .sub:last-child { margin-bottom:0; }
.sub-h { font-weight:600; font-size:11px; color:#495057; }
.empty-val { color:#aaa; font-style:italic; }
.tooltip { position:fixed; z-index:5000; background:#fff; border:1px solid #aaa; border-radius:6px; padding:10px 12px; max-width:520px; min-width:220px; box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:12px; line-height:1.5; display:none; }
.tooltip.pinned { pointer-events:auto; }
.tt-row { margin-bottom:5px; } .tt-label { font-weight:700; color:#333; }
.tt-klass { display:inline-block; padding:1px 8px; border-radius:999px; font-weight:700; font-size:11px; background:#eef; }
.tt-std { font-size:11px; color:#374151; }
.tt-gold { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-src { color:#6b7280; font-size:11px; }
.tt-ev { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-ev .q { color:#333; } .tt-ev .meta { color:#6b7280; font-size:11px; }
</style>
</head>
<body>
<div class="topbar">
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>

  <details class="assets" id="assetsPanel">
    <summary>Customizations — prompts · schema · field definitions · rules (click to expand)</summary>
    <div class="assets-body" id="assetsBody"></div>
  </details>

  <div class="stdtoggle">
    <strong>Standard:</strong>
    <label><input type="radio" name="std" value="strict" checked> Strict (exact match)</label>
    <label><input type="radio" name="std" value="widened"> Widened (reference within extraction)</label>
    <span class="hint">— toggles cell coloring; both panels below always shown</span>
  </div>
  <div class="panels">
    <div class="panel" id="panelStrict"></div>
    <div class="panel" id="panelWidened"></div>
  </div>
</div>

<div class="controls">
  <label>View:</label>
  <select id="viewMode"><option value="all">All papers</option><option value="single">Single paper</option></select>
  <select id="paperSelect" style="display:none"></select>
  <div class="sep"></div>
  <label>Search:</label><input type="text" id="searchBox" placeholder="Filter papers...">
  <div class="sep"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--full)"></div>exact (correct)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--partial)"></div>contains (→correct if widened)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--none)"></div>wrong / missing</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--neutral)"></div>no gold</div>
  </div>
  <div class="sep"></div>
  <span class="badge" id="paperCount"></span>
</div>

<div class="table-wrap"><table class="grid"><thead><tr id="headerRow"></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="tooltip" id="tooltip"></div>

": "Students' Life Satisfaction Scale", "page": 2, "quote": "[/page/2/Text/9] the means, standard deviations at Time 1 were M = 29.30, SD = 6.36 and at Time 2 were M = 29.10, SD = 6.82."}, {"sample": "Study 1 - whole sample | life satisfaction | wave 2", "section": "Students' Life Satisfaction Scale", "page": 2, "quote": "[/page/2/Text/9] the means, standard deviations at Time 1 were M = 29.30, SD = 6.36 and at Time 2 were M = 29.10, SD = 6.82."}]}, "Sample": {"kind": "cells", "rows": [["Study 1 - whole sample | life satisfaction | wave 1", ["367"]], ["Study 1 - whole sample | life satisfaction | wave 2", ["367"]]], "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": "Study 1 - whole sample | life satisfaction | wave 1", "section": "Multiple Regression Analysis: Hope, Mental Health, and Student Engagement", "page": 4, "quote": "Table 1 Intercorrelations of and between target variables for students at Time 1 and Time 2 (N = 367)"}, {"sample": "Study 1 - whole sample | life satisfaction | wave 2", "section": "Multiple Regression Analysis: Hope, Mental Health, and Student Engagement", "page": 4, "quote": "Table 1 Intercorrelations of and between target variables for students at Time 1 and Time 2 (N = 367)"}]}, "infoYearT1": {"kind": "scalar", "text": "estimated", "klass": "neutral", "gold": null, "gold_source": null, "evidence": [{"sample": null, "section": "Psychological Strengths in Childhood as Predictors of Longitudinal Outcomes", "page": 0, "quote": "The abstract states 'administered to 367 students on two occasions, separated by 5 years' but does not provide the calendar year for the first assessment."}]}}}], "summary": {"per_field": {"yearT1": {"counts": {"exact": 81, "contains": 0, "wrong": 17, "missing": 1}, "strict": {"ced": 81, "ied": 17, "md": 1, "precision": 0.826530612244898, "recall": 0.9878048780487805, "f1": 0.9, "accuracy": 0.8181818181818182}, "widened": {"ced": 81, "ied": 17, "md": 1, "precision": 0.826530612244898, "recall": 0.9878048780487805, "f1": 0.9, "accuracy": 0.8181818181818182}}, "country": {"counts": {"exact": 90, "contains": 0, "wrong": 9, "missing": 0}, "strict": {"ced": 90, "ied": 9, "md": 0, "precision": 0.9090909090909091, "recall": 1.0, "f1": 0.9523809523809523, "accuracy": 0.9090909090909091}, "widened": {"ced": 90, "ied": 9, "md": 0, "precision": 0.9090909090909091, "recall": 1.0, "f1": 0.9523809523809523, "accuracy": 0.9090909090909091}}, "Outcome_variable": {"counts": {"exact": 63, "contains": 36, "wrong": 0, "missing": 0}, "strict": {"ced": 63, "ied": 36, "md": 0, "precision": 0.6363636363636364, "recall": 1.0, "f1": 0.7777777777777778, "accuracy": 0.6363636363636364}, "widened": {"ced": 99, "ied": 0, "md": 0, "precision": 1.0, "recall": 1.0, "f1": 1.0, "accuracy": 1.0}}, "sample_type": {"counts": {"exact": 82, "contains": 0, "wrong": 17, "missing": 0}, "strict": {"ced": 82, "ied": 17, "md": 0, "precision": 0.8282828282828283, "recall": 1.0, "f1": 0.9060773480662984, "accuracy": 0.8282828282828283}, "widened": {"ced": 82, "ied": 17, "md": 0, "precision": 0.8282828282828283, "recall": 1.0, "f1": 0.9060773480662984, "accuracy": 0.8282828282828283}}, "ethnicity": {"counts": {"exact": 70, "contains": 0, "wrong": 29, "missing": 0}, "strict": {"ced": 70, "ied": 29, "md": 0, "precision": 0.7070707070707071, "recall": 1.0, "f1": 0.8284023668639052, "accuracy": 0.7070707070707071}, "widened": {"ced": 70, "ied": 29, "md": 0, "precision": 0.7070707070707071, "recall": 1.0, "f1": 0.8284023668639052, "accuracy": 0.7070707070707071}}, "lag": {"counts": {"exact": 76, "contains": 0, "wrong": 15, "missing": 3}, "strict": {"ced": 76, "ied": 15, "md": 3, "precision": 0.8351648351648352, "recall": 0.9620253164556962, "f1": 0.8941176470588236, "accuracy": 0.8085106382978723}, "widened": {"ced": 76, "ied": 15, "md": 3, "precision": 0.8351648351648352, "recall": 0.9620253164556962, "f1": 0.8941176470588236, "accuracy": 0.8085106382978723}}}, "overall": {"counts": {"exact": 462, "contains": 36, "wrong": 87, "missing": 4}, "strict": {"ced": 462, "ied": 123, "md": 4, "precision": 0.7897435897435897, "recall": 0.9914163090128756, "f1": 0.879162702188392, "accuracy": 0.7843803056027164}, "widened": {"ced": 498, "ied": 87, "md": 4, "precision": 0.8512820512820513, "recall": 0.9920318725099602, "f1": 0.9162833486660533, "accuracy": 0.8455008488964346}}}, "assets": [{"group": "Prompts", "title": "schemas/buecker2023/prompts.yaml", "text": "# Editable prompt prose for the Buecker (2023) SWB-across-the-lifespan bundle.\n# Domain prose only — wire-contract rules (block_id verbatim, \"None\" sentinel,\n# JSON shape) live in code.\n#\n# Fields (see schemas/buecker2023/fields.json):\n#   paper-scope descriptors: yearT1, country, Outcome_variable, sample_type, ethnicity, lag\n#   sample-scope payload:    Sample (N), M_SWB, SD_SWB\n# `sample` = one MEASUREMENT RECORD: subsample × SWB component × wave. The\n# sample_label is \"<subsample> | <component> | wave <k>\" so records join to the\n# meta-analysts' data_final rows (one row per subsample × component × wave).\n\nstage1:\n  system:\n    role: |\n      You are an extraction agent for a meta-analysis of the DEVELOPMENT of\n      subjective well-being (SWB) across the life span, synthesising\n      LONGITUDINAL studies. Each paper follows a sample over 2+ waves and\n      reports SWB (life satisfaction, positive affect, and/or negative affect)\n      descriptive statistics — means, SDs, and Ns — at each wave. For each\n      target field, find its value in the attached paper section and cite\n      specific evidence (quote the exact table cell or sentence).\n\n    sample_naming: |\n      In this MA a \"sample\" = ONE MEASUREMENT RECORD = a subsample × one SWB\n      component × one measurement wave. Key each record by:\n        \"<subsample> | <component> | wave <k>\"\n      where:\n        - <subsample> is the whole recruited sample (\"whole sample\") OR a\n          distinct age cohort / demographic group the paper reports separately\n          (e.g. \"1998 cohort\", \"young-old\", \"women\"). Use the paper's own label.\n        - <component> is one of: \"life satisfaction\", \"positive affect\",\n          \"negative affect\".\n        - wave <k> numbers the assessment occasions in order (wave 1 = baseline).\n      Examples: \"whole sample | life satisfaction | wave 1\",\n      \"1998 cohort | negative affect | wave 2\".\n      Emit a SEPARATE record for every (subsample × component × wave) the paper\n      reports descriptive statistics for. When one table row/column reports a\n      metric for several subgroups or several waves in series, emit a separate\n      record per subgroup and per wave — do NOT collapse them or keep only the\n      first. A single table may contain means for many waves and cohorts —\n      extract EVERY cell. Use the SAME record key across Sample/M_SWB/SD_SWB.\n\n    effect_size_guidance: |\n      TWO KINDS OF FIELDS.\n\n      (1) PAPER-LEVEL DESCRIPTORS — one value for the whole study:\n      ┌─ yearT1 : the calendar year the FIRST/BASELINE wave of data was\n      │  COLLECTED. It is usually STATED in Methods/Participants/Procedure —\n      │  SEARCH there for phrasing like \"data were collected in 2008\", \"the first\n      │  assessment took place in autumn 2009\", \"participants were recruited in\n      │  YYYY\", \"baseline (YYYY)\", \"Time 1 (YYYY)\", \"the study began in YYYY\", or\n      │  a wave schedule/timeline. If a RANGE of collection years is given, use\n      │  the EARLIEST. PANEL/SURVEY REUSE: if the study uses SPECIFIC WAVES of an\n      │  existing panel (\"Waves 4, 6, 8 of the NLSY97\") or an ongoing survey\n      │  (\"since 2001\"), Time 1 = the year of the EARLIEST WAVE INCLUDED, NOT the\n      │  panel's inception — capture the panel's first-wave year AND the earliest\n      │  wave number/interval so it can be computed (NLSY97 annual from 1997 +\n      │  Wave 4 → 2000), and do NOT report the panel's start year. Only if it is\n      │  genuinely never stated, estimate = publication_year − study_duration.\n      │  NEVER invent a specific date not in the text; NEVER return the\n      │  publication year unless data were collected that year. 4-digit year, not \"None\".\n      ┌─ country : where the sample was predominantly collected (country, not\n      │  region/city). Multi-country panel → predominant country or a list.\n      ┌─ Outcome_variable : the SET of SWB components measured — any of\n      │  {life satisfaction, positive affect, negative affect}. Identify from\n      │  the measures used (SWLS / single-item LS → life satisfaction; PANAS\n      │  positive → positive affect; PANAS negative → negative affect).\n      ┌─ sample_type : nationally-representative (national panel: SOEP, HILDA,\n      │  BHPS, national probability) | community/convenience | college/\n      │  university students | clinical/patient | other. Choose ONE.\n      ┌─ ethnicity : race/ethnicity by the 70% rule. If composition is reported:\n      │  one group >=70% -> that group; reported but no group >=70% (e.g. \"39%\n      │  minorities\", a nationality mix) -> \"other\". If NOT reported -> \"not\n      │  specified\" (COMMON for European panels; a post-step infers from country).\n      │  Do NOT code \"white\" from a nationality mix / names when none hits 70%.\n      ┌─ lag : typical YEARS between consecutive waves (annual = 1.0, 6-monthly\n      │  = 0.5, biennial = 2.0). Compute from the wave schedule if not stated.\n\n      (2) NUMERIC SWB PAYLOAD — per measurement record (Sample = N, M_SWB, SD_SWB):\n      ┌─ These live in DESCRIPTIVE-STATISTICS TABLES (\"Means and standard\n      │  deviations of SWB by wave\", correlation/descriptives tables) and\n      │  sometimes in the Results text. READ THE TABLES — this is where the\n      │  numbers are, not only the prose.\n      ┌─ For each (subsample × component × wave) cell, transcribe the MEAN and\n      │  SD EXACTLY as printed — original scale, no rounding, no standardising.\n      ┌─ Sample (N) = the N contributing to that mean at that wave (analysis N).\n      ┌─ Watch for: SE vs SD (SD = SE × √N; SD is usually several× larger);\n      │  misread digits (O/0, I/1, comma vs decimal point — European papers may\n      │  use a comma as the decimal separator, e.g. \"5,12\" means 5.12); and\n      │  multiple sub-tables/panels (extract every panel, every wave column).\n      ┌─ Do NOT emit follow-up-only summary rows that are not per-wave means; if\n      │  only a change score or median is given for a cell, emit \"None\" for that\n      │  cell's mean/SD.\n\n  user:\n    section_context: \"SECTION: <<SECTION_TITLE>> (<<SECTION_ID>>)\"\n    content: \"<<SECTION_BLOCKS>>\"\n    assets_note: \"ATTACHED <<ASSET_TYPE>> (block <<ASSET_BLOCK>>): <<ASSET_TEXT>>\"\n    instruction: |\n      Extract every target field from the text and any attached asset. Paper-\n      level descriptors (yearT1, country, Outcome_variable, sample_type,\n      ethnicity, lag) may appear anywhere — emit them whenever you see evidence.\n      For the numeric payload, emit one per-record candidate (Sample, M_SWB,\n      SD_SWB) for EACH (subsample × SWB component × wave) descriptive cell in\n      this section's text or attached table image. It is OK if a section reports\n      only some sub-fields — emit what you see and return \"None\" for the rest;\n      the aggregator merges partial information across sections. Use the exact\n      same record key across Sample/M_SWB/SD_SWB for the same cell.\n\nstage2:\n  census_system: |\n    You are a meta-analysis aggregator for longitudinal SWB studies. In this MA\n    a \"sample\" = one MEASUREMENT RECORD = subsample × SWB component × wave. From\n    the candidate descriptions below, enumerate every DISTINCT record for which\n    the paper reports a mean/SD/N.\n\n    Output fields per record:\n      - study_index: 1 (these papers are single studies unless they clearly\n        report two independent studies/samples — then 1, 2, ...).\n      - sample_label: \"<subsample> | <component> | wave <k>\" (see rules above);\n        use \"whole sample\" when the paper does not split into cohorts/subgroups.\n      - total_n: the N contributing to that record's mean.\n      - gender: \"mixed\" (this MA does not decompose SWB means by gender).\n\n    Rules:\n      - One record per (subsample × component × wave) descriptive cell. A study\n        reporting LS at 3 waves for one whole sample → 3 records; a study\n        reporting PA and NA at 2 waves → 4 records; 7 cohorts × 4 waves × LS →\n        28 records.\n      - Merge aliases: the same cohort/wave referenced in different sections is\n        ONE record (use the clearest label). Do NOT invent waves not reported.\n      - Keep components separate: never merge life satisfaction with affect.\n\n  field_system: |\n    You are a meta-analysis aggregator resolving ONE field across candidate\n    extractions from different sections. Map each candidate's value onto the\n    FIXED list of record keys from the census; sample_key MUST be one of those\n    keys. Cite the candidate indices you relied on in best_indices and explain\n    briefly in reasoning. Follow the VALUE SHAPE instruction exactly.\n\n    SELECTION HEURISTICS (priority order):\n\n    0. NULL IS NOT A VOTE. A candidate emitting null / \"None\" has reported only\n       absence, not evidence. Treat null candidates as SILENT. If even ONE\n       candidate gives a non-null value for a record key AND its evidence cites\n       a table cell / descriptive-statistics row / explicit sentence, ADOPT that\n       value even if many candidates emitted null.\n\n    1. TABLE CELL TRUMPS PROSE. For M_SWB / SD_SWB / Sample, a value whose\n       evidence quotes a descriptives table cell beats a value paraphrased in\n       prose. Marker often mis-files Table assets into oddly-named sections —\n       trust the evidence quote, not the section label.\n\n    2. If ≥70% of NON-NULL candidates agree on a value for a record key, use it.\n\n    3. Sanity ranges (reject violations):\n       - Sample.total (N): 1 ≤ N ≤ 500000 (panels can be large).\n       - SD_SWB > 0 and typically 0.2–3× the plausible scale width; an \"SD\"\n         smaller than ~1/10 of the mean is likely an SE — flag/convert.\n       - M_SWB must be within the measure's plausible scale (e.g. SWLS total\n         5–35; SWLS mean-item 1–7; PANAS mean-item 1–5). Do not emit a\n         standardized (~0, SD~1) value unless the paper only reports z-scores.\n\n    PLACEMENT:\n    - Every candidate with a real (non-null) value MUST be assigned to a record\n      key. Dropping a real reported mean/SD is a serious error.\n    - NO SYNTHESIZED VALUES: emit a value only when a candidate provides direct\n      evidence for it.\n\n  flat_system: |\n    You are a meta-analysis aggregator resolving the PAPER-LEVEL descriptor\n    fields (yearT1, country, Outcome_variable, sample_type, ethnicity, lag).\n    Each has ONE value for the whole paper.\n\n    OVERRIDING SELECTION RULE — concrete evidence beats a default:\n    A candidate carrying CONCRETE evidence (a reported ethnic composition like\n    \"White 98%\", a specific sample descriptor like \"990 professionals\" or \"elite\n    youth soccer players\", an explicit data-collection date) OUTWEIGHS candidates\n    that merely say \"not specified\", \"other\", or null. Do NOT let a majority of\n    \"not specified\" / \"other\" / null candidates override one well-evidenced\n    specific value — \"not specified\"/\"other\"/null is NOT a vote. Read the evidence\n    quotes, not just the candidate labels.\n\n    Per-field rules:\n      - country: the country of data collection.\n      - Outcome_variable is a SET — union the SWB components measured.\n      - lag: the typical years between consecutive waves.\n      - sample_type: apply the field definition strictly. Map by the sample\n        DESCRIPTION in the evidence, not by a candidate's guessed label:\n        professionals / workers / athletes / volunteers / general community /\n        named cohort or twin/wellbeing studies → \"community/convenience\";\n        TERTIARY (college/university/undergraduate) students → \"college/university\n        students\", BUT school-recruited children/adolescents (\"grades 8–10\",\n        \"high/middle/junior-high schools\", \"schoolchildren\") → \"community/\n        convenience\" (NOT college); a national PROBABILITY panel whose sampling\n        frame is a WHOLE COUNTRY (SOEP/HILDA/BHPS/NLSY/nationally-representative\n        survey) → \"nationally-representative\", BUT a sample randomly/probability-\n        drawn from a SINGLE city/region/county/clinic/institution (e.g. \"randomly\n        selected older adults in Mexico City\", a one-hospital epilepsy cohort) is\n        NOT national → \"community/convenience\" (or \"clinical/patient\" if clinically\n        recruited); clinical recruitment → \"clinical/patient\". Reserve\n        \"other\" for when truly nothing fits (rare) — never use it for a\n        professional/athlete/community sample.\n      - ethnicity: apply the 70% rule (\"predominantly\" = 70%+).\n        * If a candidate REPORTS the composition: ONE group >=70% -> that group\n          (\"predominantly white/european\", \"predominantly black\", etc.); reported\n          but NO single group reaches 70% (e.g. \"39% racial minorities\" -> ~61%\n          white < 70%; a mix \"English 22%, Italian 12%, Dutch 11%\") -> \"other\".\n          A concrete reported composition outweighs many \"not specified\".\n        * If NO candidate reports a composition -> \"not specified\" (a deterministic\n          post-step infers it from the country). Do NOT code \"white/european\" from\n          a nationality mix or names when no single group hits 70% — use \"other\".\n          \"not specified\" is only for genuinely UNREPORTED composition.\n      - infoYearT1 + yearT1 (resolve TOGETHER, by provenance — do NOT estimate here):\n        First set infoYearT1:\n          * \"given\" — THIS paper states its OWN baseline data-collection year\n            (e.g. \"collected in 2008\", \"baseline December 2005\").\n          * \"reported_other_source\" — the study reuses data from another\n            publication about the SAME sample / specific panel waves, and that\n            year is available (e.g. \"Waves 4,6,8 of the NLSY97, fielded from 1997\").\n          * \"estimated\" — the baseline year is NOT stated for this study's data\n            anywhere. This INCLUDES the case where the only years present are\n            BACKGROUND CITATIONS — a prior study cited for context whose DATA this\n            study does NOT use (e.g. \"the 1994 study (Carmel & Mutran, 1997)\").\n        Then set yearT1:\n          * given → the stated baseline year (earliest if a range).\n          * reported_other_source → the reused source's collection year. For\n            \"Waves 4,6,8 of the NLSY97\" use the EARLIEST WAVE INCLUDED, computed as\n            panel_first_wave_year + (earliest_wave−1)×interval (NLSY97 annual from\n            1997, Wave 4 → 2000) — NOT the panel's inception, NOT an ongoing\n            survey's start year (\"since 2001\").\n          * estimated → yearT1 = \"None\". DO NOT estimate a year here; a\n            deterministic post-step computes publication_year − 3 − span.\n        Never adopt a year from a background citation, a survey's inception when\n        only a later window is used, or a value later than the publication year\n        (set infoYearT1=\"estimated\", yearT1=\"None\" in those cases).\n    Return \"None\" only for a field where truly no basis exists.\n\n  gender_shape: |\n    VALUE SHAPE: this is a gender-specific field — for each record key output a\n    list [total, female, male]; null for any position not reported. (This MA has\n    no gender-specific fields; this shape is unused.)\n\n  nongender_shape: |\n    VALUE SHAPE: this is NOT a gender-specific field. For each record key output\n    a SINGLE-element list, [value]. For multi-label fields (Outcome_variable),\n    the value is itself a list of component codes (e.g. the paper-level value is\n    [['life satisfaction', 'negative affect']]).\n"}, {"group": "Schema & field definitions", "title": "schemas/buecker2023/fields.json", "text": "{\n  \"version\": 1,\n  \"meta_analysis\": \"Buecker et al. (2023) — The Development of Subjective Well-Being Across the Life Span (meta-analysis of longitudinal studies)\",\n  \"doi\": \"10.1037/bul0000401\",\n  \"jansen_label\": \"Buecker2023\",\n  \"rationale\": \"Two-part extraction. (A) The 6 study-level descriptors Jansen (2025) benchmarked (yearT1, country, Outcome, sample_type, ethnicity, lag) — paper-scope flat fields for a like-for-like accuracy comparison against Jansen's LLM baseline. (B) The per-subsample-per-wave SWB N/mean/SD numeric payload the meta-analysts themselves coded (data_final) but Jansen NEVER benchmarked — this is our multimodal/table-reading differentiator. A 'sample' here = one measurement record: a subsample (whole recruited sample OR a distinct age cohort / demographic group analysed separately) × one SWB component (life satisfaction / positive affect / negative affect) × one measurement wave/timepoint. sample_label encodes all three so records join to data_final rows. Field names and the descriptor value-vocabularies mirror the human_coding_final 'Buecker2023' gold columns.\",\n  \"fields\": [\n    {\"name\": \"Sample\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Number of participants (N) contributing to THIS measurement record. The cell key (sample_label) identifies one record as '<subsample> | <SWB component> | wave <k>' — e.g. 'whole sample | life satisfaction | wave 1', '1998 cohort | negative affect | wave 2'. A 'subsample' is the whole recruited sample, OR a distinct age cohort / demographic group the paper analyses separately. Use the analysis N reported for that component at that wave. total_n anchors the census; leave it as the single value (this MA does not split by gender).\",\n     \"skills\": []},\n\n    {\"name\": \"infoYearT1\", \"scope\": \"paper\", \"gender_specific\": false, \"type\": \"enum\",\n     \"allowed_values\": [\"given\", \"reported_other_source\", \"estimated\"],\n     \"validator_match\": \"string_normalized\",\n     \"definition\": \"PROVENANCE of the baseline year (mirrors the meta-analysts' infoYearT1). Decide how yearT1 is known: 'given' = THIS paper explicitly states the calendar year/date its OWN first/baseline data-collection wave took place ('data were collected in 2008', 'baseline: December 2005', 'Time 1 (2011)'). 'reported_other_source' = this study REUSES data collected in a DIFFERENT publication about the SAME sample, and that source states the collection year (e.g. 'we analysed Waves 4–8 of the NLSY97, first fielded in 1997', 'data from the SOEP (Wagner et al., 2007)'). 'estimated' = the baseline collection year is NOT stated for this study's data anywhere — including when the only years present are BACKGROUND CITATIONS (a prior study cited for context/theory, whose DATA this study does NOT use, e.g. 'as Carmel (2001) showed in a 1994 study…'). When in doubt between a background citation and a genuine data source, ask: does THIS study's analysis use that referenced study's data (same sample/waves)? If no → 'estimated'.\"},\n\n    {\"name\": \"yearT1\", \"scope\": \"paper\", \"gender_specific\": false, \"type\": \"integer_or_string\",\n     \"jansen_label\": \"yearT1\", \"validator_match\": \"numeric_tolerance\", \"validator_tolerance\": 1,\n     \"skills\": [\"estimate_yeart1_from_pubyear\"],\n     \"definition\": \"Calendar year of the FIRST (baseline) assessment wave (T1), following infoYearT1. If infoYearT1='given': the year THIS paper states for its own baseline data collection (earliest if a range). If infoYearT1='reported_other_source': the collection year of the reused data source for the same sample. If infoYearT1='estimated': return the string 'None' — a deterministic post-step computes it as publication_year − 3 − span. CRITICAL: a year that only appears inside a BACKGROUND CITATION (a prior study cited for context whose data this study does NOT use — e.g. 'the 1994 study (Carmel & Mutran, 1997)') is NOT a valid yearT1 → set infoYearT1='estimated' and yearT1='None'. NEVER return the publication year itself, an ongoing survey's inception year when the study only uses a later window, or a date not supported by the paper. If the study reuses specific waves of a named panel, prefer infoYearT1='reported_other_source' and the EARLIEST WAVE INCLUDED, not the panel's first-ever wave.\"},\n\n    {\"name\": \"country\", \"scope\": \"paper\", \"gender_specific\": false, \"type\": \"string\",\n     \"jansen_label\": \"country\", \"validator_match\": \"string_normalized\",\n     \"definition\": \"Country where the study sample was predominantly collected (e.g. 'Germany', 'USA', 'Australia', 'United Kingdom'). If it is a multi-country panel, name the predominant country; if genuinely split, list them (e.g. 'USA/Canada'). Give the country, not a region or city.\"},\n\n    {\"name\": \"Outcome_variable\", \"scope\": \"paper\", \"gender_specific\": false,\n     \"type\": \"multi_label\", \"items_type\": \"enum\",\n     \"allowed_values\": [\"life satisfaction\", \"positive affect\", \"negative affect\"],\n     \"jansen_label\": \"Outcome_variable\", \"validator_match\": \"set_overlap\",\n     \"definition\": \"Which subjective-well-being component(s) this study measured longitudinally. 'life satisfaction' = SWLS, single-item life-satisfaction, cognitive well-being, quality of life. 'positive affect' / 'negative affect' = PANAS or other affect scales (positive vs negative subscales). Emit the SET of components actually measured (a paper may report one, two, or all three).\"},\n\n    {\"name\": \"sample_type\", \"scope\": \"paper\", \"gender_specific\": false, \"type\": \"enum\",\n     \"allowed_values\": [\"nationally-representative\", \"community/convenience\", \"college/university students\", \"clinical/patient\", \"other\"],\n     \"jansen_label\": \"sample_type\", \"validator_match\": \"string_normalized\",\n     \"definition\": \"Recruitment source of the sample — choose exactly ONE. 'nationally-representative' = ONLY a national PROBABILITY sample whose SAMPLING FRAME IS A WHOLE COUNTRY, explicitly designed to represent that country's population (SOEP, HILDA, BHPS, NLSY, SHARE-national, national census-based / nationally-representative surveys). CRITICAL — geographic scope matters, not just random sampling: a sample RANDOMLY or probability-drawn from a SINGLE CITY, region, province, county, clinic, hospital, school district, or institution is NOT nationally-representative (e.g. 'randomly selected older adults in Mexico City', 'a random community sample from one town') — code those 'community/convenience' (or 'clinical/patient' if clinically recruited). A large NAMED cohort / twin registry / ageing or wellbeing survey that is NOT probability-sampled to represent the whole nation is NOT this. 'college/university students' = TERTIARY (college/university/undergraduate/postgraduate) students ONLY. IMPORTANT: samples recruited from PRIMARY/ELEMENTARY/MIDDLE/JUNIOR-HIGH/SECONDARY/HIGH SCHOOLS — i.e. children or adolescents ('grades 8–10', 'high-school students', 'schoolchildren', 'adolescents recruited via schools') — are NOT 'college/university students'; code them 'community/convenience'. 'clinical/patient' = recruited through a clinical/treatment setting. 'community/convenience' = the DEFAULT for any other general sample — community, convenience, workplace/PROFESSIONAL, ATHLETES, volunteers, SCHOOL-recruited children/adolescents, and named cohort studies that are not nationally probability-sampled. 'other' = use ONLY when genuinely none of the above fit (very rare); a professional, athlete, school, or community sample is 'community/convenience', NOT 'other'.\"},\n\n    {\"name\": \"ethnicity\", \"scope\": \"paper\", \"gender_specific\": false, \"type\": \"enum\",\n     \"allowed_values\": [\"predominantly white/european\", \"predominantly black\", \"predominantly asian\", \"predominantly hispanic/latin american\", \"predominantly native american\", \"other\", \"not specified\"],\n     \"jansen_label\": \"ethnicity\", \"validator_match\": \"string_normalized\",\n     \"skills\": [\"infer_ethnicity_from_country\"],\n     \"definition\": \"Race/ethnicity of the sample, coded with the meta-analysts' 70% rule ('predominantly' = 70% or more). If the paper REPORTS the ethnic composition: (a) if ONE group is >=70%, code that group (e.g. 'White 98%' -> predominantly white/european; 'American Indian' -> predominantly native american); (b) if composition IS reported but NO single group reaches 70% — a diverse/mixed sample (e.g. '39% racial minorities' -> ~61% white < 70%; 'English 22%, Italian 12%, Dutch 11%') — code 'other'. If the paper does NOT report the composition at all, emit 'not specified' (a deterministic post-step then infers from country for ethnically-homogeneous countries). Do NOT code 'white/european' from a nationality mix or from names when no single group hits 70% — that is 'other'; 'not specified' is only for genuinely UNREPORTED composition.\"},\n\n    {\"name\": \"lag\", \"scope\": \"paper\", \"gender_specific\": false, \"type\": \"number\",\n     \"jansen_label\": \"lag\", \"validator_match\": \"numeric_tolerance\", \"validator_tolerance\": 0.34,\n     \"definition\": \"Typical time interval in YEARS between consecutive assessment waves (annual = 1.0; 6-monthly = 0.5; biennial = 2.0). If waves are unevenly spaced, report the modal/typical interval. Compute from the stated wave schedule or assessment dates when not stated directly. Report a number in years, not months.\"},\n\n    {\"name\": \"M_SWB\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"number\",\n     \"definition\": \"MEAN subjective-well-being score for THIS record (its subsample × SWB component × wave). Transcribe the value EXACTLY as printed in the results table or text — do NOT round, standardize (z-score), or impute. Keep the paper's original scale (e.g. a 1–7 SWLS mean, a 0–3 PANAS mean, a percentage). Means for SWB descriptive statistics are usually in a Table (means/SDs by wave) — read the table cells carefully (O vs 0, I vs 1) and record the row/column header in the evidence. If only a median is reported, emit 'None'.\"},\n\n    {\"name\": \"SD_SWB\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"number\",\n     \"definition\": \"STANDARD DEVIATION matching M_SWB for this record, transcribed exactly as printed. If only a standard error (SE) is reported, convert SD = SE × √N (N from this record's Sample). If only IQR or range is reported, emit 'None'. Do not confuse SD with SE — SD is typically several times larger.\"}\n  ]\n}\n"}, {"group": "Rules", "title": "rules/estimate_yeart1_from_pubyear/SKILL.md", "text": "---\nname: estimate_yeart1_from_pubyear\ndescription: Estimate the baseline year (yearT1) from publication year when the paper does not state it\nactivates_on: [derive]\nexecutor: estimate_yeart1_from_pubyear\napplies_to: [yearT1]\n---\n\nWhen a study does not report the calendar year of its first assessment (yearT1\nresolves to None), estimate it with the Buecker (2023) meta-analysts' own coding rule\nfor `infoYearT1 = 3 (Estimated)`:\n\n    yearT1 = publication_year − (3 years + interval between Time 1 and the last\n             assessment included in the study)\n\ni.e. `yearT1 = publication_year − 3 − span`. The publication year is supplied per\npaper via `context[\"publication_year\"]`, sourced from the study's entry in the\nBuecker reference list (`schemas/buecker2023/publication_years.json`). The span\n(T1→last wave) is estimated from the extracted payload as (max wave number − 1) × lag,\nfalling back to 2 years when waves/lag are unavailable. Applies only when yearT1 is\nmissing; a stated/extracted year is left untouched.\n"}, {"group": "Rules", "title": "rules/infer_ethnicity_from_country/SKILL.md", "text": "---\nname: infer_ethnicity_from_country\ndescription: Infer predominant ethnicity from country when the paper does not report it\nactivates_on: [derive]\nexecutor: infer_ethnicity_from_country\napplies_to: [ethnicity]\n---\n\nWhen a study does not report the racial/ethnic composition of its sample, infer the\npredominant ethnicity from the sample's country, following the meta-analysts' own\ncoding convention (Buecker 2023): European / European-heritage countries (Germany,\nUK, Sweden, Netherlands, Poland, Australia, …) → \"predominantly white/european\";\nEast-Asian countries (China, Japan, Korea, …) → \"predominantly asian\". USA / Canada\nare deliberately excluded (genuinely multi-ethnic — rely on reported data there).\nApplies only when ethnicity is missing or \"not specified\"; a reported composition is\nleft untouched.\n"}, {"group": "Ground-truth mapping", "title": "eval/buecker2023/gold_errata.md", "text": "# Buecker (2023) benchmark — gold errata (errors & inconsistencies found)\n\nRunning log of confirmed errors, mis-codes, inconsistencies, and definitional ambiguities in the\n**Jansen (2025) `human_coding_final` \"Buecker2023\" gold** and the meta-analysts' `data_final`, found\nwhile validating our extraction. Each entry: the study, the gold value, what the paper actually supports,\nthe evidence, and the type. These bound the achievable accuracy on affected fields — where the gold is\nwrong, our \"miss\" is often correct.\n\nLegend for **type**: `typo` (data-entry error) · `miscode` (category clearly wrong vs the paper) ·\n`inconsistency` (gold applies its own rule unevenly) · `definitional` (defensible either way).\n\n---\n\n## yearT1\n\n| study | gold | paper says | type | note |\n|---|---|---|---|---|\n| **Barker2016** | 2015 (`infoYearT1 = Given`) | *\"In Fall 2005… baseline, December 2005; April 2006; and the 2007, 2008…\"* | **typo** | 2005→2015 digit error; no 2015 data-collection date exists in the paper. **Our 2005 is correct.** |\n| Bares2012 | 2000 (`Given`) | *\"first sampled and interviewed in 1997\"* (NLSY97 inception); this study uses **Waves 4,6,8** | **definitional** | gold = year of the first wave *included in the study* (Wave 4 ≈ 1997+3 = 2000); panel inception is 1997. Both defensible; the manual's \"Time 1 = first assessment included\" makes 2000 the coding-correct answer. (Our panel-reuse rule now computes 2000.) |\n| Anglim2015 | 2009 (`Given`) | survey *\"used since 2001\"*; *\"2004 (midpoint of first waves)\"*; **\"2009\" appears NOWHERE in the paper** (verified by full-text grep) | **miscode** | coded `infoYearT1 = Given` (\"year given in the publication\") but 2009 is not stated anywhere; the paper's own dates are 2001 (survey start) and 2004 (first-wave midpoint). The correct stated value is ~2004; our 2001 (survey inception) is a defensible alternative; gold's 2009 is unsupported by the text. |\n\n## ethnicity  (manual rule: \"predominantly\" = **≥70%**; `Other` = reported but no group ≥70%; `Not specified` = unreported)\n\n| study | gold | paper says | type | note |\n|---|---|---|---|---|\n| **Anglim2015** | predominantly native american | general Australian sample (Australian Unity Wellbeing Index) | **miscode** | Australian ≠ American Indian / Pacific Islander / Alaska native; study is not about Aboriginal Australians. Clear category error. |\n| **Bratt2015** | predominantly white/european | *\"adolescents from **ethnic minority groups** (N = 705)\"* | **miscode** | the sample is explicitly minorities, not ≥70% white. Should be \"other\" (or a minority category). **Our \"other\" is more defensible.** |\n| **Busseri2013** | predominantly white/european | *\"446 Canadian students\"* — **no composition reported** | **inconsistency** | manual says unreported → \"not specified\"; gold inferred white for Canada. **Our \"not specified\" is the manual-correct code.** |\n| Adamczyk2017 | not specified | Polish sample, composition unreported | **inconsistency** | gold declines to infer here, but infers \"white/european\" for other unreported European samples (Germany/UK/Sweden). Uneven application of country-inference. |\n| Busseri2009 | other | race not assessed; *\"English 22%, Italian 12%, Dutch 11%…\"* (no nationality ≥70%) | **definitional** | correct per the 70% rule (reported, mixed → \"other\"), but a coder aggregating to \"White/European\" (all European ancestry) is also defensible. |\n| **Bares2012** | predominantly white/european | NLSY97 — a racially DIVERSE US panel (oversamples Black/Hispanic; no group ≥70% white) | **inconsistency** | under the 70% rule this should be \"other\" (which our extraction now emits); gold \"white\" doesn't fit the diverse NLSY97 composition. |\n\n| **Daniel2016** | predominantly asian | *\"a longitudinal study of **Israeli adolescents**\"* (title); Israeli sample | **miscode** | Israeli adolescents are not \"Predominantly Asian\" under the scheme; our \"white/european\" (or \"other\"/\"not specified\") is more defensible. Found in the 40-paper run. |\n| Delfabbro2017 | not specified | Australian youth cohort, composition unreported | **inconsistency** | gold declines to infer for Australia here though it infers \"white\" for other unreported European samples; we country-infer white. Same uneven country-inference as Adamczyk/Busseri2013. |\n| Duineveld2017 | not specified | Finnish sample, composition unreported | **inconsistency** | same pattern — we country-infer white for Finland, gold says not-specified. |\n\n**Systematic ethnicity issue:** the gold applies country-inference for *unreported* composition **inconsistently** — inferring \"white\" for Germany/UK/Sweden/Canada(Busseri2013) but \"not specified\" for Poland(Adamczyk). This caps ethnicity accuracy regardless of our method; the manual's own rule (unreported → \"not specified\") is not followed uniformly.\n\n---\n\n## sample_type  (found in the 30-paper run)\n\n| study | gold | paper says | type | note |\n|---|---|---|---|---|\n| **Burger2017** | community/convenience | *\"a representative large-scale sample… the TREE (Transitions from Education to Employment) project\"* — TREE is a PISA-2000-based **nationally-representative** Swiss cohort | **miscode** | should be \"nationally-representative\"; our extraction gives that. |\n| **Bergman2009** | nationally-representative | *\"479 Örebro women… the IDA extended… sample\"* — a single-city (Örebro) regional cohort | **miscode** | IDA is NOT national; should be \"community/convenience\" (which we emit). Opposite-direction error to Burger — the gold is internally inconsistent on this field. |\n\n## yearT1 (more, from 30-paper run)\n\n| study | gold | paper says | type | note |\n|---|---|---|---|---|\n| **Carmel2016** | 2012 | *\"in 2010, we randomly selected…\"* | **inconsistency** | paper's explicit recruitment year is 2010; gold 2012 is 2 yr off. Our 2010 matches the text. |\n\n## sample_type / lag (found in the 50-paper run, newest batch Eisman–Garcia)\n\n| study | field | gold | paper says | type | note |\n|---|---|---|---|---|---|\n| **Galla2020** | sample_type | college/university students | *\"The mindful adolescent … students sampled from two public middle schools and six charter schools, 8th→9th grade\"* | **miscode** | the sample is **middle/high-school adolescents**, not tertiary students; our \"community/convenience\" is correct per the school-recruited-adolescent rule. |\n| **Eisman2017** | lag | 12.0 | African-American adolescents, waves annual during high school; *\"wave 11 obtained ≈12 months before wave 12\"* → ~1 yr inter-wave | **error** | 12.0 is implausible as an inter-wave interval (looks like total span or wave-count entered as lag); our 2.0 is far closer. |\n| **Ellberg2020** | lag | 7.0 | *\"assessed at four time periods: third trimester and 1, 3, 6 months postpartum\"* — whole study spans **< 1 year** | **error** | 7.0 years is physically impossible for a postnatal study; our 0.93 is closer (true value ≈ 0.2). |\n| Fergusson2015 | lag | 3.0 | Christchurch cohort assessed at ages 18/21/25/30/35 (intervals 3,4,5,5) | **definitional** | unevenly spaced; gold took the first interval (3), we took a later one (5). Modal ≈ 4; both defensible. |\n\n| **Dainese2011** | sample_type | community/convenience | *\"MIDUS is a national probability sample, drawn with random-digit dialing … National Survey of Midlife Development in the United States\"* | **miscode** | MIDUS is a textbook nationally-representative US probability sample; our \"nationally-representative\" is correct. |\n| FrizellReiter2016 | sample_type | community/convenience | *\"the population-based Norwegian Mother and Child Cohort Study (MoBa), conducted by the Norwegian Institute of Public Health … Medical Birth Registry of Norway\"* | **definitional** | the sampling frame is a national population-based cohort; \"nationally-representative\" is defensible (a disease-subgroup of a national cohort). Both codes arguable. |\n\n## Our own errors found (not gold errors)\n\n- **sample_type \"nationally-representative\" over-call — FIXED** (50-paper run): we had labelled\n  **Garcia-Pena2013** (older adults **randomly sampled within Mexico City** — a single-city frame) as\n  \"nationally-representative\". Root cause: the model triggered \"nationally-representative\" on any\n  *random/probability* sampling, ignoring geographic scope. **Rule fix applied** (fields.json +\n  flat_system): require a national probability sample whose **frame is a whole country**; a single\n  city/region/clinic random sample → `community/convenience`. After re-aggregation Garcia-Pena flipped\n  to community/convenience (correct) with **no regression** on genuine national samples — Dainese2011\n  (MIDUS) and FrizellReiter2016 (MoBa) correctly stayed \"nationally-representative\". (My first read of\n  FrizellReiter as a \"clinical/regional\" own-error was wrong: I saw the neurology affiliation, not the\n  MoBa national sampling frame.)\n\n- **Cowlishaw2013 country** (40-paper run): we returned **Australia** (from the Monash University author\n  affiliation) but the sample is **British** — the study's social-support items are \"adapted from the\n  British Health and Lifestyle Survey\" and it is a UK ageing cohort. Gold **UK is correct**. Lesson for\n  the country rule: the sample's country ≠ the first author's institution country; prefer sample-recruitment\n  evidence over affiliation.\n\n## Known extraction failure (not a gold issue)\n\n- **Kobayashi2015** (99-paper run): fails deterministically at Stage-1 on its dense social-network\n  results-table section with `ProviderError: non-JSON response: Unterminated string` — the\n  schema-constrained gemini-2.5-flash output is truncated mid-string (char 431 at temp 0.0, char 734 at\n  temp 0.4; `max_output_tokens=65536` is not the cap). 4 retries + a temperature nudge did not clear it.\n  Corpus finalized at **98/99 extracted**; needs a provider-side JSON continuation/repair fallback.\n\n## Corrupted study labels in Jansen's gold (found 2026-07-09)\n\nTwo studies were initially dropped as \"no gold\" — they DO have gold, stored under labels corrupted by\nletter transposition plus a wrong year. Verified field-for-field against our extraction.\n\n| our study_id | gold's corrupted label | corruption | verification |\n|---|---|---|---|\n| **Daukantaite2012** | `Dankantaité2011` | Dau→**Dan**, 2012→2011 | all 6 fields agree (yearT1 1998 · Sweden · LS+PA+NA · community · white · lag 6) |\n| **Gustavson2016** | `Gutsavson2015` | Gus**ta**→Gu**ts**a, 2016→2015 | all 6 agree (yearT1 2008 · Norway · LS · community · white · lag 3) |\n\nSame class as Bennett's `Ziołkowska2017` corruption. **`ChenK2020` is the only study with no gold\nanywhere** (absent from both the gold sheet and the LLM coding sheets).\n\nRelated Jansen-side defects (see the cross-MA record §4): the LLM sheet and gold sheet use different\nlabel spaces for some studies (`Berghuis2020` vs `Borghuis2019`); the LLM sheet has duplicate rows\n(`Chen2020`, `Zhang2017`); and its `*_clean_2` columns are entirely empty.\n\nAlso note **`Chen2020`'s gold `lag` cell is Excel-corrupted to a datetime** (`2024-05-01 00:00:00`) —\nalmost certainly \"1/2\" (=0.5) coerced to a date. Our extraction gives 0.5.\n\n## Validator note (not a gold error)\n\n- **Chen2020** yearT1: the gold row's representative value is **2016** (matches the paper's \"first wave November 2016\" and our extraction), but `load_gold_descriptors`' MODAL selection picked a stray **2009** from another row. Root cause identified 2026-07-09 (below).\n- **`modal()` was non-deterministic** (fixed 2026-07-09): it was `max(set(vals), key=vals.count)`, so **ties were broken by set-iteration order**, which is hash-seed dependent. The *gold itself* changed run-to-run (the `lag` reference count flipped between 91 and 92 across `PYTHONHASHSEED` values), and with it every reported metric. Ties are now broken by the smallest string repr; gold + metrics are now byte-identical across seeds. This is the root cause of the Chen2020 symptom above.\n- **`sample_type` gold decoder was wrong** (fixed 2026-07-09): code `4` was decoded as `clinical/patient`. The Buecker gold's real scheme is `1 = Nationally-representative, 2 = Community, 3 = College, 4 = Other, 5 = Not specified` — there is **no clinical/patient category**, so our schema's `clinical/patient` can never match (we emit it only for Helgeson2015, where it is therefore always wrong; gold there is `community`). **Impact on all reported numbers: zero** — no study in the 100-paper corpus is coded 4 or 5 (75 community / 11 national / 11 college). Latent bug that would have bitten on a larger corpus.\n- **country normalization** (fixed 2026-07-07): `norm()` did not alias `United States`↔`usa` (nor `United Kingdom`↔`uk`, `Netherlands`↔`Holland`, etc.), so **Burris2017** (`United States` vs gold `usa`) counted as a miss though both are correct. Added a `_COUNTRY_ALIAS` map → country 0.93 → **0.97**.\n\n## `infoYearT1` provenance flag — a test-method caveat (not a gold error)\n\n- The gold's `infoYearT1` (1=Given / 2=Reported-other-source / 3=Estimated) is well-defined, but our schema's `infoYearT1` field **cannot be populated by a Stage-2 re-aggregation run** — it has no Stage-1 candidates, so the field aggregator defaults it to a *no-evidence* \"estimated\" for **every** paper. Routing the pub−3−span estimation off that defaulted flag **overrode correctly-extracted \"given\" years** (Armenta 2002→2005, Berg 1991→2002) and regressed yearT1 0.79→0.66. **Rule:** never let a defaulted provenance flag override a concretely-extracted value; the estimation skill fires only on unresolved/implausible yearT1. Realizing the provenance *override* (rejecting a background-citation year via `infoYearT1=\"estimated\"`) requires a **full Stage-1 re-extract**, not re-aggregation.\n\n## Impact on reported accuracy\n\n- **yearT1**: Barker (typo) is unwinnable — our 2005 is right, gold is wrong. So our *true* yearT1 accuracy ≥ the measured 0.90 (Barker should count as correct).\n- **ethnicity**: Anglim (miscode), Bratt (miscode), Busseri2013 (inconsistent inference) are cases where **our answer is at least as defensible as the gold**. With these set aside, ethnicity is well above the measured 0.60.\n\n_Source of truth for the gold: `Jansen2025/osfstorage-archive/coding_data.zip` (`human_coding_final.xlsx`\nsheet `Buecker2023`) and `Jansen2025/Buecker2023_188/Data/data_final_*.RData`. Coding manual:\n`Jansen2025/Buecker2023_188/Coding Instructions_SWB across the life span.pdf`._\n"}]};

(function(){
  const groups = {};
  (DATA.assets||[]).forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
  const order = ["Prompts","Schema & field definitions","Rules","Ground-truth mapping"];
  const body = document.getElementById('assetsBody');
  let html = '';
  for (const g of order) {
    const items = groups[g]; if (!items) continue;
    html += `<div class="asset-group"><div class="gh">${esc(g)}</div>`;
    for (const a of items) {
      html += `<div class="asset"><details><summary>${esc(a.title)}</summary><pre>${esc(a.text)}</pre></details></div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html || '<em>No assets found.</em>';
})();

// ---- metric panels ----
function renderPanel(elId, label, sub){
  const el = document.getElementById(elId);
  const key = elId === 'panelStrict' ? 'strict' : 'widened';
  const o = DATA.summary.overall[key];
  let h = `<h3>${label} <span class="tag">— ${sub}</span></h3>`;
  h += `<div class="bigrow">
    <div class="big"><b>${f3(o.f1)}</b><span>F1</span></div>
    <div class="big"><b>${f3(o.precision)}</b><span>Precision</span></div>
    <div class="big"><b>${f3(o.recall)}</b><span>Recall</span></div>
    <div class="big"><b>${pct(o.accuracy)}</b><span>Accuracy</span></div>
  </div>`;
  h += `<div class="counts">CED ${o.ced} · IED ${o.ied} · MD ${o.md} &nbsp;(${o.ced+o.ied+o.md} scored data points)</div>`;
  h += `<table class="fm"><thead><tr><th>field</th><th>P</th><th>R</th><th>F1</th><th>Acc</th></tr></thead><tbody>`;
  for (const f of DATA.evaluated_fields) {
    const m = DATA.summary.per_field[f][key];
    h += `<tr><td>${esc(f)}</td><td>${f3(m.precision)}</td><td>${f3(m.recall)}</td><td>${f3(m.f1)}</td><td>${pct(m.accuracy)}</td></tr>`;
  }
  h += `</tbody></table>`;
  el.innerHTML = h;
}
renderPanel('panelStrict', 'Strict', 'exact match only');
renderPanel('panelWidened', 'Widened', 'reference within extraction = match');

function markActivePanel(){
  document.getElementById('panelStrict').classList.toggle('active', std==='strict');
  document.getElementById('panelWidened').classList.toggle('active', std==='widened');
}

// ---- cell color ----
function cellColor(klass){
  if (!klass || klass==='neutral') return 'neutral';
  if (klass==='exact') return 'full';
  if (klass==='contains') return std==='widened' ? 'full' : 'partial';
  return 'none'; // wrong | missing
}

function renderCell(cell){
  if (!cell || cell.kind === 'empty') return '<span class="empty-val">(empty)</span>';
  if (cell.kind === 'scalar') return esc(cell.text);
  return cell.rows.map(([label, vals]) =>
    `<div class="sub"><span class="sub-h">${esc(label)}:</span> ${vals.map(esc).join(', ')}</div>`).join('');
}

// ---- tooltip ----
const tt = document.getElementById('tooltip');
function showTip(pid, field, x, y){
  const cell = byId[pid].cells[field];
  if (!cell) { tt.style.display='none'; return; }
  const k = cell.klass || 'neutral';
  let h = `<div class="tt-row"><span class="tt-label">${esc(pid)}</span> · ${esc(field)} <span class="tt-klass">${k}</span></div>`;
  if (k !== 'neutral') {
    h += `<div class="tt-std">strict: <b>${STD.strict[k]}</b> &nbsp;·&nbsp; widened: <b>${STD.widened[k]}</b></div>`;
  }
  if (cell.gold != null) {
    h += `<div class="tt-gold"><span class="tt-label">reference:</span> ${esc(cell.gold)}`;
    if (cell.gold_source) h += `<div class="tt-src">source: ${esc(cell.gold_source)}</div>`;
    h += `</div>`;
  } else {
    h += `<div class="tt-gold tt-src">no reference value (unscored)</div>`;
  }
  if (cell.evidence && cell.evidence.length) {
    h += `<div class="tt-ev"><span class="tt-label">evidence (${cell.evidence.length}):</span>`;
    for (const e of cell.evidence) {
      const loc = [e.sample, e.section, (e.page!=null?('p.'+e.page):null)].filter(Boolean).map(esc).join(' · ');
      h += `<div style="margin-top:4px"><div class="q">“${esc(e.quote)}”</div>${loc?`<div class="meta">${loc}</div>`:''}</div>`;
    }
    h += `</div>`;
  }
  tt.innerHTML = h; tt.style.display='block';
  const r = tt.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  let left=x+12, top=y+12;
  if (left+r.width>vw-10) left=x-r.width-12;
  if (top+r.height>vh-10) top=y-r.height-12;
  tt.style.left=Math.max(10,left)+'px'; tt.style.top=Math.max(10,top)+'px';
}
function hideTip(){ tt.style.display='none'; tt.classList.remove('pinned'); }

// ---- table ----
function buildTable(visible){
  const hr = document.getElementById('headerRow');
  hr.innerHTML = '<th>Paper</th>' + fields.map(f => `<th class="${evald.has(f)?'evald':''}" title="${esc(f)}">${esc(f)}</th>`).join('');
  const rows = visible.map(pid => {
    const p = byId[pid];
    let tr = `<tr><td title="${esc(pid)}">${esc(pid)}</td>`;
    for (const f of fields) {
      const cell = p.cells[f];
      tr += `<td><div class="cell ${cellColor(cell&&cell.klass)}" data-p="${esc(pid)}" data-f="${esc(f)}">${renderCell(cell)}</div></td>`;
    }
    return tr + '</tr>';
  });
  document.getElementById('tableBody').innerHTML = rows.join('');
  document.getElementById('paperCount').textContent = visible.length + ' papers';
  document.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('mouseenter', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mousemove', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mouseleave', () => { if(!pinned) hideTip(); });
    c.addEventListener('click', e => {
      e.stopPropagation();
      const same = pinned && pinned.p===c.dataset.p && pinned.f===c.dataset.f;
      document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
      if (same) { pinned=null; hideTip(); }
      else { pinned={p:c.dataset.p,f:c.dataset.f}; c.classList.add('pinned'); showTip(c.dataset.p,c.dataset.f,e.clientX,e.clientY); tt.classList.add('pinned'); }
    });
  });
}
document.addEventListener('click', e => {
  if (pinned && !e.target.closest('.cell') && !e.target.closest('.tooltip')) {
    pinned=null; hideTip(); document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
  }
});

const viewMode=document.getElementById('viewMode'), paperSelect=document.getElementById('paperSelect'), searchBox=document.getElementById('searchBox');
papers.forEach(p => { const o=document.createElement('option'); o.value=p.id; o.textContent=p.id; paperSelect.appendChild(o); });
function refresh(){
  const search=searchBox.value.trim().toLowerCase();
  let vis;
  if (viewMode.value==='single'){ paperSelect.style.display=''; vis=[paperSelect.value]; }
  else { paperSelect.style.display='none'; vis=papers.map(p=>p.id); }
  if (search) vis=vis.filter(id=>id.toLowerCase().includes(search));
  pinned=null; hideTip(); buildTable(vis);
}
viewMode.onchange=refresh; paperSelect.onchange=refresh; searchBox.oninput=refresh;
document.querySelectorAll('input[name=std]').forEach(r => r.addEventListener('change', e => {
  std = e.target.value; markActivePanel(); refresh();
}));

markActivePanel();
refresh();
</script>
</body>
</html>
