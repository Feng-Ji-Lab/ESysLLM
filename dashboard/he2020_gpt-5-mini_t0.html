<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraction Pipeline Dashboard</title>
<style>
:root {
  --bg: #f8f9fa;
  --text: #212529;
  --border: #dee2e6;
  --header-bg: #343a40;
  --header-text: #f8f9fa;
  --cell-border: rgba(150,150,150,0.4);
  --match-full: rgba(72, 199, 116, 0.25);
  --match-partial: rgba(255, 221, 87, 0.30);
  --match-none: rgba(255, 99, 99, 0.22);
  --match-neutral: rgba(200,200,200,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
}

/* --- Controls --- */
.controls {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #fff;
  border-bottom: 2px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.controls label { font-weight: 600; font-size: 12px; white-space: nowrap; }
.controls input[type="text"], .controls select {
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
}
.controls input[type="text"] { width: 200px; }
.controls select { max-width: 320px; }
.controls .sep { border-left: 1px solid var(--border); height: 28px; }
.controls .badge {
  background: #e9ecef;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  color: #495057;
}

/* --- Table wrapper --- */
.table-wrap {
  overflow: auto;
  max-height: calc(100vh - 60px);
  position: relative;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  min-width: 100%;
}

/* --- Header --- */
thead th {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--header-bg);
  color: var(--header-text);
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,0.1);
  min-width: 160px;
}
thead th:first-child {
  position: sticky;
  left: 0;
  z-index: 200;
  min-width: 220px;
  max-width: 280px;
}

/* --- Body --- */
tbody td {
  vertical-align: top;
  padding: 4px 6px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  min-width: 160px;
}
tbody td:first-child {
  position: sticky;
  left: 0;
  z-index: 50;
  background: #fff;
  font-weight: 600;
  font-size: 12px;
  min-width: 220px;
  max-width: 280px;
  word-break: break-word;
  border-right: 2px solid var(--border);
}

/* --- Cell block --- */
.cell-block {
  border: 1px solid var(--cell-border);
  border-radius: 4px;
  padding: 4px 6px;
  cursor: pointer;
  position: relative;
  min-height: 24px;
  transition: box-shadow 0.15s;
}
.cell-block:hover {
  box-shadow: 0 0 0 2px rgba(66,133,244,0.3);
}
.cell-block.pinned {
  box-shadow: 0 0 0 2px rgba(66,133,244,0.6);
}
.cell-block.match-full    { background: var(--match-full); }
.cell-block.match-partial { background: var(--match-partial); }
.cell-block.match-none    { background: var(--match-none); }
.cell-block.match-neutral { background: var(--match-neutral); }

/* sub-blocks */
.sub-block { margin-bottom: 3px; }
.sub-block:last-child { margin-bottom: 0; }
.sub-block-header {
  font-weight: 600;
  font-size: 11px;
  color: #495057;
}
.gender-line {
  margin-left: 12px;
  font-size: 11px;
  color: #555;
}
.gender-label { font-weight: 600; text-transform: capitalize; }
.empty-val { color: #aaa; font-style: italic; }

/* --- Tooltip --- */
.tooltip-box {
  position: fixed;
  z-index: 5000;
  background: #fff;
  border: 1px solid #aaa;
  border-radius: 6px;
  padding: 10px 12px;
  max-width: 480px;
  min-width: 200px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  font-size: 12px;
  line-height: 1.5;
  display: none;
  pointer-events: none;
  word-wrap: break-word;
}
.tooltip-box.pinned {
  pointer-events: auto;
}
.tooltip-box .tt-label { font-weight: 700; color: #333; }
.tooltip-box .tt-section { margin-top: 6px; }
.tooltip-box .tt-gt { border-top: 1px dashed #ccc; padding-top: 6px; margin-top: 6px; }

/* --- Legend --- */
.legend {
  display: flex; gap: 12px; align-items: center; font-size: 11px;
}
.legend-item {
  display: flex; align-items: center; gap: 4px;
}
.legend-swatch {
  width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.15);
}

/* search highlight */
tr.highlight-row td:first-child { background: #fff3cd !important; }
</style>
</head>
<body>

<div class="controls" id="controls">
  <label>View:</label>
  <select id="viewMode">
    <option value="all">All papers</option>
    <option value="single">Single paper</option>
  </select>
  <select id="paperSelect" style="display:none"></select>
  <div class="sep"></div>
  <label>Search:</label>
  <input type="text" id="searchBox" placeholder="Filter papers...">
  <div class="sep"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-full)"></div> Full match</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-partial)"></div> Partial match</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-none)"></div> No match</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--match-neutral)"></div> No GT</div>
  </div>
  <div class="sep"></div>
  <span class="badge" id="paperCount"></span>
</div>

<div class="table-wrap" id="tableWrap">
  <table id="mainTable">
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="tooltip-box" id="tooltip"></div>

<script>
// ---- Embedded data ----
const DATA = {"papers": {"1Al Otaibi2018": {"Number of studies": {"extract_value": [1], "best_indices": [1, 3, 7], "reason": "Multiple sections (abstract [1], methods [3], and results [7]) consistently describe a single cross-sectional study of 326 middle-aged Saudi women. No sections indicate more than one study, no separate Study 1/Study 2 labeling, and the paper is repeatedly referred to in the singular, so the most accurate count is 1."}, "Country": {"extract_value": {"Single study": ["Saudi Arabia"]}, "best_indices": [2, 4, 5, 0], "reason": "All sections (title, abstract, methods, results, discussion) consistently describe a single cross-sectional study conducted in Hofuf city, Saudi Arabia, enrolling 326 middle-aged Saudi women. No evidence of multiple distinct studies or subsamples was found, so the paper is treated as a single study; the country is reported throughout as Saudi Arabia."}, "Sample": {"extract_value": {"Single study": ["326"]}, "best_indices": [2, 3], "reason": "All primary results/tables/abstract/discussion (candidates 0,2,3,4) consistently report 326 enrolled middle-aged Saudi women. The Methods section (candidate 1) gives a calculated minimum required sample of 207, not the actual enrolled N. Per priority rules, Results/Tables/Main text values were preferred over the Methods' target sample and Abstract; therefore the final N is 326. The sample is all female (female=326).", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": ["326"]}, "other": {"Single study": []}, "total": {"Single study": ["326"]}}}, "Survey method": {"extract_value": {"Single study": ["paper-and-pencil"]}, "best_indices": [0, 1], "reason": "Both the abstract (candidate 0) and the Methods (candidate 1) describe a single cross-sectional face-to-face interview study. The Methods section explicitly states data were collected via trained interviewers, so the survey method is best classified as in-person/paper-and-pencil. No evidence of online data collection or multiple distinct studies was found."}, "Mean age of participants": {"extract_value": {"Single study": ["49.14"]}, "best_indices": [1, 2], "reason": "All candidates refer to a single cross-sectional study of 326 middle-aged Saudi women. Mean age is consistently reported as 49.14 years in the Results text and the table (candidates 1 and 2); the Abstract (candidate 0) reports the same value. Results/Table are preferred as most reliable, so 49.14 was chosen. Female and total values are identical and recorded accordingly.", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": ["49.14"]}, "other": {"Single study": []}, "total": {"Single study": ["49.14"]}}}, "Mean BMI of participants": {"extract_value": {"Single study": ["29.64", "29.64 (SD 5.82)"]}, "best_indices": [1, 2, 3, 4], "reason": "All candidates refer to a single cross-sectional study of 326 middle-aged Saudi women. The mean BMI is consistently reported as 29.64 kg/m2 across Results (index 1), table assets (indices 2 and 4) and Discussion (index 3), with SD reported as 5.82 in the Discussion/tables. Prefer main text and tables over the abstract; values are consistent, and participants are all female, so the same mean applies to both 'female' and 'total'.", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": ["29.64", "29.64 (SD 5.82)"]}, "other": {"Single study": []}, "total": {"Single study": ["29.64", "29.64 (SD 5.82)"]}}}, "Source of sample": {"extract_value": {"Single study": ["community"]}, "best_indices": [0, 1], "reason": "Both Abstract (candidate 0) and Methods (candidate 1) consistently report a single cross-sectional study recruiting women from primary health centers in Hofuf city via waiting-room approach. This is community-based recruitment, so the source is 'community'. No evidence of college or school sampling or multiple distinct studies."}, "Assessment of BMI": {"extract_value": {"Single study": ["measured"]}, "best_indices": [0, 1], "reason": "Both candidates come from the Methods/Measures sections of the same single cross-sectional study and explicitly state BMI was measured by trained nutritionists using digital scales and stadiometers (anthropometric measurements). No evidence of multiple studies or contradictory sources, so 'measured' is reported for the single study."}, "Assessment of BA": {"extract_value": {"Single study": ["BAS"]}, "best_indices": [0], "reason": "Only one study is reported in the paper. Candidate 0 (Measures section) explicitly states Body Appreciation was measured with the 13-item Body Appreciation Scale (BAS) and provides reliability (α=0.81). The Measures/Methods section is the most reliable source for instrument identification, so 'BAS' is selected."}, "Correlation between body appreciation and BMI": {"extract_value": {"Single study": ["-0.237"]}, "best_indices": [0, 1], "reason": "Both candidates refer to the same single cross-sectional study of 326 middle-aged Saudi women and report the same Pearson correlation between Body Appreciation (BA/BAS) and BMI (r = -0.237, p < 0.01). Candidate 0 provides the textual report; Candidate 1 is the table/figure asset showing the same value. Values are consistent, so the single study entry uses r = -0.237 (reported for women; also the total sample).", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": ["-0.237"]}, "other": {"Single study": []}, "total": {"Single study": ["-0.237"]}}}, "Percentage of college or higher of participants": {"extract_value": {"Single study": ["33.4"]}, "best_indices": [0], "reason": "Only one study in the paper (single cross-sectional sample of 326 middle-aged Saudi women). The table (Table/Fig-1) reports 'College or higher 109 (33.4%)'. The main text contains an inconsistent statement labeling the same count as 'secondary school or less', so I favored the table value as the more reliable explicit label. Because the sample is entirely female, the percentage applies to both 'female' and 'total'.", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": ["33.4"]}, "other": {"Single study": []}, "total": {"Single study": ["33.4"]}}}, "Publication type": {"extract_value": ["journal articles"], "best_indices": [0], "reason": "The manuscript includes corresponding author contact details, declarations of no competing interests, and explicit submission, peer review, acceptance, and publication dates—metadata characteristic of a journal article rather than a dissertation. The paper describes a single cross-sectional study, further supporting journal publication format."}}, "1AlcarazIbanez2017": {"Number of studies": {"extract_value": [1], "best_indices": [0, 2, 8], "reason": "Multiple sections consistently describe a single validation study of the BAS-2 in Brazilian adolescents (main sample N = 840). Although a separate test–retest subsample (n = 46) is reported, it is presented as part of the same study for temporal stability assessment, not as a separate, independently labeled study. The Discussion and Introduction likewise refer to one study, supporting a count of 1."}, "Country": {"extract_value": {"Single study": ["Brazil"]}, "best_indices": [5, 7, 6, 4, 8], "reason": "All candidate sources consistently report a single validation study of the BAS-2 conducted with Brazilian adolescents. The Participants section (candidate 5) and the CFA table (candidate 7) explicitly state the sample came from three Brazilian cities in São Paulo State; Measures (6), Introduction (4), and Discussion (8) also identify the Brazilian adolescent sample. A small test–retest subsample is reported but is part of the same study, so results are merged under one study. Therefore the country is reported as Brazil."}, "Assessment of BA": {"extract_value": {"Single study": ["BAS-2"]}, "best_indices": [3, 5, 6, 8, 9, 10, 11, 12], "reason": "All candidate sections consistently report a single validation study of the Brazilian Portuguese Body Appreciation Scale-2 (BAS-2) in adolescents (main sample N = 840, plus a test–retest subsample n = 46). No separate numbered studies are presented; the test–retest subsample is part of the same study. Multiple reliable sections (Methods: measures and participants, CFA tables, reliability, convergent validity, Discussion) explicitly name and evaluate the BAS-2, so the instrument for the single study is BAS-2."}, "Publication type": {"extract_value": ["journal articles"], "best_indices": [0, 1, 2], "reason": "Candidate 0 explicitly shows the work is an article (title and journal: Psychology, Society, & Education, Nov 2017). Candidates 1 and 2 describe a single validation study and methods consistent with a peer-reviewed journal article. There is no evidence indicating this is a dissertation, so the correct value is \"journal articles.\""}, "Sample": {"extract_value": {"Single study": [840, 46]}, "best_indices": [1, 2, 4], "reason": "All candidates describe a single validation study of the BAS-2 in Brazilian adolescents (main sample N = 840) with an additional test–retest subsample (n = 46). Method/Participants text and Table 1 consistently report the whole sample (N = 840) and gender splits (438 boys, 402 girls) (candidates 1 and 2). Reliability/temporal stability section/Table reports the separate test–retest subsample of 46 (19 boys, 27 girls) (candidate 4). Per instructions, subsamples are merged into the same study entry rather than creating separate study keys; thus the extract lists include both 840 and 46, and gender-specific values are combined accordingly. Candidates chosen reflect the most reliable sources (Participants/Methods and Tables for main N; Reliability section for the test–retest N).", "extract_value_by_gender": {"male": {"Single study": [438, 19]}, "female": {"Single study": [402, 27]}, "other": {"Single study": []}, "total": {"Single study": [840, 46]}}}, "Mean age of participants": {"extract_value": {"Single study": [15.5, 15.51, 14.02]}, "best_indices": [0, 1], "reason": "Both candidates refer to the same validation study (N=840) of Brazilian adolescents (Study X). Candidate 0 provides gender-specific mean ages (boys M=15.50; girls M=15.51). Candidate 1 provides the same main-sample means and also reports a separate test–retest subsample (n=46) with Mage=14.02. Per instructions, subsamples are merged into the same study entry. Values were taken from the Participants/main-text evidence (preferred over abstract/table) and combined: main-sample male/female means (15.50, 15.51) and the test–retest total mean (14.02).", "extract_value_by_gender": {"male": {"Single study": [15.5]}, "female": {"Single study": [15.51]}, "other": {"Single study": []}, "total": {"Single study": [14.02]}}}, "Mean BMI of participants": {"extract_value": {"Single study": [21.87, 21.67, 20.32]}, "best_indices": [0], "reason": "The paper reports one main study (N=840) with gender-specific mean BMIs: boys M=21.87, girls M=21.67 (from the Participants/main text). A separate test–retest subsample (n=46) from the same study has an overall mean BMI M=20.32; per instructions subsamples are merged into the same study entry. Values come from candidate 0 (Participants section), which is the most reliable source for sample descriptive statistics.", "extract_value_by_gender": {"male": {"Single study": [21.87]}, "female": {"Single study": [21.67]}, "other": {"Single study": []}, "total": {"Single study": [20.32]}}}, "Source of sample": {"extract_value": {"Single study": ["primary/secondary/ high school"]}, "best_indices": [0, 1, 2], "reason": "All candidates describe a single validation study of adolescents recruited from schools/classroom settings (840 students from three Brazilian cities, plus a small test–retest subsample of 46). Statistical text references clustering by school centers and procedure text states participants were recruited in classroom settings with parental consent. The test–retest subsample is part of the same study, so results are merged into one study entry labeled 'Single study' with source = primary/secondary/ high school."}, "Assessment of BMI": {"extract_value": {"Single study": ["self-reported"]}, "best_indices": [0, 1], "reason": "Both candidates (indices 0 and 1) come from the same single-study paper (Participants and Measures sections). The Measures text explicitly states BMI was computed from self-reported height and weight, and the Participants text reports self-reported BMI values for the main sample and the test–retest subsample. Therefore the study-level assessment of BMI is 'self-reported'."}, "Survey method": {"extract_value": {"Single study": ["paper-and-pencil"]}, "best_indices": [0], "reason": "Only one study is reported. Candidate 0 (Procedure/Method section) explicitly states participants completed a paper-and-pencil questionnaire in a classroom environment, which is the most reliable source for survey method. A small test–retest subsample is part of the same study and does not constitute a separate study, so all data are merged under 'Single study'. No evidence of online data collection was found."}, "Correlation between body appreciation and BMI": {"extract_value": {"Single study": []}, "best_indices": [0], "reason": "Only one candidate (index 0) provided direct correlation values between Body Appreciation and BMI, reported separately by gender (rboys = -0.20; rgirls = -0.25). The paper describes a single study (one main adolescent sample), so values were placed under 'Single study' and reported separately for male and female per the gender-specific rule.", "extract_value_by_gender": {"male": {"Single study": [-0.2]}, "female": {"Single study": [-0.25]}, "other": {"Single study": []}, "total": {"Single study": []}}}}, "1Alleva2016A Dutch translation and validation o": {"Number of studies": {"extract_value": [1], "best_indices": [1, 3, 7, 9], "reason": "Multiple sections (Abstract [1], Study description [3], Procedure/timing [7], and Discussion/summary [9]) consistently describe a single investigation (one sample, N=310) and no evidence of additional studies or separate experiments. Therefore the paper contains one study."}, "Country": {"extract_value": {"Single study": ["Netherlands"]}, "best_indices": [0, 1, 2, 3, 4, 5], "reason": "All candidate entries consistently report a single investigation conducted in the Netherlands. Key reliable sources include the title (candidate 0), Introduction (1), Measures/Table noting the Dutch translation and sample size (2), Procedure describing recruitment at Maastricht University and VU University Amsterdam (3), Construct validity/results (4), and Discussion (5). These confirm one study (N=310) of Dutch-speaking female undergraduates recruited at two universities in the Netherlands; the two university subsamples are part of the same study and thus merged. Therefore the country is reported as 'Netherlands'."}, "Percentage of college or higher of participants": {"extract_value": {"Single study": [100]}, "best_indices": [0, 1, 2, 3], "reason": "All candidate sources consistently describe a single study of Dutch-speaking female university/undergraduate students (N = 310). Per the instructions' infer_rule, 'university students'/'undergraduates' imply 100% have college or higher education. Participants (Abstract, Participants section) and Discussion explicitly state the sample are female undergraduates, so all candidates were merged into one study entry and the value 100% recorded (female and total).", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": [100]}, "other": {"Single study": []}, "total": {"Single study": [100]}}}, "Source of sample": {"extract_value": {"Single study": ["college"]}, "best_indices": [0, 1, 2, 3, 4], "reason": "All candidate sections describe the same single investigation (N=310) of Dutch-speaking female university students/undergraduates recruited from two universities (campus ads and online recruitment systems). Multiple sections (title, abstract, participants, procedure, discussion) consistently identify a college sample; subsamples (two universities) are part of the same study and were merged. Therefore the source of sample is 'college'."}, "Assessment of BA": {"extract_value": {"Single study": ["BAS-2"]}, "best_indices": [1, 3, 4, 5, 8, 9], "reason": "All candidate sections refer to a single investigation (N = 310) that translated and validated the Body Appreciation Scale-2 in Dutch-speaking female undergraduates. The Measures section and Tables explicitly list the Dutch BAS-2, the Abstract and Introduction describe use of the BAS-2, and Results/psychometrics (internal consistency, factor analysis, construct validity) report findings specifically for the BAS-2. No evidence of additional distinct studies was found, so the single-study extraction is BAS-2."}, "Sample": {"extract_value": {"Single study": [310]}, "best_indices": [1, 2, 3, 4, 5], "reason": "All candidates refer to a single study of Dutch-speaking female undergraduates with N = 310. Multiple reliable sections report this sample size: Participants (index 1) and Measures/Tables (indices 2–5) explicitly state 'N = 310'; these main-text sources are preferred over the abstract. Values are consistent across sources, so the study is resolved as one sample (Single study) with total N = 310 and female N = 310.", "extract_value_by_gender": {"male": {"Single study": []}, "female": {"Single study": [310]}, "other": {"Single study": []}, "total": {"Single study": [310]}}}, "Mean age of participants": {"extract_value": {"Single study": [21.31]}, "best_indices": [0, 1, 2], "reason": "All three candidates refer to the same single study (N = 310 Dutch-speaking female undergraduates) and report the same mean age (M = 21.31, SD = 3.04). The Participants section (index 1) and Table 1 (index 2) provide the reliable primary source, with the Abstract (index 0) consistent; therefore the single study value 21.31 is used. Female an const papers = DATA.papers;
const fields = DATA.fields;
const comparison = DATA.comparison;
const gtDisplay = DATA.gt_display;
const paperIds = Object.keys(papers).sort();

// ---- State ----
let pinnedTooltip = null;  // {paperId, field} or null

// ---- Helpers ----
function isNoneLike(v) {
  if (v === null || v === undefined) return true;
  const s = String(v).trim().toLowerCase();
  return s === 'none' || s === 'nan' || s === '' || s === '.';
}

function formatBestIndices(indices) {
  if (!indices || !indices.length) return '(none)';
  const sorted = [...indices].sort((a,b) => a - b);
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === end + 1) {
      end = sorted[i];
    } else {
      ranges.push(start === end ? String(start) : `${start}-${end}`);
      start = end = sorted[i];
    }
  }
  ranges.push(start === end ? String(start) : `${start}-${end}`);
  return ranges.join(', ');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function filterNoneLike(arr) {
  return (arr || []).filter(v => !isNoneLike(v));
}

function listsMatch(a, b) {
  // Compare two value lists (order-insensitive, approximate)
  if (a.length !== b.length) return false;
  const na = a.map(v => { try { return parseFloat(v); } catch(e) { return String(v).toLowerCase(); } }).sort();
  const nb = b.map(v => { try { return parseFloat(v); } catch(e) { return String(v).toLowerCase(); } }).sort();
  for (let i = 0; i < na.length; i++) {
    if (typeof na[i] === 'number' && typeof nb[i] === 'number') {
      if (Math.abs(na[i] - nb[i]) > 0.05) return false;
    } else if (String(na[i]) !== String(nb[i])) return false;
  }
  return true;
}

// ---- Cell rendering ----
function renderCell(fieldData) {
  if (!fieldData) return '<span class="empty-val">(no data)</span>';

  const ev = fieldData.extract_value;
  const evg = fieldData.extract_value_by_gender;
  let html = '';

  if (evg) {
    html = renderGenderCell(ev, evg);
  } else if (ev !== undefined) {
    html = renderPlainCell(ev);
  } else {
    html = '<span class="empty-val">(no data)</span>';
  }
  return html;
}

function renderPlainCell(ev) {
  // ev is dict or list
  if (ev && typeof ev === 'object' && !Array.isArray(ev)) {
    // Dict: per-study
    const parts = [];
    for (const [study, vals] of Object.entries(ev)) {
      const filtered = filterNoneLike(vals);
      if (filtered.length) {
        parts.push(`<div class="sub-block"><span class="sub-block-header">${esc(study)}:</span> ${filtered.map(v => esc(String(v))).join(', ')}</div>`);
      } else {
        parts.push(`<div class="sub-block"><span class="sub-block-header">${esc(study)}:</span> <span class="empty-val">(empty)</span></div>`);
      }
    }
    return parts.join('') || '<span class="empty-val">(empty)</span>';
  }
  if (Array.isArray(ev)) {
    const filtered = filterNoneLike(ev);
    if (filtered.length) {
      return `<div class="sub-block">${filtered.map(v => esc(String(v))).join(', ')}</div>`;
    }
    return '<span class="empty-val">(empty)</span>';
  }
  if (isNoneLike(ev)) return '<span class="empty-val">(empty)</span>';
  return `<div class="sub-block">${esc(String(ev))}</div>`;
}

function renderGenderCell(ev, evg) {
  // Collect all study keys from evg (from any gender dict)
  const studyKeys = new Set();
  for (const g of ['female', 'male', 'other', 'total']) {
    const gDict = evg[g];
    if (gDict && typeof gDict === 'object' && !Array.isArray(gDict)) {
      for (const k of Object.keys(gDict)) studyKeys.add(k);
    }
  }
  // Also get study keys from ev if it's a dict
  const evIsDict = (ev && typeof ev === 'object' && !Array.isArray(ev));
  if (evIsDict) {
    for (const k of Object.keys(ev)) studyKeys.add(k);
  }

  const parts = [];
  for (const study of studyKeys) {
    let headerVals = '';

    // Get extract_value for this study
    let evStudyVals = [];
    if (evIsDict && ev[study]) {
      evStudyVals = filterNoneLike(Array.isArray(ev[study]) ? ev[study] : [ev[study]]);
    }

    // Get total for this study
    let totalVals = [];
    if (evg.total && typeof evg.total === 'object' && !Array.isArray(evg.total) && evg.total[study]) {
      totalVals = filterNoneLike(Array.isArray(evg.total[study]) ? evg.total[study] : [evg.total[study]]);
    }

    // Check if total matches extract_value
    const totalMatchesEv = evStudyVals.length > 0 && totalVals.length > 0 && listsMatch(evStudyVals, totalVals);

    // Header line
    if (!totalMatchesEv && evStudyVals.length > 0) {
      headerVals = ` ${evStudyVals.map(v => esc(String(v))).join(', ')}`;
    }

    let studyHtml = `<div class="sub-block"><div class="sub-block-header">${esc(study)}:${headerVals}</div>`;

    // Gender lines
    for (const g of ['female', 'male', 'other', 'total']) {
      const gDict = evg[g];
      if (!gDict) continue;
      let gVals = [];
      if (typeof gDict === 'object' && !Array.isArray(gDict) && gDict[study]) {
        gVals = filterNoneLike(Array.isArray(gDict[study]) ? gDict[study] : [gDict[study]]);
      }
      // Skip empty or zero-only
      if (!gVals.length) continue;
      if (gVals.length === 1 && (gVals[0] === 0 || gVals[0] === '0')) continue;

      studyHtml += `<div class="gender-line"><span class="gender-label">${g}:</span> ${gVals.map(v => esc(String(v))).join(', ')}</div>`;
    }

    studyHtml += '</div>';
    parts.push(studyHtml);
  }

  // Also render studies from ev that are NOT in evg study keys
  if (evIsDict) {
    for (const [study, vals] of Object.entries(ev)) {
      if (studyKeys.has(study)) continue;  // already rendered above
      const filtered = filterNoneLike(Array.isArray(vals) ? vals : [vals]);
      if (filtered.length) {
        parts.push(`<div class="sub-block"><span class="sub-block-header">${esc(study)}:</span> ${filtered.map(v => esc(String(v))).join(', ')}</div>`);
      }
    }
  }

  return parts.join('') || '<span class="empty-val">(empty)</span>';
}

// ---- Tooltip ----
const tooltipEl = document.getElementById('tooltip');

function showTooltip(paperId, field, x, y) {
  const fd = papers[paperId]?.[field];
  const gt = gtDisplay[paperId]?.[field];

  // If no extracted data AND no GT info, nothing to show
  if (!fd && gt === undefined) { tooltipEl.style.display = 'none'; return; }

  let html = '';
  if (fd) {
    // best_indices
    html += `<div><span class="tt-label">best_indices:</span> ${formatBestIndices(fd.best_indices)}</div>`;
    // reason
    if (fd.reason) {
      html += `<div class="tt-section"><span class="tt-label">reason:</span> ${esc(fd.reason)}</div>`;
    }
  } else {
    html += `<div><span class="tt-label" style="color:#888">No values extracted for this field.</span></div>`;
  }
  // ground truth
  if (gt !== undefined) {
    html += `<div class="tt-gt"><span class="tt-label">ground_truth:</span> ${esc(gt)}</div>`;
  }

  tooltipEl.innerHTML = html;
  tooltipEl.style.display = 'block';

  // Position
  const rect = tooltipEl.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let left = x + 12;
  let top = y + 12;
  if (left + rect.width > vw - 10) left = x - rect.width - 12;
  if (top + rect.height > vh - 10) top = y - rect.height - 12;
  if (left < 0) left = 10;
  if (top < 0) top = 10;
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function hideTooltip() {
  tooltipEl.style.display = 'none';
  tooltipEl.classList.remove('pinned');
}

// ---- Build table ----
function buildTable(visiblePapers) {
  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('tableBody');

  // Header
  headerRow.innerHTML = '<th>Paper</th>' + fields.map(f => `<th title="${esc(f)}">${esc(f)}</th>`).join('');

  // Body
  const rows = [];
  for (const pid of visiblePapers) {
    const pdata = papers[pid];
    let tr = `<tr data-paper="${esc(pid)}"><td title="${esc(pid)}">${esc(pid)}</td>`;
    for (const field of fields) {
      const fd = pdata[field];
      const match = comparison[pid]?.[field] || 'neutral';
      const cellContent = renderCell(fd);
      tr += `<td><div class="cell-block match-${match}" data-paper="${esc(pid)}" data-field="${esc(field)}">${cellContent}</div></td>`;
    }
    tr += '</tr>';
    rows.push(tr);
  }
  tbody.innerHTML = rows.join('');

  document.getElementById('paperCount').textContent = `${visiblePapers.length} papers`;

  // Attach events
  attachCellEvents();
}

function attachCellEvents() {
  document.querySelectorAll('.cell-block').forEach(block => {
    block.addEventListener('mouseenter', (e) => {
      if (pinnedTooltip) return; // don't override pinned
      const pid = block.dataset.paper;
      const field = block.dataset.field;
      showTooltip(pid, field, e.clientX, e.clientY);
    });
    block.addEventListener('mousemove', (e) => {
      if (pinnedTooltip) return;
      const pid = block.dataset.paper;
      const field = block.dataset.field;
      showTooltip(pid, field, e.clientX, e.clientY);
    });
    block.addEventListener('mouseleave', () => {
      if (!pinnedTooltip) hideTooltip();
    });
    block.addEventListener('click', (e) => {
      e.stopPropagation();
      const pid = block.dataset.paper;
      const field = block.dataset.field;

      if (pinnedTooltip && pinnedTooltip.paperId === pid && pinnedTooltip.field === field) {
        // Unpin
        pinnedTooltip = null;
        hideTooltip();
        block.classList.remove('pinned');
      } else {
        // Unpin old
        if (pinnedTooltip) {
          document.querySelectorAll('.cell-block.pinned').forEach(b => b.classList.remove('pinned'));
        }
        // Pin new
        pinnedTooltip = { paperId: pid, field: field };
        block.classList.add('pinned');
        showTooltip(pid, field, e.clientX, e.clientY);
        tooltipEl.classList.add('pinned');
      }
    });
  });
}

// Click elsewhere to unpin
document.addEventListener('click', (e) => {
  if (pinnedTooltip && !e.target.closest('.cell-block') && !e.target.closest('.tooltip-box')) {
    pinnedTooltip = null;
    hideTooltip();
    document.querySelectorAll('.cell-block.pinned').forEach(b => b.classList.remove('pinned'));
  }
});

// ---- Controls ----
const viewMode = document.getElementById('viewMode');
const paperSelect = document.getElementById('paperSelect');
const searchBox = document.getElementById('searchBox');

// Populate paper select
paperIds.forEach(pid => {
  const opt = document.createElement('option');
  opt.value = pid;
  opt.textContent = pid;
  paperSelect.appendChild(opt);
});

function refresh() {
  const mode = viewMode.value;
  const search = searchBox.value.trim().toLowerCase();

  let visible;
  if (mode === 'single') {
    paperSelect.style.display = '';
    visible = [paperSelect.value];
  } else {
    paperSelect.style.display = 'none';
    visible = paperIds;
  }

  if (search) {
    visible = visible.filter(pid => pid.toLowerCase().includes(search));
  }

  // Reset tooltip state
  pinnedTooltip = null;
  hideTooltip();

  buildTable(visible);
}

viewMode.addEventListener('change', refresh);
paperSelect.addEventListener('change', refresh);
searchBox.addEventListener('input', refresh);

// Initial render
refresh();
</script>
