<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eval Dashboard — reference vs extracted</title>
<style>
:root {
  --bg:#f8f9fa; --text:#212529; --border:#dee2e6;
  --header-bg:#343a40; --header-text:#f8f9fa;
  --cell-border:rgba(150,150,150,0.4);
  --full:rgba(72,199,116,0.28); --partial:rgba(255,221,87,0.34);
  --none:rgba(255,99,99,0.24); --neutral:rgba(200,200,200,0.12);
  --full-s:#48c774; --partial-s:#ffdd57; --none-s:#ff6363; --neutral-s:#ccc;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:13px; background:var(--bg); color:var(--text); line-height:1.4; }
.topbar { background:#fff; border-bottom:2px solid var(--border); padding:12px 18px; }
.topbar h1 { font-size:1.2rem; font-weight:700; }
.topbar .sub { color:#6b7280; font-size:12px; margin-top:2px; }

/* assets */
.assets { margin:12px 0; border:1px solid var(--border); border-radius:8px; background:#fcfcfd; }
.assets > summary { cursor:pointer; padding:10px 14px; font-weight:600; color:#1d4ed8; list-style:none; }
.assets > summary::before { content:'▸ '; }
.assets[open] > summary::before { content:'▾ '; }
.assets-body { padding:6px 14px 14px; }
.asset-group { margin-top:10px; }
.asset-group > .gh { font-weight:700; font-size:12px; color:#374151; text-transform:uppercase; letter-spacing:.04em; margin:8px 0 4px; }
.asset details { border:1px solid var(--border); border-radius:6px; margin:5px 0; background:#fff; }
.asset details > summary { cursor:pointer; padding:6px 10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#0f172a; }
.asset pre { margin:0; padding:10px 12px; border-top:1px solid var(--border); background:#0f172a; color:#e2e8f0; font-size:11.5px; line-height:1.5; overflow:auto; max-height:420px; }

/* standard toggle + metric panels */
.stdtoggle { margin:12px 0 6px; display:flex; gap:18px; align-items:center; font-size:13px; }
.stdtoggle label { cursor:pointer; }
.stdtoggle .hint { color:#6b7280; font-size:12px; }
.panels { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .panels { grid-template-columns:1fr; } }
.panel { border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff; }
.panel.active { border-color:#1d4ed8; box-shadow:0 0 0 2px rgba(29,78,216,.12); }
.panel h3 { font-size:13px; margin-bottom:8px; }
.panel h3 .tag { font-weight:500; color:#6b7280; }
.bigrow { display:flex; gap:16px; margin:6px 0 8px; }
.big b { font-size:1.45rem; font-weight:700; display:block; line-height:1; }
.big span { font-size:11px; color:#6b7280; }
.counts { font-size:11.5px; color:#6b7280; margin-bottom:8px; }
table.fm { width:100%; border-collapse:collapse; font-size:11.5px; }
table.fm th, table.fm td { padding:3px 6px; border-bottom:1px solid var(--border); text-align:right; }
table.fm th:first-child, table.fm td:first-child { text-align:left; }
table.fm th { color:#6b7280; font-weight:600; }

/* controls */
.controls { position:sticky; top:0; z-index:1000; background:#fff; border-bottom:2px solid var(--border); padding:8px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.controls label { font-weight:600; font-size:12px; }
.controls input[type=text], .controls select { padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; }
.controls input[type=text] { width:200px; }
.controls .sep { border-left:1px solid var(--border); height:26px; }
.controls .badge { background:#e9ecef; padding:2px 8px; border-radius:10px; font-size:11px; color:#495057; }
.legend { display:flex; gap:12px; align-items:center; font-size:11px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-swatch { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,0.15); }

/* table */
.table-wrap { overflow:auto; max-height:calc(100vh - 60px); }
table.grid { border-collapse:separate; border-spacing:0; min-width:100%; }
.grid thead th { position:sticky; top:0; z-index:100; background:var(--header-bg); color:var(--header-text); padding:8px 10px; font-size:11px; font-weight:600; text-align:left; white-space:nowrap; border-right:1px solid rgba(255,255,255,0.1); min-width:150px; }
.grid thead th.evald::after { content:" \2605"; color:#ffd43b; }
.grid thead th:first-child { left:0; z-index:200; min-width:170px; max-width:220px; }
.grid tbody td { vertical-align:top; padding:4px 6px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); min-width:150px; }
.grid tbody td:first-child { position:sticky; left:0; z-index:50; background:#fff; font-weight:600; font-size:12px; min-width:170px; max-width:220px; word-break:break-word; border-right:2px solid var(--border); }
.cell { border:1px solid var(--cell-border); border-radius:4px; padding:4px 6px; cursor:pointer; min-height:24px; transition:box-shadow .15s; }
.cell:hover { box-shadow:0 0 0 2px rgba(66,133,244,0.3); }
.cell.pinned { box-shadow:0 0 0 2px rgba(66,133,244,0.6); }
.cell.full { background:var(--full); } .cell.partial { background:var(--partial); }
.cell.none { background:var(--none); } .cell.neutral { background:var(--neutral); }
.sub { margin-bottom:3px; } .sub:last-child { margin-bottom:0; }
.sub-h { font-weight:600; font-size:11px; color:#495057; }
.empty-val { color:#aaa; font-style:italic; }
.tooltip { position:fixed; z-index:5000; background:#fff; border:1px solid #aaa; border-radius:6px; padding:10px 12px; max-width:520px; min-width:220px; box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:12px; line-height:1.5; display:none; }
.tooltip.pinned { pointer-events:auto; }
.tt-row { margin-bottom:5px; } .tt-label { font-weight:700; color:#333; }
.tt-klass { display:inline-block; padding:1px 8px; border-radius:999px; font-weight:700; font-size:11px; background:#eef; }
.tt-std { font-size:11px; color:#374151; }
.tt-gold { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-src { color:#6b7280; font-size:11px; }
.tt-ev { border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; }
.tt-ev .q { color:#333; } .tt-ev .meta { color:#6b7280; font-size:11px; }
</style>
</head>
<body>
<div class="topbar">
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>

  <details class="assets" id="assetsPanel">
    <summary>Customizations — prompts · schema · field definitions · rules (click to expand)</summary>
    <div class="assets-body" id="assetsBody"></div>
  </details>

  <div class="stdtoggle">
    <strong>Standard:</strong>
    <label><input type="radio" name="std" value="strict" checked> Strict (exact match)</label>
    <label><input type="radio" name="std" value="widened"> Widened (reference within extraction)</label>
    <span class="hint">— toggles cell coloring; both panels below always shown</span>
  </div>
  <div class="panels">
    <div class="panel" id="panelStrict"></div>
    <div class="panel" id="panelWidened"></div>
  </div>
</div>

<div class="controls">
  <label>View:</label>
  <select id="viewMode"><option value="all">All papers</option><option value="single">Single paper</option></select>
  <select id="paperSelect" style="display:none"></select>
  <div class="sep"></div>
  <label>Search:</label><input type="text" id="searchBox" placeholder="Filter papers...">
  <div class="sep"></div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--full)"></div>exact (correct)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--partial)"></div>contains (→correct if widened)</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--none)"></div>wrong / missing</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--neutral)"></div>no gold</div>
  </div>
  <div class="sep"></div>
  <span class="badge" id="paperCount"></span>
</div>

<div class="table-wrap"><table class="grid"><thead><tr id="headerRow"></tr></thead><tbody id="tableBody"></tbody></table></div>
<div class="tooltip" id="tooltip"></div>

316455697, "recall": 0.8333333333333334, "f1": 0.7586206896551724, "accuracy": 0.6111111111111112}, "widened": {"ced": 64, "ied": 15, "md": 11, "precision": 0.810126582278481, "recall": 0.8533333333333334, "f1": 0.8311688311688312, "accuracy": 0.7111111111111111}}}, "assets": [{"group": "Prompts", "title": "schemas/vu2024/prompts.yaml", "text": "# Editable prompt prose for the willful-ignorance meta-analysis bundle.\n# Domain prose only — wire-contract rules (block_id verbatim, the \"None\"\n# sentinel, JSON shape) live in code.\n#\n# Variables targeted:\n#   Design, country, info_cost, N_Self_CI_Tmt, N_Self_CI_Ctr, N_Altr_CI_Ctr\n# See schemas/vu2024/fields.json and rules/vu_*/SKILL.md for additional skills.\n\nstage1:\n  system:\n    role: |\n      You are an extraction agent for a meta-analysis of the willful-ignorance /\n      moral-wiggle-room paradigm (Dana et al. 2007). Each paper reports a\n      dictator game with a CONFLICT STATE (selfish option harms recipient)\n      under two information conditions: FULL INFORMATION (\"Ctr\" — recipient\n      payoffs visible, = baseline) and HIDDEN INFORMATION (\"Tmt\" — payoffs\n      hidden by default but revealable, usually at no cost). For each target\n      field, find its value in the attached paper section and cite specific\n      evidence.\n\n    sample_naming: |\n      In this MA, a \"sample\" = a single (Tmt × Ctr) comparison CELL. Most\n      papers have ONE cell per study; some have multiple:\n\n        - Grossman 2014 — 3 Tmts (Default-NR / Active / Default-R) all vs ONE\n          shared Baseline → 3 cells\n        - Lind 2019 — 4 Tmts (Hidden / Hypothetical / Stranger / Partner) all\n          vs ONE shared Baselline → 4 cells\n        - Exley & Kessler 2020 — 3 paired (HI1↔KI1, HI2↔KI2, HI3↔KI3) → 3 cells\n        - Conrads 2013 — 3 Tmts (Choice / Choice-UR / Choice-H) vs ONE shared\n          Transparency → 3 cells\n        - Jarke-Neuert 2020 — 2 paired (no-time-pressure, time-pressure) → 2\n        - Kappes 2018 — 4 cells in Study 1 + 3 in Study 2 = 7 cells\n\n      For each cell, emit a SEPARATE candidate keyed by a cell label of the form\n      \"<Tmt_name> vs <Ctr_name>\" (verbatim names as in the paper). Examples:\n        \"Hidden information vs Baseline\"\n        \"Default NR vs Baseline\"\n        \"Choice-UR vs Transparency\"\n        \"S1 Uncertain vs S1 Outcome Certainty\"\n\n      When N Tmt cells share one Ctr, replicate the Ctr-side N values across\n      all cells sharing that Ctr — that matches the canonical per-cell encoding.\n\n      Tables and figures: a single table image often contains all cells in one\n      paper. Extract EVERY cell row, not just the first.\n\n      Gender is NOT relevant for these cell counts — this meta-analysis\n      does not collect gender-stratified counts. Do not split a cell by gender.\n\n    effect_size_guidance: |\n      CELL TERMINOLOGY (CRITICAL — wrong axis assignment = wrong cell = wrong\n      number; this is the most common source of failure on N_*_CI_* fields):\n\n      - VARIABLE NAME DECOMPOSITION: `N_<choice>_CI_<treatment>` means:\n          `<choice>` ∈ {Self, Altr, Tot}\n          `_CI_` = \"Conflict state\" (the $6/$1 cell where selfish option harms\n                   recipient). Opposite is _AI_ (aligned, $5/$5) — NOT extracted.\n          `<treatment>` ∈ {Tmt, Ctr}\n\n      - Tmt is ALWAYS the HIDDEN INFORMATION (HI) manipulation. Aliases:\n        \"Hidden information\", \"Hidden payoff\", \"Non-transparent\", \"Hidden –\n        conflict\", \"Hidden – time pressure\", \"Period 2\" (Matthey & Regner),\n        \"Default NR\" / \"Default R\" / \"Active choice\" (Grossman 2014's 3 HI\n        variants), \"Choice\" / \"Choice-UR\" / \"Choice-H\" (Conrads 2013),\n        \"Reveal bonus\", \"Dictator – Ruler – Hidden\" (Cerrone & Engel).\n        NEVER the baseline.\n\n      - Ctr is ALWAYS the FULL INFORMATION (FI) baseline. Aliases: \"Baseline\",\n        \"Transparent\", \"Known information\", \"Revealed state\", \"Standard\n        dictator\", \"CIG Only\", \"Period 1\", \"Control\", \"Open\", \"Public payoffs\",\n        \"Dictator – Ruler\". NEVER the manipulation.\n\n      - \"Selfish choice\" = max-own-payoff option ($6/$1, \"option A\", \"X\").\n        \"Altruistic\" / \"prosocial\" = equal-or-favor-recipient ($5/$5, \"B\", \"Y\").\n        Always emit INTEGERS, never proportions. If paper says \"50% of n=40\n        chose selfishly\", emit N_Self = 20.\n\n      - N_Altr_CI_Ctr DERIVATION: Use the identity N_Altr_CI_Ctr =\n        N_Tot_CI_Ctr − N_Self_CI_Ctr whenever both components are known.\n        Every participant in the conflict state either chose Self or Altr —\n        the identity is exact. PREFER deriving over searching for \"N prosocial\n        choices in baseline\" prose (often only reported as %).\n\n      DESIGN field:\n      - \"between-subject\" if participants are randomly assigned to one of HI\n        or FI (different participants in each).\n      - \"within-subject\" if the same participants experience both conditions\n        (Exley 2015, Matthey & Regner 2011, Soraperra 2020).\n      - For within-subject papers, N_*_CI_* values are typically NOT reported\n        as simple cell counts — they're stored as 2×2 transition cells. In\n        that case, return \"None\" for N_*_CI_* with reasoning \"within-subject\n        design; transition cells (Self_Self, Self_Altr, Altr_Self, Altr_Altr)\n        used instead\".\n\n      COUNTRY field: lowercase exact match against {germany, mturk/prolifics,\n      norway, switzerland, united states}. SPECIAL CASE: studies recruited\n      via Amazon MTurk, Prolific, CloudResearch, MTurk Prime → \"mturk/prolifics\"\n      (NOT \"united states\"), even if the lab is at a US university. Synonyms:\n      USA / U.S. / America → united states; Deutschland → germany;\n      Schweiz / Suisse → switzerland.\n\n      INFO_COST field: DEFAULT TO 0.0. All papers in this meta-analysis have\n      free-reveal information (one click, no charge). Only emit a non-zero\n      value if the paper EXPLICITLY states a monetary cost like \"participants\n      paid 1 ECU to reveal\" or \"€0.10 per click\". Phrases like \"free of\n      charge\", \"no cost\", \"one click\", \"costless reveal\" → 0.0. Do NOT attempt\n      ECU → local currency → 2015 USD PPP conversion unless a non-zero cost\n      is stated.\n\n  user:\n    section_context: \"SECTION: <<SECTION_TITLE>> (<<SECTION_ID>>)\"\n    content: \"<<SECTION_BLOCKS>>\"\n    assets_note: \"ATTACHED <<ASSET_TYPE>> (block <<ASSET_BLOCK>>): <<ASSET_TEXT>>\"\n    instruction: |\n      Extract every target field from the text and any attached asset. For each\n      (Tmt × Ctr) comparison reported in this paper, emit a separate candidate\n      keyed by the cell label \"<Tmt_name> vs <Ctr_name>\". Quote the cell value\n      verbatim in the evidence (e.g., \"Table 2, row 'Hidden information',\n      column 'N selfish'\") with the integer reproduced. If a value is not\n      reported in this section, return \"None\".\n\nstage2:\n  census_system: |\n    You are an aggregator for a willful-ignorance meta-analysis. In\n    this MA, a \"sample\" = a single (Tmt × Ctr) comparison CELL.\n\n    YOUR JOB: enumerate the cells reported in THIS PAPER's candidate\n    extractions below. Emit ONE entry per cell.\n\n    HARD CONSTRAINTS — read carefully:\n\n    1. **GROUND EVERY CELL** in at least ONE candidate's evidence quote. If\n       no candidate names a particular (Tmt, Ctr) pair with direct evidence\n       from this paper, DO NOT enumerate it. You must NOT invent cell names\n       or extrapolate from \"common willful-ignorance patterns\".\n\n    2. **STRICT DEDUPE BY (Tmt, Ctr) PAIR**: candidates may use slightly\n       different wording for the same cell (e.g. \"Hidden information vs\n       Baseline\", \"Hidden information treatment vs Baseline\", \"Hidden info\n       vs Baseline treatment\", \"hidden condition vs transparent condition\").\n       BEFORE emitting any cell, cluster candidate labels by their Tmt-side\n       semantic content (Hidden / Default-NR / Choice-UR etc.) AND their\n       Ctr-side semantic content (Baseline / Transparent / CIG Only).\n       Two labels with the SAME semantic Tmt and SAME semantic Ctr are\n       ONE cell — merge them. Pick the most descriptive label as canonical.\n\n    3. **REJECT CELLS LACKING DIRECT EVIDENCE**: every emitted cell must\n       have at least ONE candidate from the supplied list with that exact\n       (Tmt × Ctr) pair. If the cell only appears in your reasoning, NOT\n       in any candidate's evidence quote, DO NOT emit it. Hallucinated\n       cells are worse than missing ones.\n\n    4. **HOW MANY CELLS TO EMIT (per study)** — derive from the candidates,\n       do NOT default to a fixed count:\n       - Look at all candidate cell labels in your input.\n       - For each distinct (Tmt_name, Ctr_name) pair that has direct\n         evidence, emit ONE cell.\n       - A 2×2 design (e.g. Time-pressure × Hidden vs Transparent) has\n         2 paired cells, not 1.\n       - A multi-Tmt design with N variants of HI sharing one Ctr has N\n         cells.\n       - A multi-Study paper (e.g. \"Study 1\" + \"Study 2\") has cells from\n         BOTH studies — do not collapse to one study_index.\n       - Single-cell papers (most one-experiment papers) have ONE cell.\n       - **When in doubt, prefer ENUMERATION over collapse.** Missing a\n         real cell is worse than emitting an extra one.\n\n    5. **PRIMARY-CELL HEURISTIC for multi-study papers**: if a paper has\n       multiple sub-studies that each report their OWN (Tmt, Ctr) cells\n       (e.g. follow-up experiments on \"Multiple Recipients\", \"Diffusion\n       of Responsibility\", \"Plausible Deniability\"), prefer to emit the\n       primary/baseline study's cell (e.g. \"Hidden payoff vs Baseline\")\n       PLUS any sub-studies that share the same paradigm and use\n       compatible cell encoding. Do not emit sub-studies that use a\n       fundamentally different cell schema (e.g., 2×2 transition cells).\n\n    6. **Output fields per cell**:\n       - study_index: 1 unless the paper has multiple distinct studies\n         that the meta-analysis treats as separate studies.\n       - sample_label: the canonical cell label \"<Tmt_name> vs <Ctr_name>\"\n         using verbatim names from the paper.\n       - total_n: total participants summed across the Tmt and Ctr sides of\n         this cell.\n       - gender: always \"mixed\" (this meta-analysis does not track gender at cell level).\n\n    7. **For within-subject papers**, enumerate ONE cell labeled\n       \"within-subject\" with study_index=1; the actual N counts are 2×2\n       transition cells and may show up as \"None\" in the per-cell\n       N_*_CI_* fields.\n\n    8. **Do NOT enumerate** gender as separate cells. Do NOT enumerate\n       aligned-state cells (this meta-analysis only uses conflict state).\n\n  field_system: |\n    You are a meta-analysis aggregator resolving ONE field across candidate\n    extractions from different sections. For cell-level fields (N_Self_CI_Tmt,\n    N_Self_CI_Ctr, N_Altr_CI_Ctr, N_Tot_CI_Tmt, N_Tot_CI_Ctr), map each\n    candidate to one of the cell keys from the census; sample_key MUST be one\n    of those keys. Cite the candidate indices you relied on in best_indices\n    and explain briefly in reasoning. Follow the VALUE SHAPE instruction\n    exactly.\n\n    SELECTION HEURISTICS (in priority order — apply when candidates conflict):\n    1. If ≥70% of candidates agree on a value, USE THAT VALUE. Outliers\n       (single dissenting candidates) are usually from off-topic sections\n       (Introduction, Discussion, related-work paraphrasing).\n    2. Prefer evidence from Method / Procedure / Results / Sample sections\n       over Introduction / Discussion / Related Work / Appendix sections.\n    3. Prefer numerical evidence quoted from tables over qualitative prose.\n       A candidate that quotes a specific table cell beats a candidate that\n       paraphrases from the body text.\n    4. For numerical fields, sanity-check the value range:\n         - info_cost: 0.0 ≤ value ≤ 10.0 (typical: 0.0). NEVER allow\n           negative values — clamp to 0.0 if needed.\n         - N counts: 0 ≤ value ≤ 1000.\n       Reject candidates whose values violate these ranges.\n    5. NEVER pick an outlier value unless its evidence quote EXPLICITLY\n       overrides the majority (e.g., a methods note saying \"we report N=X\n       here, not Y as cited elsewhere\"). Recency of the section is not\n       a tie-breaker.\n\n    PLACEMENT (be thorough — do NOT silently drop a real value):\n    - Every candidate that has a real (non-null) value MUST be assigned to one\n      of the cell keys. Dropping a real value is a serious error.\n\n    - SHARED CTR REPLICATION: when multiple Tmt cells share one Ctr_name,\n      the Ctr-side N values (N_Self_CI_Ctr, N_Altr_CI_Ctr, N_Tot_CI_Ctr)\n      are REPLICATED across all cells sharing that Ctr. If candidate\n      \"Tmt=A vs Ctr=Baseline\" reports N_Self_CI_Ctr=9 and candidate\n      \"Tmt=B vs Ctr=Baseline\" also reports N_Self_CI_Ctr=9, that's correct.\n\n    - N_Altr_CI_Ctr DERIVATION: if a cell has both N_Tot_CI_Ctr and\n      N_Self_CI_Ctr but no explicit N_Altr_CI_Ctr, derive it via the identity\n      N_Altr_CI_Ctr = N_Tot_CI_Ctr − N_Self_CI_Ctr. Cite the candidate\n      indices of the component values in reasoning.\n\n    - WITHIN-SUBJECT: for cells labeled \"within-subject\", all N_*_CI_*\n      fields should be null (the paper reports transition cells instead).\n      Do not invent values.\n\n    - NO SYNTHESIZED CELL VALUES: only emit a value when at least one\n      candidate provides direct evidence (or when N_Altr_CI_Ctr is derived\n      from both component values with the identity).\n\n  flat_system: |\n    You are a meta-analysis aggregator resolving ONE paper-level field\n    (Design, country, info_cost) from candidate extractions across sections.\n    Choose the single best value for the whole paper and explain briefly in\n    reasoning.\n\n    SELECTION RULES — APPLY IN ORDER, EACH IS BINDING:\n\n    **RULE 1 (MAJORITY VOTE — MANDATORY)**: COUNT the candidate values.\n    If one value has ≥60% of the votes, YOU MUST EMIT THAT VALUE. This\n    rule is NOT optional. Examples:\n      - 8 candidates say \"between-subject\", 3 say \"within-subject\" → 73%\n        majority → EMIT \"between-subject\". Even if the within-subject\n        evidence quotes sound confident, DO NOT override majority.\n      - 6 candidates say \"germany\", 1 says \"switzerland\" → 86% majority\n        → EMIT \"germany\".\n      - 18 candidates say \"0.0\", 0 dissenting → unanimous → EMIT \"0.0\".\n      - If the majority is YOUR OWN INTUITION but the candidates say\n        otherwise, the CANDIDATES WIN. Your job is to summarize the\n        votes, not to second-guess them.\n\n    **RULE 2 (TIE-BREAK by section authority)**: applies ONLY when no\n    value has ≥60% of votes. Prefer evidence from Method / Procedure\n    / Sample / Participants sections over Introduction / Discussion /\n    Related Work / Appendix.\n\n    **RULE 3 (numerical sanity)**: even after rules 1–2, reject any\n    value outside the legal range:\n      - info_cost: 0.0 ≤ value ≤ 10.0; clamp negatives to 0.0.\n      - N counts: 0 ≤ value ≤ 1000.\n\n    **RULE 4 (NO OVERRIDE FROM REASONING)**: you may NOT use your own\n    interpretation of the paper's design / procedure / topic to overturn\n    a majority vote. The candidate extractions are the authoritative\n    signal; your job is to tally them, not to rejudge them. If the\n    candidates are wrong, that is a Stage 1 problem to be addressed\n    upstream, NOT a Stage 2 override opportunity.\n\n    Field-specific notes (apply AFTER rules 1–4):\n    - Design: between-subject if different participants are randomized\n      to different conditions; within-subject if the same participants\n      experience all conditions. When the paper has both elements\n      (e.g. role-swap designs), the headline classification in Methods\n      wins.\n    - country: apply the mturk/prolifics special case ONLY when the\n      paper explicitly states recruitment via Amazon MTurk, Prolific,\n      or CloudResearch. Lab country wins by default.\n    - info_cost: DEFAULT TO 0.0 if no candidate reports a non-zero\n      cost. NEVER emit a negative value — clamp to 0.0.\n\n  gender_shape: |\n    VALUE SHAPE: this is a gender-specific field — for each sample key output\n    a list in the order [total, female, male]; use null for any position not\n    reported. Lists therefore have 3 entries.\n\n    (This meta-analysis has NO gender-specific fields, so this shape is unused.)\n\n  nongender_shape: |\n    VALUE SHAPE: this is NOT a gender-specific field — for each sample key\n    (cell) output a SINGLE-element list, [value]. Do not pad with extra\n    positions or nulls. For paper-level fields (Design, country, info_cost),\n    emit a single scalar value.\n"}, {"group": "Schema & field definitions", "title": "schemas/vu2024/fields.json", "text": "{\n  \"version\": 2,\n  \"meta_analysis\": \"Vu et al. (2024) — Ignorance by Choice meta-analysis (willful ignorance / moral wiggle room)\",\n  \"doi\": \"10.1037/bul0000418\",\n  \"jansen_label\": \"Vu2023\",\n  \"rationale\": \"Schema mirrors Jansen's 6 extracted variables. SCHEMA CONVENTION: 'sample' = a (Tmt × Ctr) comparison cell, so per-cell N_*_CI_* values are stored as object fields keyed by the cell label (e.g., 'Hidden information vs Baseline'). Paper-scope fields (Design, country, info_cost) are flat. Three load-bearing optimizations: (1) info_cost defaults to 0 (all 15 papers free-info); (2) N_Altr_CI_Ctr derived from N_Tot_CI_Ctr - N_Self_CI_Ctr identity; (3) within-subject papers (Exley 2015, Matthey 2011) emit `transitions` block instead of cell counts.\",\n  \"fields\": [\n    {\"name\": \"Design\", \"scope\": \"paper\", \"gender_specific\": false,\n     \"type\": \"enum_or_none\", \"allowed_values\": [\"between-subject\", \"within-subject\"],\n     \"definition\": \"Whether the study used a between-subject design (different participants in FI vs HI) or within-subject design (same participants experience both). Lowercase. Papers using a multiple-choices-within design should be classified as 'within-subject'.\"},\n\n    {\"name\": \"country\", \"scope\": \"paper\", \"gender_specific\": false,\n     \"type\": \"enum_or_none\", \"allowed_values\": [\"germany\", \"mturk/prolifics\", \"norway\", \"switzerland\", \"united states\"],\n     \"definition\": \"Country where the study was conducted. Lowercase. SPECIAL CASE: US-based online panels (MTurk, Prolific, CloudResearch, MTurk Prime) → 'mturk/prolifics' (NOT 'united states'). Synonyms: USA/U.S./America → united states; Deutschland → germany; Schweiz/Suisse → switzerland.\",\n     \"case_rules\": {\"online_panel\": \"MTurk / Prolific / CloudResearch → 'mturk/prolifics'\"}},\n\n    {\"name\": \"info_cost\", \"scope\": \"paper\", \"gender_specific\": false,\n     \"type\": \"number\",\n     \"definition\": \"Cost to acquire information about the recipient's payoff, adjusted to 2015 USD by PPP. DEFAULT TO 0.0 unless the paper EXPLICITLY states a monetary cost (e.g., 'participants paid 1 ECU to reveal'). For all papers in this meta-analysis this is 0.0 (information reveal is FREE, one click). Phrases like 'free of charge', 'no cost', 'one click', 'costless reveal' → 0.0. Do NOT attempt the brittle ECU→USD→PPP conversion unless a non-zero cost is stated.\"},\n\n    {\"name\": \"Sample\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Total participants in this (Tmt × Ctr) comparison cell, summed across both sides. One value per cell key. The cell key (sample_label) is the canonical census identifier — use 'Tmt_name vs Ctr_name' format with verbatim names from the paper (e.g., 'Hidden information vs Baseline', 'Default NR vs Baseline'). This field's primary purpose is to ANCHOR the cell census; the actual cell counts live in N_Self_CI_*, N_Altr_CI_*, N_Tot_CI_* below.\"},\n\n    {\"name\": \"N_Self_CI_Tmt\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Number of SELFISH choices (max-own-payoff option, $6/$1 in Dana 2007, 'option A') in the CONFLICT STATE of the EXPERIMENTAL TREATMENT (Tmt = Hidden Information / HI condition). One value per cell key (Tmt_name vs Ctr_name comparison). Each cell key is a separate 'sample'. For within-subject papers (Exley 2015, Matthey 2011), return 'None' — these report 2×2 transition cells instead.\",\n     \"skills\": [\"vu_cell_terminology\"]},\n\n    {\"name\": \"N_Self_CI_Ctr\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Number of SELFISH choices in the CONFLICT STATE of the CONTROL TREATMENT (Ctr = Full Information / FI / Baseline). One value per cell key. When multiple Tmt rows share one Ctr (e.g., three HI variants all compared against one Baseline), this value is REPLICATED across all cells sharing the same Ctr — that matches the canonical per-cell encoding.\",\n     \"skills\": [\"vu_cell_terminology\"]},\n\n    {\"name\": \"N_Altr_CI_Ctr\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Number of ALTRUISTIC/PROSOCIAL choices (equal-pay or favor-recipient option, $5/$5, 'option B', 'fair choice') in the CONFLICT STATE of the CONTROL TREATMENT. Definitional identity: N_Altr_CI_Ctr = N_Tot_CI_Ctr - N_Self_CI_Ctr. PREFERRED extraction: derive via the identity rather than search the paper for 'N prosocial choices in baseline' (often only reported as a proportion).\",\n     \"skills\": [\"vu_cell_terminology\", \"vu_altr_ctr_identity\"]},\n\n    {\"name\": \"N_Tot_CI_Tmt\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Total participants in the CONFLICT STATE of the EXPERIMENTAL TREATMENT (HI condition). Auxiliary field for sanity checks. Reported as the per-cell 'n =' in tables.\",\n     \"skills\": [\"vu_cell_terminology\"]},\n\n    {\"name\": \"N_Tot_CI_Ctr\", \"scope\": \"sample\", \"gender_specific\": false,\n     \"type\": \"object\", \"items_type\": \"integer\",\n     \"definition\": \"Total participants in the CONFLICT STATE of the CONTROL TREATMENT (FI baseline). Auxiliary field needed to derive N_Altr_CI_Ctr via the identity. Replicated across rows sharing the same Ctr_name.\",\n     \"skills\": [\"vu_cell_terminology\"]}\n  ]\n}\n"}, {"group": "Rules", "title": "rules/vu_altr_ctr_identity/SKILL.md", "text": "---\nname: vu_altr_ctr_identity\ndescription: Derive N_Altr_CI_Ctr from the identity N_Tot_CI_Ctr − N_Self_CI_Ctr rather than searching the paper for an explicit \"N prosocial choices in baseline\" sentence.\nactivates_on:\n  - text_pass\n  - asset_pass\n  - derive\napplies_to:\n  - N_Altr_CI_Ctr\n---\n\nPREFERRED extraction strategy for `N_Altr_CI_Ctr`:\n\nIdentity: `N_Altr_CI_Ctr = N_Tot_CI_Ctr - N_Self_CI_Ctr`\n\nEvery participant in the conflict state of the Ctr condition either chose\nselfishly or altruistically — there is no third option, no missing data. The\nidentity therefore holds EXACTLY for every paper in this meta-analysis.\n\nEXTRACTION ORDER:\n1. First locate `N_Tot_CI_Ctr` — total participants in the conflict state of\n   the Ctr condition. This is usually a clean \"n = …\" in tables, often in the\n   row/column header. Examples:\n     - Dana 2007 Baseline n = 19\n     - Bartling 2014 Baseline n = 27\n     - Lind 2019 Baselline [sic] n = 45\n2. Then locate `N_Self_CI_Ctr` — count of selfish choices. Often reported as a\n   proportion (\"75% chose selfishly\") which must be converted to an integer\n   using `round(prop × N_Tot_CI_Ctr)`.\n3. Derive `N_Altr_CI_Ctr = N_Tot_CI_Ctr − N_Self_CI_Ctr`. Cite the table /\n   evidence rows used to obtain N_Tot and N_Self in `evidence_source` and\n   record the derivation in `inference_reason` (e.g.,\n   \"Derived: 14 = 19 − 5; N_Tot from Table 1 row 'Baseline n', N_Self from\n   Results §3.1 '5 of 19 chose selfishly'\").\n\nWHY NOT FREE-TEXT SEARCH:\nMany papers don't directly report \"N prosocial choices in baseline\" — they\nreport the prosocial rate as a percentage in the Results prose (\"60% chose\nthe prosocial option in baseline\") and leave the count for the reader to\ncompute. A naive prompt would ask the LLM to find an explicit count which is\nwhy their accuracy is 12.9%. The identity-based derivation is exact and\nreproducible.\n\nCROSS-CHECK:\nIf the paper does report an explicit count of prosocial choices, verify that\nit equals N_Tot_CI_Ctr − N_Self_CI_Ctr (within 1 for rounding). If they\ndisagree by more than 1, flag in `warning`.\n"}, {"group": "Rules", "title": "rules/vu_cell_count_localization/SKILL.md", "text": "---\nname: vu_cell_count_localization\ndescription: For cell-level N_*_CI_* fields, the integer to extract is a CELL count from a Results table, NOT a study-level sample size from Methods.\nactivates_on:\n  - text_pass\n  - asset_pass\napplies_to:\n  - N_Self_CI_Tmt\n  - N_Self_CI_Ctr\n  - N_Altr_CI_Ctr\n  - N_Tot_CI_Tmt\n  - N_Tot_CI_Ctr\n---\n\nWHERE TO LOOK for cell counts (in priority order):\n\n1. **PRIMARY SOURCE — a Results-section TABLE** with cell counts per\n   condition. Look for:\n   - Tables with row labels like \"Hidden information\", \"Baseline\", \"Default\n     NR\", \"Choice\", \"HCT vs HC\", etc.\n   - Column headers like \"N(option A)\", \"selfish\", \"altruistic\", \"fair\",\n     \"selfish A\", \"fair B\", \"chose to reveal\", \"n chose A\", \"Choices A\".\n   - When a table reports both selfish and altruistic counts per\n     condition, that is the canonical source.\n\n2. **SECONDARY SOURCE — explicit sentences in Results** quoting exact\n   integers. Examples:\n   - \"Of the 19 dictators in baseline, 5 chose the selfish option.\"\n     → N_Self_CI_Ctr = 5, N_Tot_CI_Ctr = 19, N_Altr_CI_Ctr = 14.\n   - \"In the hidden-payoff condition, 10 of 16 (63%) chose selfish.\"\n     → N_Self_CI_Tmt = 10, N_Tot_CI_Tmt = 16.\n   - \"Out of 20 dictators in the Dictator-Ruler-Hidden condition, the\n     player-X choice was selected 1 time.\"\n     → N_Self_CI_Tmt = 1 (or whichever choice maps to selfish), N_Tot=20.\n\n3. **TERTIARY — derive from percentages WITH N**: when only a percentage\n   is reported AND the total N for that cell is known:\n   - \"75% of dictators chose the selfish option in the conflict state\n     (n = 16)\" → N_Self_CI_Tmt = round(0.75 × 16) = 12.\n   - DO record the derivation in the evidence quote.\n\nNOT A SOURCE — DO NOT extract from:\n\n- **Total-sample N counts** in the Method/Participants section\n  (\"we recruited 100 participants\", \"200 students were paid £5\"). These\n  describe the OVERALL sample, NOT a single cell. Using them for cell-level\n  fields is a common and serious error.\n\n- **Percentages without an integer denominator** (\"75% of dictators chose\n  the selfish option\"). If no N is given, set extract_value=\"None\" and\n  record this in the evidence.\n\n- **Numbers from prior literature reviews** (\"Dana et al. found 5/19\n  chose selfish\"). If the paper is REPORTING someone else's result,\n  do NOT extract — emit \"None\".\n\n- **Numbers in footnotes or robustness checks** unless they are the\n  main reported cell count.\n\nSANITY CHECK before emitting any value:\n- N_Self_CI_Tmt + N_Altr_CI_Tmt should equal N_Tot_CI_Tmt (±1 for\n  rounding). Same for Ctr side.\n- All cell counts must satisfy 0 ≤ N ≤ N_Tot.\n- The cell key (Tmt × Ctr label) in your output MUST match the\n  (Tmt × Ctr) of the table row you extracted from. If the table is\n  for the \"Hidden information\" treatment but the cell key says\n  \"Baseline\", that's a labeling error — fix the key.\n\nCROSS-CHECK: if the paper reports counts in multiple tables (e.g.,\ndescriptive table + results table), prefer the table that explicitly\nreports cell-level counts over a table that reports a single total.\n"}, {"group": "Rules", "title": "rules/vu_cell_terminology/SKILL.md", "text": "---\nname: vu_cell_terminology\ndescription: Translate per-paper Tmt/Ctr names into the canonical HI vs FI / conflict-state axis used by all N_*_CI_* fields.\nactivates_on:\n  - text_pass\n  - asset_pass\napplies_to:\n  - N_Self_CI_Tmt\n  - N_Self_CI_Ctr\n  - N_Altr_CI_Ctr\n  - N_Tot_CI_Tmt\n  - N_Tot_CI_Ctr\n---\n\nCell-extraction terminology (CRITICAL — wrong axis = wrong cell = wrong number).\n\nVARIABLE DECOMPOSITION:\n- `N_<choice>_CI_<treatment>`: the `_CI_` infix means CONFLICT STATE (the cell\n  where the dictator's selfish option harms the recipient — $6/$1 in Dana 2007).\n  The OPPOSITE is `_AI_` (aligned state, $5/$5) — NOT extracted in this MA.\n- `<choice>` = `Self` (selfish, max-own-payoff, $6/$1, \"option A\") or `Altr`\n  (altruistic/prosocial, $5/$5, \"option B\") or `Tot` (total).\n- `<treatment>` = `Tmt` (Hidden Information / HI / EXPERIMENTAL) or `Ctr`\n  (Full Information / FI / CONTROL / BASELINE).\n\nTMT vs CTR ASSIGNMENT (the most common source of mis-extraction):\n- `Tmt` is ALWAYS the **Hidden Information** condition (the manipulation of\n  interest). NEVER the baseline.\n- `Ctr` is ALWAYS the **Full Information** condition (the visible-payoffs\n  baseline). NEVER the manipulation.\n\nCommon paper-side names you must MAP to Tmt (HI):\n  \"Hidden information\", \"Hidden payoff\", \"Non-transparent\", \"Hidden – conflict\",\n  \"Hidden – time pressure\", \"Period 2\" (Matthey & Regner 2011),\n  \"Default NR\" / \"Default R\" / \"Active choice\" (Grossman 2014's 3 HI variants\n  all share one Baseline), \"Choice\" / \"Choice-UR\" / \"Choice-H\" (Conrads 2013's\n  3 HI variants), \"Reveal bonus\" (Grossman 2014 paid-reveal variant),\n  \"Dictator – Ruler – Hidden\" (Cerrone & Engel 2019).\n\nCommon paper-side names you must MAP to Ctr (FI baseline):\n  \"Baseline\", \"Transparent\", \"Known information\", \"Revealed state\",\n  \"Standard dictator\", \"Standard dictator game\", \"CIG Only\", \"Period 1\",\n  \"Control\", \"Open\", \"Public payoffs\", \"Dictator – Ruler\" (Cerrone & Engel).\n\nCHOICE TYPES:\n- \"Selfish choice\" = the option that MAXIMIZES the dictator's payoff at the\n  recipient's expense. Synonyms: \"option A\", \"$6/$1\", \"selfish option\",\n  \"self-interested choice\", \"X option\", \"self-serving choice\".\n- \"Altruistic\" / \"prosocial choice\" = the option that EQUALIZES or FAVORS the\n  recipient. Synonyms: \"option B\", \"$5/$5\", \"prosocial option\", \"fair choice\",\n  \"Y option\".\n\nSHARED CTR REPLICATION (Grossman 2014, Lind 2019, Conrads 2013, Kappes 2018):\nWhen the same paper reports MULTIPLE Tmt variants all compared against ONE\nshared Ctr (e.g., Grossman 2014 has Default-NR / Active / Default-R all vs\nBaseline), each (Tmt × Ctr) pair is a separate cell. The Ctr-side N values\nare REPLICATED across all cells sharing the same Ctr_name — that matches\nthe canonical per-cell encoding. Extract the Ctr-side value ONCE and replicate.\n\nCELL KEYS (sample_label) — write as \"<Tmt_name> vs <Ctr_name>\", e.g.:\n  \"Hidden information vs Baseline\"\n  \"Default NR vs Baseline\"\n  \"Default R vs Baseline\"\n  \"Active choice vs Baseline\"\n  \"Hidden info 1 vs Known information 1\"\n  \"Choice vs Transparency\"\n  \"Period 2 vs Period 1\" (within-subject — see vu_within_subject)\n\nALWAYS extract integers — never proportions. If the paper reports \"50% of\nn=40 chose selfishly\", emit N_Self = 20. Quote the cell value verbatim in the\nevidence (e.g., \"Table 2, row 'Hidden information', column 'N selfish'\") with\nthe integer reproduced.\n"}, {"group": "Rules", "title": "rules/vu_country_mturk/SKILL.md", "text": "---\nname: vu_country_mturk\ndescription: Map US-based online panels (MTurk, Prolific, CloudResearch) to \"mturk/prolifics\" rather than \"united states\"; apply country synonyms.\nactivates_on:\n  - text_pass\n  - asset_pass\napplies_to:\n  - country\n---\n\n`country` enum is constrained to 5 lowercase values:\n  `germany`, `mturk/prolifics`, `norway`, `switzerland`, `united states`\n\nDECISION TREE:\n1. Was the study run on Amazon Mechanical Turk, Prolific (Academic),\n   CloudResearch, or any US-based online panel? → `mturk/prolifics`\n2. Lab/university in the United States (other than MTurk-style online)? →\n   `united states`\n3. Lab in Germany or Deutschland? → `germany`\n4. Lab in Switzerland / Schweiz / Suisse / Svizzera? → `switzerland`\n5. Lab in Norway / Norge? → `norway`\n\nONLINE-PANEL KEYWORDS that trigger `mturk/prolifics`:\n  \"Amazon Mechanical Turk\", \"MTurk\", \"Mechanical Turk\", \"Prolific\",\n  \"Prolific Academic\", \"CloudResearch\", \"MTurk Prime\"\n\nSYNONYMS:\n  `united states`: USA, U.S., U.S.A., United States of America, US, America,\n                   American\n  `germany`:       Deutschland\n  `switzerland`:   Schweiz, Suisse, Svizzera\n\nEXAMPLES from included papers:\n  - Dana 2007 (Carnegie Mellon lab) → united states\n  - Bartling 2014 (Zurich) → switzerland\n  - Cerrone & Engel 2019 (Bonn) → germany\n  - Exley & Kessler 2020 (Harvard, but MTurk recruitment) → mturk/prolifics\n  - Kappes 2018 (Crockett Oxford lab, but MTurk recruitment) → mturk/prolifics\n  - Lind 2019 (Oslo) → norway\n\nCAUTION: a US university lab that runs MTurk recruitment counts as\n`mturk/prolifics`, NOT `united states` — the determining factor is the\nrecruitment platform, not the lab location.\n\nCountries NOT in the enum (papers conducted in other countries are excluded\nfrom this analysis):\n  - Netherlands — emit \"None\" if you see this\n  - France — emit \"None\" if you see this\n"}, {"group": "Rules", "title": "rules/vu_info_cost_default/SKILL.md", "text": "---\nname: vu_info_cost_default\ndescription: Default info_cost to 0.0; only attempt PPP conversion if a non-zero monetary cost is explicitly stated. All papers in this meta-analysis have free reveal.\nactivates_on:\n  - text_pass\n  - asset_pass\n  - derive\napplies_to:\n  - info_cost\n---\n\n`info_cost` extraction rule:\n\nFor ALL papers in this meta-analysis, the cost to acquire information about\nthe recipient's payoff is **0.0 (FREE REVEAL)**. Verified across the entire\ncanonical encoding.\n\nEXTRACTION DEFAULT: `0.0`\n\nONLY emit a non-zero value if the paper EXPLICITLY states a monetary cost,\ne.g.:\n  - \"Participants paid 1 ECU to reveal the recipient payoff\"\n  - \"Information was costly to learn (€0.10 per click)\"\n  - \"Subjects who chose to know paid 5 cents\"\n\nPhrases that confirm the 0.0 default:\n  - \"free of charge\"\n  - \"at no cost\"\n  - \"one click reveal\"\n  - \"costless reveal\"\n  - \"could be revealed for free\"\n  - \"no fee\"\n  - \"free to look up\"\n  - silence on cost in the design description (zero-cost is the Dana 2007\n    paradigm default; if the paper doesn't say otherwise, info is free)\n\nDO NOT attempt the ECU → local currency → 2015 USD → PPP conversion chain\nunless a non-zero cost is stated. The brittle multi-step conversion is what\nmade naive prompts fail repeatedly on this variable for a corpus where\nthe gold value is exactly 0 for all included papers.\n\nIf a non-zero cost IS stated, follow this conversion:\n  1. Extract raw cost + currency / unit (e.g., \"1 ECU\" or \"€0.10\")\n  2. If experimental currency (ECU), multiply by stated exchange rate to get\n     local currency\n  3. Multiply by stated PPP factor (or look up from OECD PPP tables for the\n     year stated)\n  4. Convert to 2015 USD using inflation factor (CPI ratio)\n  Report each step in `inference_reason`.\n"}, {"group": "Rules", "title": "rules/vu2024/cell_terminology.yaml", "text": "# Vu 2024 — cell terminology glossary\n# =======================================\n# Translates the variable Tmt_name / Ctr_name labels used in the 15 willful-\n# ignorance papers to Vu's canonical Hidden-Info (HI/Tmt) vs Full-Info (FI/Ctr)\n# axis. Used by the extractor to identify which condition is the \"experimental\n# treatment\" and which is the \"control\" — Jansen's #1 source of failure\n# (selecting the wrong cell as Tmt).\n\n# Conceptual axes\naxes:\n  state:\n    label: \"Underlying payoff state\"\n    values:\n      CI:\n        full: \"Conflict state (Conflict of Interests)\"\n        meaning: >\n          Dictator and recipient interests are MISALIGNED — the selfish option\n          ($6/$1 in Dana 2007) helps the dictator and hurts the recipient.\n          This is the cell we extract counts from.\n        synonyms:\n          - \"conflict game\"\n          - \"conflict condition\"\n          - \"asymmetric payoff\"\n          - \"conflicting interests\"\n          - \"$6/$1 cell\"\n          - \"payoff state 1\"\n          - \"state B\"\n          - \"non-aligned state\"\n      AI:\n        full: \"Aligned state\"\n        meaning: >\n          Dictator and recipient interests are ALIGNED — the selfish option is\n          also best for the recipient. Not extracted by Jansen.\n        synonyms:\n          - \"aligned game\"\n          - \"non-conflict\"\n          - \"common interest\"\n          - \"$5/$5 cell\"\n          - \"symmetric payoff\"\n          - \"state A\"\n\n  information:\n    label: \"Information visibility\"\n    values:\n      FI:\n        full: \"Full Information (CONTROL)\"\n        meaning: >\n          Recipient payoffs are visible from the start. This is the BASELINE\n          condition. Always the Ctr_name side.\n        synonyms:\n          - \"Baseline\"\n          - \"Transparent\"\n          - \"Known information\"\n          - \"Revealed state\"\n          - \"Standard dictator\"\n          - \"Standard dictator game\"\n          - \"CIG Only\"\n          - \"Period 1\"\n          - \"Control\"\n          - \"Open\"\n          - \"Public payoffs\"\n      HI:\n        full: \"Hidden Information (EXPERIMENTAL TREATMENT)\"\n        meaning: >\n          Recipient payoffs are CONCEALED by default but can be revealed (usually\n          for free, one click). This is the MANIPULATION OF INTEREST. Always\n          the Tmt_name side.\n        synonyms:\n          - \"Hidden payoff\"\n          - \"Hidden information\"\n          - \"Non-transparent\"\n          - \"Hidden – conflict\"\n          - \"Hidden – time pressure\"\n          - \"Default NR\"        # Grossman 2014 — no reveal default\n          - \"Default R\"         # Grossman 2014 — reveal default\n          - \"Active choice\"     # Grossman 2014 — neither default\n          - \"Choice\"            # Conrads 2013\n          - \"Choice-UR\"         # Conrads 2013 (Unknown Recipient)\n          - \"Choice-H\"          # Conrads 2013 (Hidden version)\n          - \"Period 2\"          # Matthey & Regner 2011\n          - \"Reveal bonus\"      # Grossman 2014 variant — paid 0.10 to reveal\n          - \"Dictator – Ruler – Hidden\"  # Cerrone & Engel 2019\n\n  choice:\n    label: \"Dictator's choice\"\n    values:\n      Self:\n        full: \"Selfish choice\"\n        meaning: >\n          The option that MAXIMIZES the dictator's payoff at the recipient's\n          expense. The $6/$1 option in Dana 2007 (option A in most papers).\n        synonyms:\n          - \"option A\"\n          - \"$6/$1\"\n          - \"selfish option\"\n          - \"self-interested choice\"\n          - \"X option\"\n          - \"decision that prioritized own benefit\"\n          - \"self-serving choice\"\n      Altr:\n        full: \"Altruistic / prosocial choice\"\n        meaning: >\n          The option that EQUALIZES or FAVORS the recipient. The $5/$5 option\n          in Dana 2007 (option B in most papers).\n        synonyms:\n          - \"option B\"\n          - \"$5/$5\"\n          - \"prosocial option\"\n          - \"fair choice\"\n          - \"Y option\"\n          - \"decision that prioritized welfare of the recipient\"\n          - \"altruistic option\"\n\n# Variable composition\nvariables:\n  N_Self_CI_Tmt:\n    composition: \"Number of (Selfish) choices in the (Conflict) state of the (Hidden-Information/Tmt) condition\"\n    short: \"Selfish choices in HI conflict cell\"\n\n  N_Self_CI_Ctr:\n    composition: \"Number of (Selfish) choices in the (Conflict) state of the (Full-Information/Ctr) condition\"\n    short: \"Selfish choices in FI baseline conflict cell\"\n\n  N_Altr_CI_Ctr:\n    composition: \"Number of (Altruistic) choices in the (Conflict) state of the (Full-Information/Ctr) condition\"\n    short: \"Altruistic choices in FI baseline conflict cell\"\n    derived: true\n    formula: \"N_Tot_CI_Ctr - N_Self_CI_Ctr\"\n\n  N_Tot_CI_Tmt:\n    composition: \"Total participants in the (Conflict) state of the (Tmt) condition\"\n\n  N_Tot_CI_Ctr:\n    composition: \"Total participants in the (Conflict) state of the (Ctr) condition\"\n\n# Critical extraction rules\nrules:\n  - rule_id: \"tmt_vs_ctr_assignment\"\n    text: >\n      The EXPERIMENTAL treatment (Tmt) is ALWAYS the Hidden Information\n      manipulation, never the Full Information baseline. If a paper has\n      multiple HI variants (e.g., Grossman 2014: Default NR / Active choice /\n      Default R), each becomes its own cell, all compared against the same\n      Baseline Ctr.\n\n  - rule_id: \"shared_ctr_replication\"\n    text: >\n      When N Tmt rows in a single paper share ONE Ctr_name (e.g., Grossman 2014\n      has 3 Tmts vs 1 Baseline), the Ctr-side N values are REPLICATED across\n      rows in WI_meta.csv. Extractor must not double-count: extract Ctr-side\n      values once per Ctr_name and copy across all cells that share it.\n\n  - rule_id: \"within_subject_nullify_N\"\n    text: >\n      For within-subject papers (Exley 2015, Matthey & Regner 2011, Soraperra\n      2020), the N_*_CI_* fields are NA in WI_meta.csv. Schema emits cells: []\n      and stores transition counts in transitions: {N_Self_Self, N_Self_Altr,\n      N_Altr_Self, N_Altr_Altr} instead. Likely matches Jansen's NA gold.\n\n  - rule_id: \"altr_ctr_identity\"\n    text: >\n      N_Altr_CI_Ctr = N_Tot_CI_Ctr - N_Self_CI_Ctr is an exact identity for\n      every paper Vu coded. PREFERRED extraction: derive via this formula\n      rather than search the paper for \"N prosocial choices in baseline\"\n      (which is often reported only as a proportion).\n\n  - rule_id: \"cell_count_sanity\"\n    text: >\n      Per cell: N_Self_CI_Tmt + N_Altr_CI_Tmt == N_Tot_CI_Tmt; same for Ctr.\n      Flag any extraction violating this.\n\n  - rule_id: \"info_cost_default_zero\"\n    text: >\n      For all 15 Jansen-included papers info_cost = 0.0 (information is FREE).\n      Default to 0.0 unless paper explicitly states a monetary cost. Do NOT\n      attempt ECU→USD→PPP conversion otherwise — the brittle multi-step prompt\n      is solving a problem that doesn't exist in this corpus.\n\n# Per-paper Tmt_name and Ctr_name labels (from WI_meta.csv)\n# Use these to disambiguate which condition is which when reading the paper.\nper_paper_labels:\n  Bartling2014:    {tmt: [\"Hidden information\"],                              ctr: [\"Baseline\"]}\n  Cerrone2019:     {tmt: [\"Dictator – Ruler – Hidden\"],                       ctr: [\"Dictator – Ruler\"]}\n  Conrads2013:     {tmt: [\"Choice\", \"Choice-UR\", \"Choice-H\"],                 ctr: [\"Transparency\"]}\n  Dana2007:        {tmt: [\"Hidden payoff\"],                                   ctr: [\"Baseline\"]}\n  Exley2015:       {tmt: [\"within-subject HI\"],                               ctr: [\"Revealed state\"]}      # within-subject\n  Exley2021:       {tmt: [\"Hidden info 1\", \"Hidden info 2\", \"Hidden info 3\"], ctr: [\"Known information 1\", \"Known information 2\", \"Known information 3\"]}\n  Grossman2014:    {tmt: [\"Default NR\", \"Active choice\", \"Default R\"],        ctr: [\"Baseline\"]}            # all share Baseline\n  Grossman2017:    {tmt: [\"Hidden information\", \"Reveal bonus\"],              ctr: [\"CIG Only\"]}\n  Jarke-Neuert2022: {tmt: [\"Hidden-no-time-pressure\", \"Hidden-time-pressure\"], ctr: [\"Transparent – no time pressure\", \"Transparent – time pressure\"]}\n  Kappes2018:      {tmt: [\"S1 Uncertain\", \"S1 Low income\", \"S1 High income\", \"S1 Control\",\n                          \"S2 Uncertain\", \"S2 Low\", \"S2 High\"],               ctr: [\"S1 Outcome Certainty\", \"S2 Standard dictator\"]}\n  Larson2009:      {tmt: [\"Non-transparent – conflict\"],                      ctr: [\"Transparent\"]}\n  Lind2019:        {tmt: [\"Hidden\", \"Hypothetical\", \"Stranger\", \"Partner\"],   ctr: [\"Baselline\"]}            # sic in WI_meta\n  Matthey2011:     {tmt: [\"Period 2\"],                                        ctr: [\"Period 1\"]}            # within-subject\n  Moradi2018:      {tmt: [\"Before\", \"Conflict-Before\"],                       ctr: [\"Baseline\"]}\n  Stuber2019:      {tmt: [\"Hidden information\"],                              ctr: [\"Baseline\"]}\n"}, {"group": "Rules", "title": "rules/vu2024/country_mapping.yaml", "text": "# Vu 2024 — country normalization rules\n# =========================================\n# Jansen's gold has 5 country values; \"mturk/prolifics\" is NOT a country, it's\n# an online-panel identifier.\n\nallowed_values:\n  - germany\n  - mturk/prolifics\n  - norway\n  - switzerland\n  - united states\n\ndecision_tree:\n  - check: \"Was the study run on Amazon MTurk, Prolific (Academic), CloudResearch, or any US-based online panel?\"\n    if_yes: \"mturk/prolifics\"\n  - check: \"Is the lab/university in the United States (other than MTurk-style online)?\"\n    if_yes: \"united states\"\n  - check: \"Lab in Germany or Deutschland?\"\n    if_yes: \"germany\"\n  - check: \"Lab in Switzerland or Schweiz or Suisse?\"\n    if_yes: \"switzerland\"\n  - check: \"Lab in Norway or Norge?\"\n    if_yes: \"norway\"\n\nsynonyms:\n  united states: [\"USA\", \"U.S.\", \"U.S.A.\", \"United States of America\", \"US\", \"America\", \"American\"]\n  germany:       [\"Deutschland\"]\n  switzerland:   [\"Schweiz\", \"Suisse\", \"Svizzera\"]\n\nonline_panel_keywords:\n  - \"Amazon Mechanical Turk\"\n  - \"MTurk\"\n  - \"Mechanical Turk\"\n  - \"Prolific\"\n  - \"Prolific Academic\"\n  - \"CloudResearch\"\n  - \"MTurk Prime\"\n\n# Per-paper assignments (from WI_meta.csv)\nper_paper:\n  Bartling2014:     switzerland\n  Cerrone2019:      germany\n  Conrads2013:      germany\n  Dana2007:         united states\n  Exley2015:        united states\n  Exley2021:        mturk/prolifics   # Harvard MTurk panel\n  Grossman2014:     united states     # UCSB\n  Grossman2017:     united states     # UCSB / van der Weele (Amsterdam, but study run on US sample)\n  Jarke-Neuert2022: germany\n  Kappes2018:       mturk/prolifics   # Crockett lab Oxford, MTurk recruitment\n  Larson2009:       united states\n  Lind2019:         norway\n  Matthey2011:      germany\n  Moradi2018:       germany\n  Stuber2019:       germany\n\nexcluded_from_jansen_15:\n  Pace2020:         netherlands       # not in Jansen's 5-value enum → excluded\n  Soraperra2020:    france            # not in Jansen's 5-value enum → excluded\n"}, {"group": "Ground-truth mapping", "title": "eval/vu2024/groundtruth_map.yaml", "text": "# Vu 2024 — ground-truth validator mapping\n# ================================================\n# Maps schema output → Jansen d_long.xlsx rows. Vu is the HARDEST bench in\n# Jansen: overall 33.6%, with 3 of 6 vars under 25%.\n\ngold_source:\n  file: \"/projects/code/meta_analysis_agent/Jansen2025/osfstorage-archive/Archive/analysis/d_long.xlsx\"\n  filter: \"meta == 'Vu2023'\"\n  rows: 1008\n  studies: 15                       # subset of Vu's 22; see studies_in_jansen below\n  variables: [\"Design\", \"country\", \"info_cost\", \"N_Self_CI_Tmt\", \"N_Self_CI_Ctr\", \"N_Altr_CI_Ctr\"]\n  expected_rows_per_var:\n    Design:        120              # 15 × 1 × 8\n    country:       120              # 15 × 1 × 8\n    info_cost:     120              # 15 × 1 × 8\n    N_Self_CI_Tmt: 264              # 15 × ~2.2 × 8\n    N_Self_CI_Ctr: 192              # 15 × ~1.6 × 8\n    N_Altr_CI_Ctr: 192              # 15 × ~1.6 × 8\n\nstudies_in_jansen:\n  - Bartling2014\n  - Cerrone2019\n  - Conrads2013\n  - Dana2007\n  - Exley2015                       # within-subject — N_*_CI_* should be NA\n  - Exley2021                       # = Exley & Kessler 2020 working paper\n  - Grossman2014\n  - Grossman2017\n  - Jarke-Neuert2022                # = Jarke-Neuert & Lohse 2020\n  - Kappes2018\n  - Larson2009\n  - Lind2019\n  - Matthey2011                     # within-subject — N_*_CI_* should be NA\n  - Moradi2018\n  - Stuber2019                      # = Stüber 2020 working-paper year\n# Excluded from Jansen-15: Pace2020 (Netherlands), Soraperra2020 (France),\n# plus 5 multi-choice papers Feiler 2014, Felgendreher 2018, Momsen 2019/2020/2020V\n\nmappings:\n\n  Design:\n    schema_path: \"$.Design\"\n    schema_type: \"enum_str\"\n    gold_var: \"Design\"\n    join_keys: [\"study\"]\n    comparison: \"string_exact_lowercase\"\n    allowed_values: [\"between-subject\", \"within-subject\"]\n    expected_per_study: 1\n\n  country:\n    schema_path: \"$.country\"\n    schema_type: \"enum_str\"\n    gold_var: \"country\"\n    join_keys: [\"study\"]\n    comparison: \"string_exact_lowercase\"\n    allowed_values: [\"germany\", \"mturk/prolifics\", \"norway\", \"switzerland\", \"united states\"]\n    expected_per_study: 1\n\n  info_cost:\n    schema_path: \"$.info_cost\"\n    schema_type: \"float\"\n    gold_var: \"info_cost\"\n    join_keys: [\"study\"]\n    comparison: \"numeric_tolerance\"\n    tolerance: 0.01\n    expected_per_study: 1\n    default_value: 0.0\n    notes: |\n      All 15 Jansen-included papers have info_cost = 0 in the gold. Schema\n      defaults to 0.0. Lift expected: 24% → ~95%.\n\n  N_Self_CI_Tmt:\n    schema_path: \"$.cells[*].N_Self_CI_Tmt\"\n    schema_type: \"list[int]\"\n    gold_var: \"N_Self_CI_Tmt\"\n    join_keys: [\"study\"]\n    comparison: \"list_set_match\"     # order doesn't matter, multiset\n    expected_per_study: \"1-8 (multi-Tmt papers)\"\n    notes: |\n      For within-subject papers (Exley2015, Matthey2011), gold is NA. Schema\n      emits cells: [] → validator treats as match.\n      Lift expected: 10.7% → ~70%.\n\n  N_Self_CI_Ctr:\n    schema_path: \"$.cells[*].N_Self_CI_Ctr\"\n    schema_type: \"list[int]\"\n    gold_var: \"N_Self_CI_Ctr\"\n    join_keys: [\"study\"]\n    comparison: \"list_set_match\"\n    expected_per_study: \"1-8 (replicated across rows that share one Ctr)\"\n    notes: |\n      Schema replicates the same N_Self_CI_Ctr value across cells that share\n      one Ctr_name, matching d_long's row-per-cell encoding.\n      Lift expected: 22.1% → ~75%.\n\n  N_Altr_CI_Ctr:\n    schema_path: \"$.cells[*].N_Altr_CI_Ctr\"\n    schema_type: \"list[int]\"\n    gold_var: \"N_Altr_CI_Ctr\"\n    join_keys: [\"study\"]\n    comparison: \"list_set_match\"\n    expected_per_study: \"1-8\"\n    notes: |\n      Derived via N_Tot_CI_Ctr - N_Self_CI_Ctr. Validator additionally checks\n      identity holds. Lift expected: 12.9% → ~70%.\n\n# Within-subject special handling\nwithin_subject_studies: [Exley2015, Matthey2011]\nwithin_subject_rule: |\n  For these studies, all N_*_CI_* gold values are NA. Our schema sets cells: []\n  and emits transitions: { N_Self_Self, N_Self_Altr, N_Altr_Self, N_Altr_Altr }.\n  Validator treats cells: [] as matching NA gold.\n\n# Aggregate metrics\nmetrics_to_report:\n  - per_variable_accuracy\n  - per_variable_f1\n  - per_variable_precision\n  - per_variable_recall\n  - per_variable_cohens_kappa\n  - per_study_full_match_rate\n  - overall_correct_pct\n\njansen_baseline_pct:\n  Design:         82.2\n  country:        85.7\n  info_cost:      24.0\n  N_Self_CI_Tmt:  10.7\n  N_Self_CI_Ctr:  22.1\n  N_Altr_CI_Ctr:  12.9\n  overall:        33.6\n\nour_targets_pct:\n  Design:         95.0      # simple enum\n  country:        90.0      # mturk-special rule\n  info_cost:      95.0      # default 0\n  N_Self_CI_Tmt:  70.0      # cell-structured schema + table PNG multimodal\n  N_Self_CI_Ctr:  75.0      # ditto, with shared-Ctr replication\n  N_Altr_CI_Ctr:  70.0      # derived from identity\n  overall:        80.0\n"}]};
const fields = DATA.fields;
const evald = new Set(DATA.evaluated_fields);
const papers = DATA.papers;
const byId = {}; papers.forEach(p => byId[p.id] = p);
let pinned = null;
let std = 'strict';

// klass -> outcome under each standard
const STD = {
  strict:  {exact:'correct', contains:'incorrect (partial)', wrong:'incorrect', missing:'missing'},
  widened: {exact:'correct', contains:'correct',             wrong:'incorrect', missing:'missing'},
};

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function pct(x){ return (x*100).toFixed(1)+'%'; }
function f3(x){ return x.toFixed(3); }

document.getElementById('title').textContent = DATA.ma_name + " — reference vs extracted";
document.getElementById('subtitle').textContent =
  "Gold: " + DATA.gold_label + " · " + papers.length + " papers · ★ = scored field · metric = revision paper CED/IED/MD";

// ---- assets panel ----
(function(){
  const groups = {};
  (DATA.assets||[]).forEach(a => { (groups[a.group] = groups[a.group] || []).push(a); });
  const order = ["Prompts","Schema & field definitions","Rules","Ground-truth mapping"];
  const body = document.getElementById('assetsBody');
  let html = '';
  for (const g of order) {
    const items = groups[g]; if (!items) continue;
    html += `<div class="asset-group"><div class="gh">${esc(g)}</div>`;
    for (const a of items) {
      html += `<div class="asset"><details><summary>${esc(a.title)}</summary><pre>${esc(a.text)}</pre></details></div>`;
    }
    html += `</div>`;
  }
  body.innerHTML = html || '<em>No assets found.</em>';
})();

// ---- metric panels ----
function renderPanel(elId, label, sub){
  const el = document.getElementById(elId);
  const key = elId === 'panelStrict' ? 'strict' : 'widened';
  const o = DATA.summary.overall[key];
  let h = `<h3>${label} <span class="tag">— ${sub}</span></h3>`;
  h += `<div class="bigrow">
    <div class="big"><b>${f3(o.f1)}</b><span>F1</span></div>
    <div class="big"><b>${f3(o.precision)}</b><span>Precision</span></div>
    <div class="big"><b>${f3(o.recall)}</b><span>Recall</span></div>
    <div class="big"><b>${pct(o.accuracy)}</b><span>Accuracy</span></div>
  </div>`;
  h += `<div class="counts">CED ${o.ced} · IED ${o.ied} · MD ${o.md} &nbsp;(${o.ced+o.ied+o.md} scored data points)</div>`;
  h += `<table class="fm"><thead><tr><th>field</th><th>P</th><th>R</th><th>F1</th><th>Acc</th></tr></thead><tbody>`;
  for (const f of DATA.evaluated_fields) {
    const m = DATA.summary.per_field[f][key];
    h += `<tr><td>${esc(f)}</td><td>${f3(m.precision)}</td><td>${f3(m.recall)}</td><td>${f3(m.f1)}</td><td>${pct(m.accuracy)}</td></tr>`;
  }
  h += `</tbody></table>`;
  el.innerHTML = h;
}
renderPanel('panelStrict', 'Strict', 'exact match only');
renderPanel('panelWidened', 'Widened', 'reference within extraction = match');

function markActivePanel(){
  document.getElementById('panelStrict').classList.toggle('active', std==='strict');
  document.getElementById('panelWidened').classList.toggle('active', std==='widened');
}

// ---- cell color ----
function cellColor(klass){
  if (!klass || klass==='neutral') return 'neutral';
  if (klass==='exact') return 'full';
  if (klass==='contains') return std==='widened' ? 'full' : 'partial';
  return 'none'; // wrong | missing
}

function renderCell(cell){
  if (!cell || cell.kind === 'empty') return '<span class="empty-val">(empty)</span>';
  if (cell.kind === 'scalar') return esc(cell.text);
  return cell.rows.map(([label, vals]) =>
    `<div class="sub"><span class="sub-h">${esc(label)}:</span> ${vals.map(esc).join(', ')}</div>`).join('');
}

// ---- tooltip ----
const tt = document.getElementById('tooltip');
function showTip(pid, field, x, y){
  const cell = byId[pid].cells[field];
  if (!cell) { tt.style.display='none'; return; }
  const k = cell.klass || 'neutral';
  let h = `<div class="tt-row"><span class="tt-label">${esc(pid)}</span> · ${esc(field)} <span class="tt-klass">${k}</span></div>`;
  if (k !== 'neutral') {
    h += `<div class="tt-std">strict: <b>${STD.strict[k]}</b> &nbsp;·&nbsp; widened: <b>${STD.widened[k]}</b></div>`;
  }
  if (cell.gold != null) {
    h += `<div class="tt-gold"><span class="tt-label">reference:</span> ${esc(cell.gold)}`;
    if (cell.gold_source) h += `<div class="tt-src">source: ${esc(cell.gold_source)}</div>`;
    h += `</div>`;
  } else {
    h += `<div class="tt-gold tt-src">no reference value (unscored)</div>`;
  }
  if (cell.evidence && cell.evidence.length) {
    h += `<div class="tt-ev"><span class="tt-label">evidence (${cell.evidence.length}):</span>`;
    for (const e of cell.evidence) {
      const loc = [e.sample, e.section, (e.page!=null?('p.'+e.page):null)].filter(Boolean).map(esc).join(' · ');
      h += `<div style="margin-top:4px"><div class="q">“${esc(e.quote)}”</div>${loc?`<div class="meta">${loc}</div>`:''}</div>`;
    }
    h += `</div>`;
  }
  tt.innerHTML = h; tt.style.display='block';
  const r = tt.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  let left=x+12, top=y+12;
  if (left+r.width>vw-10) left=x-r.width-12;
  if (top+r.height>vh-10) top=y-r.height-12;
  tt.style.left=Math.max(10,left)+'px'; tt.style.top=Math.max(10,top)+'px';
}
function hideTip(){ tt.style.display='none'; tt.classList.remove('pinned'); }

// ---- table ----
function buildTable(visible){
  const hr = document.getElementById('headerRow');
  hr.innerHTML = '<th>Paper</th>' + fields.map(f => `<th class="${evald.has(f)?'evald':''}" title="${esc(f)}">${esc(f)}</th>`).join('');
  const rows = visible.map(pid => {
    const p = byId[pid];
    let tr = `<tr><td title="${esc(pid)}">${esc(pid)}</td>`;
    for (const f of fields) {
      const cell = p.cells[f];
      tr += `<td><div class="cell ${cellColor(cell&&cell.klass)}" data-p="${esc(pid)}" data-f="${esc(f)}">${renderCell(cell)}</div></td>`;
    }
    return tr + '</tr>';
  });
  document.getElementById('tableBody').innerHTML = rows.join('');
  document.getElementById('paperCount').textContent = visible.length + ' papers';
  document.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('mouseenter', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mousemove', e => { if(!pinned) showTip(c.dataset.p, c.dataset.f, e.clientX, e.clientY); });
    c.addEventListener('mouseleave', () => { if(!pinned) hideTip(); });
    c.addEventListener('click', e => {
      e.stopPropagation();
      const same = pinned && pinned.p===c.dataset.p && pinned.f===c.dataset.f;
      document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
      if (same) { pinned=null; hideTip(); }
      else { pinned={p:c.dataset.p,f:c.dataset.f}; c.classList.add('pinned'); showTip(c.dataset.p,c.dataset.f,e.clientX,e.clientY); tt.classList.add('pinned'); }
    });
  });
}
document.addEventListener('click', e => {
  if (pinned && !e.target.closest('.cell') && !e.target.closest('.tooltip')) {
    pinned=null; hideTip(); document.querySelectorAll('.cell.pinned').forEach(b=>b.classList.remove('pinned'));
  }
});

const viewMode=document.getElementById('viewMode'), paperSelect=document.getElementById('paperSelect'), searchBox=document.getElementById('searchBox');
papers.forEach(p => { const o=document.createElement('option'); o.value=p.id; o.textContent=p.id; paperSelect.appendChild(o); });
function refresh(){
  const search=searchBox.value.trim().toLowerCase();
  let vis;
  if (viewMode.value==='single'){ paperSelect.style.display=''; vis=[paperSelect.value]; }
  else { paperSelect.style.display='none'; vis=papers.map(p=>p.id); }
  if (search) vis=vis.filter(id=>id.toLowerCase().includes(search));
  pinned=null; hideTip(); buildTable(vis);
}
viewMode.onchange=refresh; paperSelect.onchange=refresh; searchBox.oninput=refresh;
document.querySelectorAll('input[name=std]').forEach(r => r.addEventListener('change', e => {
  std = e.target.value; markActivePanel(); refresh();
}));

markActivePanel();
refresh();
</script>
</body>
</html>
