[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "meta_analysis_agent"
version = "0.0.1"
description = "LLM-driven meta-analysis data extraction with UI-first workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nanyu Luo", email = "n.luo@mail.utoronto.ca" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "google-genai>=0.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]
parquet = ["pyarrow>=15.0", "pandas>=2.2"]

# [project.scripts] mag = "mag.cli:main" — re-added in R5/R6 when mag/cli.py lands.
# Omitted now so the entry point isn't registered against a non-existent module.

[tool.hatch.build.targets.wheel]
packages = ["src/mag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"
markers = [
    "unit: fast, isolated unit tests",
    "integration: hit real systems (db, filesystem)",
    "e2e: full pipeline; require live Gemini + ssh gpu",
    "slow: deselect with '-m \"not slow\"'",
]
asyncio_mode = "auto"
